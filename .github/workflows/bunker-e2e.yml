name: bunker-e2e
on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: "30 6 * * *" # nightly 06:30 UTC

# Only one bunker-e2e run at a time: the matrix deploys to the SAME bunker
# agent/port (crier-lab:30011) and shares /tmp state on the self-hosted
# runner — parallel runs clobber each other's deployments (observed 2026-08-24:
# concurrent runs raced on tick-250/251 pushes). Newer runs cancel older ones
# (intermediate commits don't need battery evidence; the head commit does).
concurrency:
  group: bunker-e2e
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  docker-image:
    name: Build & publish image (ghcr)
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t ghcr.io/crier-dev/crier:${{ github.sha }} -t ghcr.io/crier-dev/crier:latest .
      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
      - name: Push
        run: docker push ghcr.io/crier-dev/crier:${{ github.sha }} && docker push ghcr.io/crier-dev/crier:latest

  bunker-matrix:
    name: Bunker config-matrix E2E
    runs-on: [self-hosted, bunker]
    needs: docker-image
    if: always() && (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || (github.event_name == 'push' && needs.docker-image.result == 'success'))
    env:
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      EVIDENCE: /tmp/bunker-matrix-ci.jsonl
      BUNKER_AGENT: ${{ secrets.BUNKER_AGENT }}
      BUNKER_SERVER: ${{ secrets.BUNKER_SERVER }}
      BUNKER_HOST: ${{ secrets.BUNKER_HOST }}
      SINK_URL: ${{ secrets.SINK_URL }}
    steps:
      - uses: actions/checkout@v4
      - name: Ensure bunker agent exists + heartbeat
        run: |
          $HOME/go/bin/bunker info "$BUNKER_AGENT" --server "$BUNKER_SERVER" >/dev/null 2>&1 \
            || $HOME/go/bin/bunker spawn "$BUNKER_AGENT" --server "$BUNKER_SERVER" --ttl 720h
          $HOME/go/bin/bunker heartbeat "$BUNKER_AGENT" --server "$BUNKER_SERVER"
      - name: Deploy container to bunker + run config-matrix battery
        run: |
          bash scripts/bunker-matrix.sh --host "$BUNKER_HOST" --port 30011 \
            --agent "$BUNKER_AGENT" --server "$BUNKER_SERVER" --sink "$SINK_URL"
      - name: Attach evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bunker-matrix-evidence
          path: /tmp/bunker-matrix-ci.jsonl

  ecosystem-battery:
    name: Agent-ecosystem battery (compose stack)
    runs-on: [self-hosted, bunker]
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    env:
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      CRIER_HOST_PORT: "28767"
      SINK_HOST_PORT: "29002"
      PI_HOST_PORT: "29101"
      OPENCODE_HOST_PORT: "29102"
    steps:
      - uses: actions/checkout@v4
      - name: Bring up the ecosystem stack + run the full battery
        run: |
          cd examples/agent-ecosystem
          docker compose up -d --build
          docker compose run --rm battery
      - name: Capture battery evidence
        if: always()
        run: |
          docker compose -f examples/agent-ecosystem/docker-compose.yml run --rm --no-deps battery \
            sh -c 'cat /evidence/ecosystem.jsonl' > /tmp/ecosystem-evidence.jsonl || true
      - name: Attach evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ecosystem-evidence
          path: /tmp/ecosystem-evidence.jsonl
