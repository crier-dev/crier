name: bunker-e2e
on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: "30 6 * * *" # nightly 06:30 UTC

# INT-CI-019: bound the verdict channel. GitHub keeps at most one running plus
# one pending run per concurrency group and cancels the older pending one, so a
# per-ref group means a queued push is superseded by the next push instead of
# stacking forever behind a runner that is not consuming work. The workflow name
# is part of the group so it cannot collide with another workflow's group, and
# the event class is part of it so a push never shares a cancellation domain
# with — and so can never cancel — a scheduled/nightly or manual run.
# cancel-in-progress is evaluated only for push events. Job-level groups below
# serialize the bunker target and compose stack across those workflow groups.
concurrency:
  group: bunker-e2e-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

permissions:
  contents: read
  packages: write

jobs:
  docker-image:
    name: Build & publish image (ghcr)
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN || github.token }}
      - name: Build image
        run: docker build -t ghcr.io/crier-dev/crier:${{ github.sha }} -t ghcr.io/crier-dev/crier:latest .
      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
      - name: Push
        run: docker push ghcr.io/crier-dev/crier:${{ github.sha }} && docker push ghcr.io/crier-dev/crier:latest

  bunker-matrix:
    name: Bunker config-matrix E2E
    runs-on: [self-hosted, bunker]
    needs: docker-image
    if: always() && (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || (github.event_name == 'push' && needs.docker-image.result == 'success'))
    # Every event deploys to crier-lab:30011. Serialize the bunker target across
    # ALL events: the runner consumes a matrix run in ~90s, so queueing is cheap,
    # and cancel-in-progress here is what kept cancelling the queued matrix legs
    # of dispatch runs (INT-CI-031/AC4) every time a foreman push landed mid-queue.
    # A dead runner stacking runs forever is the failure this guards against —
    # watch runner liveness instead of cancelling peers.
    concurrency:
      group: bunker-e2e-target
      cancel-in-progress: false
    env:
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      EVIDENCE: /tmp/bunker-matrix-ci.jsonl
      BUNKER_AGENT: ${{ secrets.BUNKER_AGENT }}
      BUNKER_SERVER: ${{ secrets.BUNKER_SERVER }}
      BUNKER_HOST: ${{ secrets.BUNKER_HOST }}
      SINK_URL: ${{ secrets.SINK_URL }}
    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN || github.token }}
      - name: Ensure bunker agent exists + heartbeat
        run: |
          "$HOME/go/bin/bunker" info "$BUNKER_AGENT" --server "$BUNKER_SERVER" >/dev/null 2>&1 \
            || "$HOME/go/bin/bunker" spawn "$BUNKER_AGENT" --server "$BUNKER_SERVER" --ttl 720h
          "$HOME/go/bin/bunker" heartbeat "$BUNKER_AGENT" --server "$BUNKER_SERVER"
      # INT-CI-020: prove the isolation this battery ASSUMES before deploying
      # anything. The flag alone is not a boundary — on a daemon that predates
      # the network-isolation surface `bunker spawn --network-mode systemd` is
      # accepted and silently ignored, so the battery would measure the host.
      # Opt-in (BUNKER_NETWORK_MODE): unset means the workflow makes no
      # isolation claim, and the gate is not run.
      - name: Verify network isolation (opt-in)
        run: |
          if [ -z "${BUNKER_NETWORK_MODE:-}" ]; then
            echo "BUNKER_NETWORK_MODE unset — the battery makes no isolation claim; gate not run"
            exit 0
          fi
          bash scripts/bunker-isolation-gate.sh verify \
            --agent "$BUNKER_AGENT" --server "$BUNKER_SERVER" --mode "$BUNKER_NETWORK_MODE"
      - name: Deploy container to bunker + run config-matrix battery
        run: |
          bash scripts/bunker-matrix.sh --host "$BUNKER_HOST" --port 30011 \
            --agent "$BUNKER_AGENT" --server "$BUNKER_SERVER" --sink "$SINK_URL"
      - name: Attach evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: bunker-matrix-evidence
          path: /tmp/bunker-matrix-ci.jsonl

  ecosystem-battery:
    name: Agent-ecosystem battery (compose stack)
    runs-on: [self-hosted, bunker]
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    # One compose project owns these ports and /tmp evidence at a time. Queue
    # every battery to completion; push jobs use a different concurrency group.
    concurrency:
      group: bunker-e2e-ecosystem
      cancel-in-progress: false
    env:
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      # claude-code cell rides DeepSeek's Anthropic-compatible endpoint (owner
      # directive 2026-11-07: no Anthropic key needed to prove the harness —
      # repoint to DeepSeek). The compose service defaults ANTHROPIC_BASE_URL to
      # that endpoint and consumes ANTHROPIC_AUTH_TOKEN as the credential.
      ANTHROPIC_AUTH_TOKEN: ${{ secrets.DEEPSEEK_API_KEY }}
      # Opt every live cell in — all of them ride DeepSeek now (owner directive
      # 2026-11-07: no Anthropic/OpenAI keys needed to prove the harness).
      CLAUDE_CODE_LIVE: "1"
      OPENCODE_LIVE: "1"
      AIDER_LIVE: "1"
      CODEX_LIVE: "1"
      GOOSE_LIVE: "1"
      # The claude-code SDK flow needs more than the 20s default (CLI startup +
      # tool-use turn). crier's delivery budget is 30s and the consumer rejects
      # anything above 25000, so this is the max legal value.
      RUNTIME_TIMEOUT_MS: "25000"
      CRIER_HOST_PORT: "28767"
      SINK_HOST_PORT: "29002"
      PI_HOST_PORT: "29101"
      OPENCODE_HOST_PORT: "29102"
    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN || github.token }}
      - name: Sanity — docker compose plugin present (DF-CRIER-187)
        run: |
          . scripts/lib/require-docker-compose.sh && require_docker_compose
      - name: Bring up the ecosystem stack + run the full battery
        run: |
          cd examples/agent-ecosystem
          docker compose up -d --build
          # `run` never rebuilds an existing battery image (see the battery
          # service comment), so edits to battery.sh silently never shipped —
          # every dispatch ran the copy baked in at first build. Rebuild it
          # explicitly each run.
          docker compose --profile battery build battery
          docker compose --profile battery run --rm battery
      - name: Capture battery evidence
        if: always()
        run: |
          docker compose -f examples/agent-ecosystem/docker-compose.yml --profile battery run --rm --no-deps \
            --entrypoint cat battery /evidence/ecosystem.jsonl > /tmp/ecosystem-evidence.jsonl || true
      - name: Attach evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ecosystem-evidence
          path: /tmp/ecosystem-evidence.jsonl
