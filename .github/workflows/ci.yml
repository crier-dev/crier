name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ["1.26.6"]

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Go ${{ matrix.go-version }}
        uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go-version }}

      # INT-CI-008: validate the checked-in payloads used by every ecosystem
      # registration entrypoint against the production strict webhook decoder.
      # This is intentionally first and needs no Docker, network, runner, or key.
      - name: Agent-ecosystem registration contract
        run: go test -count=1 ./internal/ci

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -short -count=1 ./...

      # QA-CRIER-9: the example harnesses must refuse to run against a server
      # they did not start. The selftest picks its own free port (never a fixed
      # one), so this cannot flake on a busy runner.
      - name: Demo-harness port-guard selftest
        run: make port-guard-selftest

      # QA-CRIER-10: every example runner that starts a scratch service must
      # CHOOSE its port (bounded candidate rotation with holder evidence, a named
      # failure when they are all occupied, a caller-named port checked and never
      # rotated) instead of binding one fixed default. This proves the RUNNERS are
      # wired to the selector: source invariants for all five, plus live
      # rotate / exhaust / explicit arms for federation-demo, hermes-gateway-demo
      # and ws-mesh-demo. No provider, no key, no network; every fixture port is
      # picked free by the selftest itself, so a busy runner cannot make it flake.
      - name: Scratch-port rotation selftest
        run: make scratch-port-rotation-selftest

      # CR-FEAT-027: the signing-ceremony acceptance drive. `crier keygen` plus
      # the first-party Python and TypeScript clients complete a full signed
      # round-trip (register → deliver → signed retrieve → signed ack → signed
      # stats → relay publish/subscribe) against a server this target builds,
      # starts on a port the shared selector CHOOSES, asserts ownership of and
      # reaps on exit. The negative controls (an unsigned call and a
      # wrongly-signed call are both refused) are what keep the green honest: a
      # server that ignored signatures would pass every positive step and fail
      # those two. No provider, no key, no network, no crypto tooling: openssl
      # and xxd are never invoked, and the Python client needs no packages.
      # The TypeScript arm runs when the runner's node is >= 22.6 and is SKIPPED
      # LOUDLY (naming the version found and the version needed) when it is not,
      # so an old runner is a visible skip rather than a red build.
      - name: Client round-trip (crier keygen + Python/TS clients, no openssl)
        run: make client-roundtrip-check

      # CR-FEAT-028: the release front door's acceptance drive. `gh release view
      # v0.1.0-rc2` returned `assets: []`, so the only way in was clone + a Go
      # toolchain + `make build`. This step builds the asset set the release now
      # publishes (every release target, so a target that stops compiling fails
      # here rather than at release time), serves it over a scratch port as a
      # release tree, and installs from it into a CLEAN BOX — `env -i`, its own
      # HOME, and a PATH whose `go` is a SHIM that exits 127 and logs the call,
      # so "installs without a Go toolchain" is proven POSITIVELY instead of
      # assumed from an absent `go`. The installed binary is then run (/health,
      # /version, a registration, an inbox delivery, on a port the shared
      # selector chose and the script asserted it owns). Both negative controls
      # are load-bearing: a TAMPERED artifact and a manifest with NO ENTRY for
      # the binary must each be refused BY NAME — a front door that installs an
      # unverified download is worse than no front door. A `gh` PATH shim then
      # proves the publish command carries every asset of the set. No network, no
      # docker, no keys, and the fake ports are picked free by the script itself.
      - name: Release front door (asset set + clean-box install)
        run: make install-path-selftest

      # INT-CI-001: ONE transient ssh/scp reset on the deploy leg used to kill the
      # whole bunker-e2e battery with no retry and no attribution — run 35302932314
      # lost the `blocking` cell, and every probe in it, before a single request was
      # sent. This drives the retry and the classifier of
      # scripts/lib/transport-retry.sh on PATH shims only (no ssh, no scp, no docker,
      # no bunker host, no network), proves each arm by COUNTING the attempts the
      # shim saw, and includes a neuter proof, so the green is earned and cannot
      # flake on a busy runner.
      - name: Deploy-leg transport retry selftest
        run: make transport-retry-selftest

      # DF-CRIER-254: the repo had no bounded load path, so a load-dependent
      # reproduction was driven by an ad-hoc burn loop whose units outlived
      # every caller (loadavg 220-346 on the shared host). This selftest proves
      # the harness that replaces it: worker/lifetime caps REFUSE out-of-range
      # requests, the load-average gate SKIPS with a recorded reason, teardown
      # leaves no survivor even after SIGKILL of the runner, and a NEUTER proof
      # keeps the no-survivor reading non-vacuous. Fixtures are <= 2 workers /
      # <= 2 s, so the step adds seconds, not load.
      - name: Bounded load-harness selftest
        run: make load-repro-selftest

      # CR-FEAT-033: the capacity soak publishes numbers (docs/capacity-ceiling.md)
      # taken from a real crier server, so both the harness and the published
      # numbers are gated here. The selftest proves the soak's bounds are real —
      # every cap REFUSES out-of-range requests, the load gate SKIPS a busy host
      # before a server is started, an exhausted wall-clock budget stops the run
      # instead of continuing, a real 2-agent soak verifies its own measurement
      # (frames delivered == frames expected, mesh peers == sockets opened, the
      # 100/min cap observed) and leaves no server process or listener behind —
      # with a NEUTER proof so the refusal cannot be vacuous. Everything it runs
      # is a 2-agent / sub-second fixture except the bounded-stop proof, whose
      # whole point is that it stops. `make load-soak` then drives the same
      # harness end to end against a built server on every push.
      - name: Capacity soak selftest
        run: make load-soak-selftest

      - name: Capacity soak smoke (2 agents, bounded)
        # The soak's own load gate honours the repo's 8.0 loadavg rule and SKIPS a
        # busy host (exit 3) — correct for an operator, but a CI step must not
        # depend on the runner being idle, so the gate is raised explicitly here.
        # The fixture is a 2-agent, sub-second measurement (no burn loop), so it
        # cannot load a shared runner.
        run: make load-soak LOAD_SOAK_THRESHOLD=64

      # DF-CRIER-206: Tier 1 (secrets/go_build/go_lint/go_tests) never reads a
      # shell script or a workflow YAML, so before this step a .sh/.yml-only push
      # got a `Tier 1 Guards: PASS` that verified nothing about it. The checker
      # runs over every tracked file: `bash -n` on each shell script and
      # actionlint (or the PyYAML parse fallback) on each workflow. It PRINTS the
      # mode and tool version it used and exits 2 when neither validator exists,
      # so the fallback is never a silent skip. actionlint is not preinstalled on
      # the runner, so it is built here when the toolchain allows — if that fails,
      # the PyYAML arm runs and says so in the log. The selftest then proves the
      # checker still rejects a broken script/workflow on this runner.
      - name: Shell + workflow YAML check
        run: |
          command -v actionlint >/dev/null 2>&1 || GOBIN="$HOME/go/bin" go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 || true
          export PATH="$HOME/go/bin:$PATH"
          python3 -c 'import yaml' 2>/dev/null || python3 -m pip install --quiet --user pyyaml || true
          make shell-yaml-check
          make shell-yaml-selftest

      # DF-CRIER-278: the tier-2 judge's input budget is the most expensive knob in
      # the repo, and a board-only diff has nothing in it a larger budget would
      # resolve (measured tick 365: two tier-2 runs on three .coding-hermes JSONL
      # files and zero source files used 33.8M and 48.1M tokens_in against a normal
      # source-diff judge's 188K-706K; the second run died INCOMPLETE at the 48.0M
      # cap). This step proves the fail-closed classifier that authorizes
      # `gitreins task complete --skip-tier2` for such a diff — and the neuter proof
      # that a verdict-forced copy of it cannot pass the selftest. Synthetic path
      # lists only: no git, no network, no fixtures beyond a scratch dir, so it
      # cannot flake on a busy runner.
      - name: Judge diff classifier selftest
        run: make judge-diff-class-selftest

      # DF-CRIER-209: Tier 1 never reads a Makefile recipe or a Dockerfile, and
      # the shell/YAML step above reads only shell scripts and workflow YAML — so
      # a Makefile-only or Dockerfile-only push used to get a green that verified
      # nothing about it. This checks every tracked Makefile (a `make -n`
      # dry-parse over a target list derived from the file) and every Dockerfile
      # (hadolint when it is on PATH, otherwise the built-in python3 structural
      # parse). The engine that ran is printed every run and a missing validator
      # is exit 2, never a silent skip. hadolint is not preinstalled on the
      # runner, so it is fetched here when the toolchain allows — if that fails,
      # the built-in parse still runs and says so in the log. The selftest then
      # proves the checker still rejects a broken Makefile / malformed Dockerfile
      # on this runner.
      - name: Makefile + Dockerfile check
        run: |
          command -v hadolint >/dev/null 2>&1 || { mkdir -p "$HOME/.local/bin" && curl -fsSL -o "$HOME/.local/bin/hadolint" https://github.com/hadolint/hadolint/releases/latest/download/hadolint-Linux-x86_64 && chmod +x "$HOME/.local/bin/hadolint"; } || true
          export PATH="$HOME/.local/bin:$PATH"
          make make-docker-check
          make make-docker-selftest

      # DF-CRIER-189: Tier 1 never read formatting — go_lint is `go vet`, which
      # reports suspicious constructs, not layout — so a drifting file could be
      # pushed on a green that verified nothing about it (measured: `gofmt -l`
      # named two files while the guard printed PASS). This runs `gofmt -l` over
      # every tracked .go file and rejects any file whose path comes back, with
      # its bounded diff; gofmt ships with the Go toolchain set up above, and the
      # checker prints the gofmt path and Go version it used, exits 2 when gofmt
      # is missing, and refuses a vacuous PASS over 0 files. The selftest then
      # proves the checker still rejects a drifting fixture (including a neuter
      # proof) on this runner.
      - name: Go formatting check (gofmt)
        run: |
          make gofmt-check
          make gofmt-selftest

      # CR-GAP-069: a runnable demo (or an ad-hoc dogfood script) that backgrounds a
      # crier server with no EXIT trap leaks the process and the port, and nothing in
      # the repo noticed — the dogfood federation demo left two orphans on
      # :18767/:18877 for a human to reap. This arm is the notice: it classifies a
      # tracked shell script as server-spawning only when the text really spawns a
      # server (a mention — a comment, a heredoc, a fatal message, a grep pattern, a
      # `go build` — never classifies) and then requires BOTH an EXIT trap that kills
      # the pid it started and, for a port-binding run, an ownership assertion that
      # the port's holder IS that pid. A bounded run (timeout on the spawn, or a
      # `timeout … bash -c` launcher) is exempt from the trap — its timeout is the
      # reaping mechanism. The check is static text analysis: it starts no server and
      # signals no process, so it cannot disturb the live servers a shared runner may
      # be carrying. It fails closed (a nonexistent path, a non-shell path, a list in
      # which nothing classifies, an empty default scope) rather than printing a green
      # over files it never read, and the selftest proves the rejection path — on the
      # real tree and on fixtures — including a neuter proof.
      - name: Demo server-spawn cleanup check
        run: |
          make demo-cleanup-check
          make demo-cleanup-selftest

      # DF-CRIER-281 — CR-GAP-069's ask #2, the TICK-START ORPHAN SWEEP. The step
      # above reads TRACKED shell scripts, so it is blind to the leak shape that
      # actually costs the shared host: an ad-hoc dogfood/QA run whose compose file
      # lives under /tmp and which leaves containers and a scratch-range port behind.
      # scripts/orphan-sweep.sh reports them (dogfood-* by name, or any compose
      # config under /tmp/; plus every ss -tlnp listener in 8000-29000 — the low bound
      # covers the `crier -port 8767` leak class — with its holder pid, process name,
      # holder age and full command line) and NEVER fixes anything — no
      # stop, no rm, no kill, no prune — and its findings never change its exit code.
      # This step runs the SELFTEST only, never the live sweep: a CI runner has no
      # docker daemon and no dogfood stacks, and the selftest drives the real script
      # against STUB docker/ss executables on PATH, so it proves the classification
      # rules, the fail-closed paths (missing docker, missing ss, a FAILING docker, an
      # invalid range), the range filter and its env override, the default range covering
      # the 8767 leak class, the port-age column, the empty-host path and THREE neuter
      # proofs — and, from the stubs' log of every invocation, that no
      # mutating verb was even invoked.
      - name: Tick-start orphan sweep selftest
        run: make orphan-sweep-check

      # DF-CRIER-137: the documented way to launch the MCP bridge
      # (`make build-mcp && ./bin/crier-mcp`, README + integration guide) feeds a
      # strict MCP stdio client, and the `build-mcp` recipe was not prefixed with
      # `@` — so make echoed the recipe line to STDOUT before any JSON-RPC frame
      # and the handshake failed (the same finding was filed three times:
      # DF-CRIER-66, DF-CRIER-91, DF-CRIER-137). This runs the documented
      # launcher(s) for real, with one `initialize` frame on stdin, and requires
      # the FIRST stdout line to be the initialize response — the bridge's own
      # logging is on stderr, where a client cannot read it. The selftest proves
      # the checker still rejects a launcher that contaminates stdout, refuses one
      # that prints nothing at all (never a green over nothing), and includes a
      # neuter proof, so this step cannot pass vacuously.
      - name: MCP launcher stdout check
        run: |
          make mcp-stdout-selftest
          make mcp-stdout-check

  test-coverage:
    name: Coverage (Go 1.26.6)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.6"

      - name: Test with coverage
        run: go test -short -count=1 -coverprofile=coverage.out ./...

      - name: Coverage report
        run: go tool cover -func=coverage.out

      - name: Check coverage threshold
        run: make coverage-check

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v6
        with:
          name: coverage-report
          path: coverage.out

  integration:
    name: Integration Tests (registry / PostgresStore)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.6"

      - name: Run PostgresStore integration tests
        run: go test -tags=integration -count=1 -v ./internal/registry/
        env:
          TESTCONTAINERS_RYUK_DISABLED: "true"

  openapi-spec-validator:
    name: OpenAPI Spec Validator
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.6"

      - name: Verify embedded spec matches docs (no drift)
        run: |
          go generate ./cmd/server
          cmp cmd/server/openapi.yaml docs/openapi.yaml

      - name: Validate docs/openapi.yaml and served /openapi.json
        run: go test -short -count=1 -run 'TestOpenAPI|TestDocsClaims' ./cmd/server
