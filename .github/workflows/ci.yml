name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ["1.26.6"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go ${{ matrix.go-version }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -short -count=1 ./...

      # QA-CRIER-9: the example harnesses must refuse to run against a server
      # they did not start. The selftest picks its own free port (never a fixed
      # one), so this cannot flake on a busy runner.
      - name: Demo-harness port-guard selftest
        run: make port-guard-selftest

      # DF-CRIER-206: Tier 1 (secrets/go_build/go_lint/go_tests) never reads a
      # shell script or a workflow YAML, so before this step a .sh/.yml-only push
      # got a `Tier 1 Guards: PASS` that verified nothing about it. The checker
      # runs over every tracked file: `bash -n` on each shell script and
      # actionlint (or the PyYAML parse fallback) on each workflow. It PRINTS the
      # mode and tool version it used and exits 2 when neither validator exists,
      # so the fallback is never a silent skip. actionlint is not preinstalled on
      # the runner, so it is built here when the toolchain allows — if that fails,
      # the PyYAML arm runs and says so in the log. The selftest then proves the
      # checker still rejects a broken script/workflow on this runner.
      - name: Shell + workflow YAML check
        run: |
          command -v actionlint >/dev/null 2>&1 || GOBIN="$HOME/go/bin" go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 || true
          export PATH="$HOME/go/bin:$PATH"
          python3 -c 'import yaml' 2>/dev/null || python3 -m pip install --quiet --user pyyaml || true
          make shell-yaml-check
          make shell-yaml-selftest

  test-coverage:
    name: Coverage (Go 1.26.6)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.6"

      - name: Test with coverage
        run: go test -short -count=1 -coverprofile=coverage.out ./...

      - name: Coverage report
        run: go tool cover -func=coverage.out

      - name: Check coverage threshold
        run: make coverage-check

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.out

  integration:
    name: Integration Tests (registry / PostgresStore)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.6"

      - name: Run PostgresStore integration tests
        run: go test -tags=integration -count=1 -v ./internal/registry/
        env:
          TESTCONTAINERS_RYUK_DISABLED: "true"

  openapi-spec-validator:
    name: OpenAPI Spec Validator
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.6"

      - name: Verify embedded spec matches docs (no drift)
        run: |
          go generate ./cmd/server
          cmp cmd/server/openapi.yaml docs/openapi.yaml

      - name: Validate docs/openapi.yaml and served /openapi.json
        run: go test -short -count=1 -run 'TestOpenAPI|TestDocsClaims' ./cmd/server
