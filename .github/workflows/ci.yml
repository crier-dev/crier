name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ["1.26.6"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go ${{ matrix.go-version }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}

      # INT-CI-008: validate the checked-in payloads used by every ecosystem
      # registration entrypoint against the production strict webhook decoder.
      # This is intentionally first and needs no Docker, network, runner, or key.
      - name: Agent-ecosystem registration contract
        run: go test -count=1 ./internal/ci

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -short -count=1 ./...

      # QA-CRIER-9: the example harnesses must refuse to run against a server
      # they did not start. The selftest picks its own free port (never a fixed
      # one), so this cannot flake on a busy runner.
      - name: Demo-harness port-guard selftest
        run: make port-guard-selftest

      # QA-CRIER-10: every example runner that starts a scratch service must
      # CHOOSE its port (bounded candidate rotation with holder evidence, a named
      # failure when they are all occupied, a caller-named port checked and never
      # rotated) instead of binding one fixed default. This proves the RUNNERS are
      # wired to the selector: source invariants for all five, plus live
      # rotate / exhaust / explicit arms for federation-demo, hermes-gateway-demo
      # and ws-mesh-demo. No provider, no key, no network; every fixture port is
      # picked free by the selftest itself, so a busy runner cannot make it flake.
      - name: Scratch-port rotation selftest
        run: make scratch-port-rotation-selftest

      # INT-CI-001: ONE transient ssh/scp reset on the deploy leg used to kill the
      # whole bunker-e2e battery with no retry and no attribution — run 35302932314
      # lost the `blocking` cell, and every probe in it, before a single request was
      # sent. This drives the retry and the classifier of
      # scripts/lib/transport-retry.sh on PATH shims only (no ssh, no scp, no docker,
      # no bunker host, no network), proves each arm by COUNTING the attempts the
      # shim saw, and includes a neuter proof, so the green is earned and cannot
      # flake on a busy runner.
      - name: Deploy-leg transport retry selftest
        run: make transport-retry-selftest

      # DF-CRIER-254: the repo had no bounded load path, so a load-dependent
      # reproduction was driven by an ad-hoc burn loop whose units outlived
      # every caller (loadavg 220-346 on the shared host). This selftest proves
      # the harness that replaces it: worker/lifetime caps REFUSE out-of-range
      # requests, the load-average gate SKIPS with a recorded reason, teardown
      # leaves no survivor even after SIGKILL of the runner, and a NEUTER proof
      # keeps the no-survivor reading non-vacuous. Fixtures are <= 2 workers /
      # <= 2 s, so the step adds seconds, not load.
      - name: Bounded load-harness selftest
        run: make load-repro-selftest

      # DF-CRIER-206: Tier 1 (secrets/go_build/go_lint/go_tests) never reads a
      # shell script or a workflow YAML, so before this step a .sh/.yml-only push
      # got a `Tier 1 Guards: PASS` that verified nothing about it. The checker
      # runs over every tracked file: `bash -n` on each shell script and
      # actionlint (or the PyYAML parse fallback) on each workflow. It PRINTS the
      # mode and tool version it used and exits 2 when neither validator exists,
      # so the fallback is never a silent skip. actionlint is not preinstalled on
      # the runner, so it is built here when the toolchain allows — if that fails,
      # the PyYAML arm runs and says so in the log. The selftest then proves the
      # checker still rejects a broken script/workflow on this runner.
      - name: Shell + workflow YAML check
        run: |
          command -v actionlint >/dev/null 2>&1 || GOBIN="$HOME/go/bin" go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 || true
          export PATH="$HOME/go/bin:$PATH"
          python3 -c 'import yaml' 2>/dev/null || python3 -m pip install --quiet --user pyyaml || true
          make shell-yaml-check
          make shell-yaml-selftest

      # DF-CRIER-209: Tier 1 never reads a Makefile recipe or a Dockerfile, and
      # the shell/YAML step above reads only shell scripts and workflow YAML — so
      # a Makefile-only or Dockerfile-only push used to get a green that verified
      # nothing about it. This checks every tracked Makefile (a `make -n`
      # dry-parse over a target list derived from the file) and every Dockerfile
      # (hadolint when it is on PATH, otherwise the built-in python3 structural
      # parse). The engine that ran is printed every run and a missing validator
      # is exit 2, never a silent skip. hadolint is not preinstalled on the
      # runner, so it is fetched here when the toolchain allows — if that fails,
      # the built-in parse still runs and says so in the log. The selftest then
      # proves the checker still rejects a broken Makefile / malformed Dockerfile
      # on this runner.
      - name: Makefile + Dockerfile check
        run: |
          command -v hadolint >/dev/null 2>&1 || { mkdir -p "$HOME/.local/bin" && curl -fsSL -o "$HOME/.local/bin/hadolint" https://github.com/hadolint/hadolint/releases/latest/download/hadolint-Linux-x86_64 && chmod +x "$HOME/.local/bin/hadolint"; } || true
          export PATH="$HOME/.local/bin:$PATH"
          make make-docker-check
          make make-docker-selftest

      # DF-CRIER-189: Tier 1 never read formatting — go_lint is `go vet`, which
      # reports suspicious constructs, not layout — so a drifting file could be
      # pushed on a green that verified nothing about it (measured: `gofmt -l`
      # named two files while the guard printed PASS). This runs `gofmt -l` over
      # every tracked .go file and rejects any file whose path comes back, with
      # its bounded diff; gofmt ships with the Go toolchain set up above, and the
      # checker prints the gofmt path and Go version it used, exits 2 when gofmt
      # is missing, and refuses a vacuous PASS over 0 files. The selftest then
      # proves the checker still rejects a drifting fixture (including a neuter
      # proof) on this runner.
      - name: Go formatting check (gofmt)
        run: |
          make gofmt-check
          make gofmt-selftest

      # DF-CRIER-137: the documented way to launch the MCP bridge
      # (`make build-mcp && ./bin/crier-mcp`, README + integration guide) feeds a
      # strict MCP stdio client, and the `build-mcp` recipe was not prefixed with
      # `@` — so make echoed the recipe line to STDOUT before any JSON-RPC frame
      # and the handshake failed (the same finding was filed three times:
      # DF-CRIER-66, DF-CRIER-91, DF-CRIER-137). This runs the documented
      # launcher(s) for real, with one `initialize` frame on stdin, and requires
      # the FIRST stdout line to be the initialize response — the bridge's own
      # logging is on stderr, where a client cannot read it. The selftest proves
      # the checker still rejects a launcher that contaminates stdout, refuses one
      # that prints nothing at all (never a green over nothing), and includes a
      # neuter proof, so this step cannot pass vacuously.
      - name: MCP launcher stdout check
        run: |
          make mcp-stdout-selftest
          make mcp-stdout-check

  test-coverage:
    name: Coverage (Go 1.26.6)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.6"

      - name: Test with coverage
        run: go test -short -count=1 -coverprofile=coverage.out ./...

      - name: Coverage report
        run: go tool cover -func=coverage.out

      - name: Check coverage threshold
        run: make coverage-check

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.out

  integration:
    name: Integration Tests (registry / PostgresStore)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.6"

      - name: Run PostgresStore integration tests
        run: go test -tags=integration -count=1 -v ./internal/registry/
        env:
          TESTCONTAINERS_RYUK_DISABLED: "true"

  openapi-spec-validator:
    name: OpenAPI Spec Validator
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.6"

      - name: Verify embedded spec matches docs (no drift)
        run: |
          go generate ./cmd/server
          cmp cmd/server/openapi.yaml docs/openapi.yaml

      - name: Validate docs/openapi.yaml and served /openapi.json
        run: go test -short -count=1 -run 'TestOpenAPI|TestDocsClaims' ./cmd/server
