name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ["1.26.6"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go ${{ matrix.go-version }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -short -count=1 ./...

  test-coverage:
    name: Coverage (Go 1.26.6)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.6"

      - name: Test with coverage
        run: go test -short -count=1 -coverprofile=coverage.out ./...

      - name: Coverage report
        run: go tool cover -func=coverage.out

      - name: Check coverage threshold
        run: make coverage-check

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.out

  integration:
    name: Integration Tests (registry / PostgresStore)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.6"

      - name: Run PostgresStore integration tests
        run: go test -tags=integration -count=1 -v ./internal/registry/
        env:
          TESTCONTAINERS_RYUK_DISABLED: "true"

  openapi-spec-validator:
    name: OpenAPI Spec Validator
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.6"

      - name: Verify embedded spec matches docs (no drift)
        run: |
          go generate ./cmd/server
          cmp cmd/server/openapi.yaml docs/openapi.yaml

      - name: Validate docs/openapi.yaml and served /openapi.json
        run: go test -short -count=1 -run 'TestOpenAPI' ./cmd/server
