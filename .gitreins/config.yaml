guards:
  secrets: true
  lint: false
  tests: false
  test_mode: full
  test_command: go test -short -count=1 ./...
  go:
    build: true
    lint: true
    tests: true
  test_timeout: 300

pipeline:
  stages:
    - id: tier1
      parallel: true
      on: [pre-commit, pre-eval]
      steps:
        - id: guard
          type: script
          run: "gitreins guard"
          on_fail: block
    - id: tier2
      type: ai_eval
      on: [pre-eval]
      condition: "true"
      max_iterations: 100
      tools: [read_file, run_command, search_pattern, read_diff, sandbox]

evaluator:
  max_iterations: 100
  max_time: "10m"
  max_input_tokens: "1M"
  max_output_tokens: "384k"
  tool_call_weight: 0.1

defaults:
  model: deepseek-v4-flash
  max_iterations: 100
  check_for_updates: true
  update_check_ttl: "24h"

history:
  enabled: true
  storage: git
  max_verdicts: 1000
