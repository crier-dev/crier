guards:
  secrets: true
  lint: false
  tests: false
  test_mode: full
  test_command: go test -short -count=1 ./...
  go:
    build: true
    lint: true
    tests: true
  test_timeout: 300
pipeline:
  stages:
  - id: tier1
    parallel: true
    true:
    - pre-commit
    - pre-eval
    steps:
    - id: guard
      type: script
      run: gitreins guard
      on_fail: block
  - id: tier2
    type: ai_eval
    true:
    - pre-eval
    condition: 'true'
    # max_iterations 100 -> 250 (tick 277, CR-GAP-057): this per-stage value is
    # the one that BINDS — the evaluator block below did not loosen the cap. Two
    # consecutive CR-GAP-057 judge runs (ff564a78, 74c0589f) collected a complete
    # pass-side evidence set (all five content criteria + docs-check/build/vet/
    # test/guard) and still ended without a terminal verdict, returning
    # INCOMPLETE / "evaluation hit resource cap".
    # max_iterations 250 -> 400 (tick 301, DF-CRIER-177): the 250 rung starved
    # again on a 6-criterion code+docs row — "Cap exceeded: Iteration cap (250)
    # reached (250.9 used)" with tier1 PASS and a COMPLETE-looking evidence set
    # (verdict 4056747b / printed id 26025e26). MEASURED burn from
    # .gitreins/usage.jsonl for that run: 13,434,405 tokens_in / 250 iterations
    # = ~53.7K tokens per iteration. The exhausted knob was ITERATIONS only
    # (13.4M < the 16M token budget), so the rung moves on both knobs in ONE
    # commit: 400 iterations projects ~21.5M tokens_in, which is why the input
    # budget below moved to 24M in the SAME change instead of burning a second
    # 6-minute judge on the token cap (fleet doctrine: raise the starved rung
    # and size the neighbouring knob from measured burn, never from a guess).
    # max_iterations 400 -> 600 (tick 353, DF-CRIER-40): the 400 rung starved on
    # a 4-file mesh+docs row — "Cap exceeded: Iteration cap (400) reached
    # (400.6 used)" with tier1 PASS (verdict 788c0b69). Burn basis unchanged
    # (~53.7K tokens_in/iter, tick 301 measurement): 600 iterations projects
    # ~32M tokens_in, under the 48M input budget, so only this knob moves.
    max_iterations: 600
    tools:
    - read_file
    - run_command
    - search_pattern
    - read_diff
    - sandbox
evaluator:
  # file_scope: full — "changed" derives the allowed-file set from staged+unstaged
  # diffs ONLY; with Bane-pending uncommitted work in the tree (internal/mcp/* etc.)
  # a committed task change is invisible to the judge → false FAIL (tick 245
  # incident, verdict 22816b13). Full scope lets the judge read the whole repo.
  file_scope: full
  # max_iterations 50 -> 120 (tick 277, CR-GAP-057): the judge verified all five
  # content criteria of the README truth pass and then hit the iteration cap
  # BEFORE it could execute the acceptance gate commands, returning
  # "INCOMPLETE — Partial verdict" (verdict ff564a78) on work whose gates are
  # green. 50 iterations is not enough for a docs row whose criteria each need a
  # grep plus a live probe plus the four gate commands.
  # max_iterations 120 -> 400 (tick 301, DF-CRIER-177): aligned with the tier2
  # stage block in the same commit. The MIN(stage, evaluator) gate means a
  # smaller value here could silently re-cap the stage knob it was just raised
  # to (warpfs lesson), so every iteration knob moves together — one place
  # stating 400 and another still stating 120 is exactly the shape that makes a
  # raise invisible.
  # max_iterations 400 -> 600 (tick 353, DF-CRIER-40): aligned with the tier2
  # stage block in the same change — the MIN(stage, evaluator) gate means both
  # knobs move together (warpfs lesson, tick 301).
  max_iterations: 600
  # max_time 20m -> 30m (tick 280, CR-GAP-060): measured burn rate ~1M input
  # tokens per minute (the 9.0M starved run below ran ~9 min), so a 12M budget
  # needs headroom past the old 20m wall instead of starving on a third knob.
  max_time: 30m
  # max_input_tokens 6M -> 9M (tick 278, CR-GAP-058): the CR-GAP-058 judge
  # (verdict 4e647851) collected a full tier1 PASS and then consumed the whole
  # configured budget — "Eval cap exceeded: Input token budget (6.0M) exceeded
  # (6.0M used)" → tier2 INCOMPLETE. used == configured cap is budget
  # STARVATION, not the model window (deepseek-v4-flash is 1M per call), so the
  # rung moves up; 9M is the fleet-proven rung after 6M (hermes-canopy PL-01-P1).
  # 9M -> 12M (tick 280, CR-GAP-060): the T6 judge (verdict cadc2916) starved
  # again on the same signature — .gitreins/usage.jsonl recorded 9,019,468
  # tokens_in for that tier2 run against the 9M cap (100.2% of budget), a
  # measured burn, not a guess. Fix direction is UP (exact-equality starvation);
  # 12M is one 33% rung above the exhausted one.
  # 12M -> 16M (tick 283, CR-GAP-061): the T7 close-out judge (verdict d4344c19)
  # starved on the identical signature — .gitreins/usage.jsonl shows 12,010,849
  # tokens_in against the 12M cap (exact-equality starvation again, and the
  # off-by-one class gitreins-tier2-input-token-cap-exceeded prescribes raising
  # the rung rather than splitting criteria). 16M is one rung above the
  # exhausted budget.
  # 16M -> 24M (tick 301, DF-CRIER-177): sized from MEASURED burn, not a guess.
  # The 250-iteration rung was exhausted at 13,434,405 tokens_in (84% of the
  # 16M budget), i.e. ~53.7K tokens/iteration; the 400-iteration rung set in the
  # stage block above projects ~21.5M, so 16M would have starved the very next
  # run on the neighbouring knob. 24M carries ~12% headroom over that
  # projection. This rung is a PROBE: the next crier judge run that completes
  # with NO "Cap exceeded" line settles it — record its tokens_in and step the
  # budget down to the smallest sufficient value rather than leaving an
  # untested 24M in place.
  # 24M -> 48M (tick 309, DF-CRIER-150): the probe rung above starved on a
  # 7-file / +892-line change set (a 178-line guide section + 431 lines of new
  # tests): usage.jsonl recorded 24,030,089 tokens_in against the 24M cap and
  # tier2 returned INCOMPLETE with "Eval cap exceeded: Input token budget
  # (24.0M) exceeded (24.0M used)" after having PASSED two of the three
  # criteria — exact-equality starvation again, so the rung moves UP. This
  # run's measured burn was ~5M tokens_in/min (~5 min wall for 24M), so the
  # 30m max_time below still carries ~3x headroom and moves in the same commit
  # only if a future run starves on time.
  max_input_tokens: 48M
  max_output_tokens: 0.4M
  tool_call_weight: 0.1
  fast_track: auto

defaults:
  model: deepseek-v4-flash
  provider: deepseek-foreman
  api_key_env: GITREINS_LLM_API_KEY

history:
  enabled: true
  storage: git
  max_verdicts: 1000
