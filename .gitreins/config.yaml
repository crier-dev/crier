guards:
  secrets: true
  lint: false
  tests: false
  test_mode: full
  test_command: go test -short -count=1 ./...
  go:
    build: true
    lint: true
    tests: true
  test_timeout: 300
pipeline:
  stages:
  - id: tier1
    parallel: true
    true:
    - pre-commit
    - pre-eval
    steps:
    - id: guard
      type: script
      run: gitreins guard
      on_fail: block
  - id: tier2
    type: ai_eval
    true:
    - pre-eval
    condition: 'true'
    # max_iterations 100 -> 250 (tick 277, CR-GAP-057): this per-stage value is
    # the one that BINDS — the evaluator block below did not loosen the cap. Two
    # consecutive CR-GAP-057 judge runs (ff564a78, 74c0589f) collected a complete
    # pass-side evidence set (all five content criteria + docs-check/build/vet/
    # test/guard) and still ended without a terminal verdict, returning
    # INCOMPLETE / "evaluation hit resource cap".
    max_iterations: 250
    tools:
    - read_file
    - run_command
    - search_pattern
    - read_diff
    - sandbox
evaluator:
  # file_scope: full — "changed" derives the allowed-file set from staged+unstaged
  # diffs ONLY; with Bane-pending uncommitted work in the tree (internal/mcp/* etc.)
  # a committed task change is invisible to the judge → false FAIL (tick 245
  # incident, verdict 22816b13). Full scope lets the judge read the whole repo.
  file_scope: full
  # max_iterations 50 -> 120 (tick 277, CR-GAP-057): the judge verified all five
  # content criteria of the README truth pass and then hit the iteration cap
  # BEFORE it could execute the acceptance gate commands, returning
  # "INCOMPLETE — Partial verdict" (verdict ff564a78) on work whose gates are
  # green. 50 iterations is not enough for a docs row whose criteria each need a
  # grep plus a live probe plus the four gate commands.
  max_iterations: 120
  max_time: 20m
  max_input_tokens: 6M
  max_output_tokens: 0.4M
  tool_call_weight: 0.1
  fast_track: auto

defaults:
  model: deepseek-v4-flash
  provider: deepseek-foreman
  api_key_env: GITREINS_LLM_API_KEY

history:
  enabled: true
  storage: git
  max_verdicts: 1000
