guards:
  secrets: true
  lint: false
  tests: false
  test_mode: full
  test_command: go test -short -count=1 ./...
  go:
    build: true
    lint: true
    tests: true
  test_timeout: 300
pipeline:
  stages:
  - id: tier1
    parallel: true
    true:
    - pre-commit
    - pre-eval
    steps:
    - id: guard
      type: script
      run: gitreins guard
      on_fail: block
  - id: tier2
    type: ai_eval
    true:
    - pre-eval
    condition: 'true'
    max_iterations: 100
    tools:
    - read_file
    - run_command
    - search_pattern
    - read_diff
    - sandbox
evaluator:
  # file_scope: full — "changed" derives the allowed-file set from staged+unstaged
  # diffs ONLY; with Bane-pending uncommitted work in the tree (internal/mcp/* etc.)
  # a committed task change is invisible to the judge → false FAIL (tick 245
  # incident, verdict 22816b13). Full scope lets the judge read the whole repo.
  file_scope: full
  max_iterations: 50
  max_time: 10m
  max_input_tokens: 2M
  max_output_tokens: 0.4M
  tool_call_weight: 0.1
  fast_track: auto

defaults:
  model: deepseek-v4-flash
  provider: deepseek-foreman
  api_key_env: GITREINS_LLM_API_KEY

history:
  enabled: true
  storage: git
  max_verdicts: 1000
