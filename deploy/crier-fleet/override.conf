[Unit]
# OPS-CRIER-001: bound the restart loop.
# On 2026-11-23 the fleet bus crash-looped 2001x over 5h35m (wedged postgres
# crash recovery) because the base unit has no start limit. This override adds
# a burst limit: at most 12 restarts within 600s, after which systemd stops
# retrying (failed state) instead of looping forever. RestartSec=5 stays as
# configured in the base unit; nothing else changes. Config applies on the
# next natural restart of crier-fleet.service — the live unit is NOT restarted
# by this install (restarts are owner-gated).
StartLimitIntervalSec=600
StartLimitBurst=12
