# OPS-CRIER-001: user-level logrotate for the fleet bus log.
# On 2026-11-23 crier.log was 2.3 GB with no rotation (unit appends via
# StandardOutput=append:). Runs under the kara user with its own state file —
# see deploy/crier-fleet/crier-fleet-logrotate.service.
# copytruncate keeps the live crier-fleet writer going across rotation.
# OPS-CRIER-003: the fleet dispatcher log (dispatcher.log) is written by the
# same fleet-bus daemons and had no rotation rule either — same policy below.
/home/kara/crier-fleet/logs/crier.log {
    daily
    maxsize 512M
    rotate 7
    copytruncate
    compress
    missingok
    notifempty
    dateext
}
/home/kara/crier-fleet/logs/dispatcher.log {
    daily
    maxsize 512M
    rotate 7
    copytruncate
    compress
    missingok
    notifempty
    dateext
}
