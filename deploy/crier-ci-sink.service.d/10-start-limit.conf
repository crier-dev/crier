[Unit]
# OPS-CRIER-004: bound the restart loop.
#
# On 2026-11-20 an unmanaged copy of the sink took :19012 and was never adopted
# by systemd, so the supervised unit re-tried every 3 s for seven days
# (NRestarts 44745, 14695 "Address already in use" journal lines) while the
# function itself stayed up on the orphan. Restart=always with no burst limit
# means "cannot bind" is reported forever instead of a bounded number of times,
# and a real sink failure is buried in that churn.
#
# StartLimit* lives in [Unit] on modern systemd. It applies on the next natural
# restart; installing this drop-in does NOT restart the live unit.
StartLimitIntervalSec=600
StartLimitBurst=12
