# Agent-ecosystem stack — crier as the message bus between popular agent systems.
#
#   docker compose up -d          # crier + sink + pi-agent + opencode + claude-code + codex + aider + goose
#   docker compose --profile hermes up -d   # + hermes (requires hermes-agent:latest image)
#
# The battery is ONE-SHOT and profile-gated (DF-CRIER-88/90): a plain `up` starts the
# long-lived stack only and never runs the battery. Run it explicitly with:
#   docker compose --profile battery run --rm battery
# (`up` / `build` / `down` skip a profiled service, so name the profile. The `run` above
# builds the battery image on demand if it is missing and never rebuilds or recreates the
# rest of the stack. After editing battery.sh, rebuild just that image:
#   docker compose --profile battery build battery.)
#
# Config knobs:
#   DEEPSEEK_API_KEY=sk-...        # enable the LLM guard with the deepseek preset (real verdicts)
#   CRIER_HOST_PORT=18767          # host port for crier (bunker agents: use their port range)
#   CRIER_REQUIRE_SIG=false        # signature enforcement (leave false for the demo wiring)
#   <HARNESS>_LIVE=1               # per-harness live mode (CLAUDE_CODE_LIVE, CODEX_LIVE, AIDER_LIVE, GOOSE_LIVE, OPENCODE_LIVE)
name: crier-agent-ecosystem

x-crier-env: &crier-env
  CRIER_PORT: 8767
  CR_REQUIRE_AGENT_SIG: ${CRIER_REQUIRE_SIG:-false}
  CR_GUARD_ENABLED: ${CR_GUARD_ENABLED:-true}
  CR_GUARD_TIMEOUT_MS: 20000

services:
  crier:
    build:
      context: ../..
      dockerfile: Dockerfile
    environment:
      <<: *crier-env
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      CR_GUARD_DEFAULT_POLICY: ${CR_GUARD_DEFAULT_POLICY:-}
    ports:
      - "${CRIER_HOST_PORT:-18767}:8767"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8767/health"]
      interval: 2s
      timeout: 3s
      retries: 30
    networks: [crier-net]

  sink:
    # Webhook receiver / echo agent — the simplest "agent" in the mesh.
    build: ./sink
    environment:
      CRIER_URL: http://crier:8767
      PORT: 9002
    ports: ["${SINK_HOST_PORT:-19002}:9002"]
    depends_on:
      crier: { condition: service_healthy }
    networks: [crier-net]

  pi-agent:
    # Pi Agent (earendil-works/pi) — minimalist TypeScript harness. Receives
    # messages through crier (blocking webhook), answers via a real pi SDK
    # session when DEEPSEEK_API_KEY is set, canned reply otherwise.
    # Shared consumer at consumer/consumer.mjs (build context = this dir).
    build:
      context: .
      dockerfile: pi-agent/Dockerfile
    environment:
      CRIER_URL: http://crier:8767
      PORT: 9101
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
    ports: ["${PI_HOST_PORT:-19101}:9101"]
    depends_on:
      crier: { condition: service_healthy }
    networks: [crier-net]

  opencode:
    # OpenCode CLI agent (opencode-ai) — same shared consumer pattern.
    build:
      context: .
      dockerfile: opencode/Dockerfile
    environment:
      CRIER_URL: http://crier:8767
      PORT: 9102
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      OPENCODE_LIVE: ${OPENCODE_LIVE:-}
    ports: ["${OPENCODE_HOST_PORT:-19102}:9102"]
    depends_on:
      crier: { condition: service_healthy }
    networks: [crier-net]

  claude-code:
    # Claude Code CLI (Anthropic) — shared consumer; live mode via CLAUDE_CODE_LIVE=1.
    build:
      context: .
      dockerfile: claude-code/Dockerfile
    environment:
      CRIER_URL: http://crier:8767
      PORT: 9103
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      CLAUDE_CODE_LIVE: ${CLAUDE_CODE_LIVE:-}
    ports: ["${CLAUDE_CODE_HOST_PORT:-19103}:9103"]
    depends_on:
      crier: { condition: service_healthy }
    networks: [crier-net]

  codex:
    # OpenAI Codex CLI — shared consumer; live mode via CODEX_LIVE=1.
    build:
      context: .
      dockerfile: codex/Dockerfile
    environment:
      CRIER_URL: http://crier:8767
      PORT: 9104
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      CODEX_LIVE: ${CODEX_LIVE:-}
    ports: ["${CODEX_HOST_PORT:-19104}:9104"]
    depends_on:
      crier: { condition: service_healthy }
    networks: [crier-net]

  aider:
    # Aider (python) — shared consumer; live mode via AIDER_LIVE=1.
    build:
      context: .
      dockerfile: aider/Dockerfile
    environment:
      CRIER_URL: http://crier:8767
      PORT: 9105
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      AIDER_LIVE: ${AIDER_LIVE:-}
    ports: ["${AIDER_HOST_PORT:-19105}:9105"]
    depends_on:
      crier: { condition: service_healthy }
    networks: [crier-net]

  goose:
    # Goose (block/goose, rust binary) — shared consumer; live mode via GOOSE_LIVE=1.
    build:
      context: .
      dockerfile: goose/Dockerfile
    environment:
      CRIER_URL: http://crier:8767
      PORT: 9106
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      GOOSE_LIVE: ${GOOSE_LIVE:-}
    ports: ["${GOOSE_HOST_PORT:-19106}:9106"]
    depends_on:
      crier: { condition: service_healthy }
    networks: [crier-net]

  hermes:
    # Hermes Agent — profile-gated: requires the hermes-agent:latest image
    # (see hermes/README.md for the build). Registers via hermes/register.sh.
    profiles: ["hermes"]
    image: hermes-agent:latest
    environment:
      CRIER_URL: http://crier:8767
    volumes:
      - ./hermes/cont-init.d:/etc/cont-init.d:ro
    depends_on:
      crier: { condition: service_healthy }
    networks: [crier-net]

  battery:
    # The full battery of tests against the stack. ONE-SHOT, profile-gated
    # (DF-CRIER-88/90): `docker compose up -d --build` starts the long-lived stack ONLY
    # — the battery is never auto-run. Run it explicitly, exactly once:
    #   docker compose --profile battery run --rm battery
    # That command builds this image on demand when it is missing, and never rebuilds or
    # recreates the rest of the stack, so re-running it is safe. After editing
    # battery.sh, rebuild only this image:
    #   docker compose --profile battery build battery
    profiles: ["battery"]
    build: ./battery
    environment:
      CRIER_URL: http://crier:8767
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      EVIDENCE: /evidence/ecosystem.jsonl
    volumes:
      - battery-evidence:/evidence
    depends_on:
      crier: { condition: service_healthy }
      sink: { condition: service_started }
      pi-agent: { condition: service_started }
      opencode: { condition: service_started }
      claude-code: { condition: service_started }
      codex: { condition: service_started }
      aider: { condition: service_started }
      goose: { condition: service_started }
    networks: [crier-net]

volumes:
  battery-evidence:

networks:
  crier-net:
    driver: bridge
