services:
  postgres:
    image: postgres:16-alpine
    # No container_name: Compose scopes the container to this project
    # (directory name / COMPOSE_PROJECT_NAME), so a stale container named
    # crier-postgres on a shared host can no longer block startup
    # (DF-CRIER-167). Set a name explicitly only via env-driven overrides.
    restart: unless-stopped
    ports:
      - "${CRIER_PG_HOST_PORT:-5437}:5432"
    environment:
      POSTGRES_USER: crier
      POSTGRES_PASSWORD: crier
      POSTGRES_DB: crier
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crier -d crier"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  # The crier server itself (QA-CRIER-38): without this service the stack was
  # postgres-only and the containerized deploy path (image build + boot + HTTP
  # probe) was never exercised. The server is env-driven (config/config.go) —
  # CRIER_PORT sets the listen port and CR_DATABASE_URL the store URL.
  crier:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${CRIER_HOST_PORT:-8767}:8767"
    environment:
      CRIER_PORT: "8767"
      CR_DATABASE_URL: postgres://crier:crier@postgres:5432/crier?sslmode=disable

volumes:
  pgdata:
