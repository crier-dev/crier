services:
  postgres:
    image: postgres:16-alpine
    container_name: crier-postgres
    restart: unless-stopped
    ports:
      - "5437:5432"
    environment:
      POSTGRES_USER: crier
      POSTGRES_PASSWORD: crier
      POSTGRES_DB: crier
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crier -d crier"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  pgdata:
