name: REPRO
on: [push]
jobs:
  repro:
    name: Repro build step
    runs-on: ubuntu-latest
    env:
      GOTOOLCHAIN: local
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN || github.token }}
      - name: Set up Go 1.26.10
        uses: actions/setup-go@v6
        with:
          go-version: 1.26.10
      - name: Agent-ecosystem registration contract
        run: go test -count=1 ./internal/ci
