# docs/claims.yaml — prose claims the docs make, executed by cmd/server/docsclaims_test.go.
#
# CR-GAP-055 (docs-sweep T1): prose docs drift because nothing executes them. This file
# turns every claim below into a build-failing gate: the test boots the real server,
# checks every anchor still exists in its doc, probes every route claim live, compares
# every default against the imported production constant, and re-measures every count
# from source. Only claims that README.md / TESTERS.md ACTUALLY make may be listed —
# nothing is invented.
#
# Claim shape:
#   id:   unique string (SCREAMING-KEBAB); status/default/count claims are keyed by id
#         in the test's probe tables.
#   kind: route   — expect is a path; GET-probed live, ONLY 404 is failure
#         status  — expect is the HTTP status the doc claims; probed via the id-keyed
#                   status probe table in the test
#         default — expect is the value the doc prints; compared against the imported
#                   production default via the id-keyed probe table
#         count   — expect is the number the doc prints; re-measured from source
#   doc:   path relative to the repo root (README.md / TESTERS.md this tick)
#   quote: EXACT substring that must still appear in that doc — editing/removing that
#          line makes the gate FAIL (the load-bearing anchor)
#   expect: <string or number> — what the claim asserts
#   xfail: null (claim must HOLD live) or "<BOARD-ID>" (claim currently FALSE, pinned
#          to the row that will fix it; anchors are still checked, assertions are
#          reported with t.Logf and never fail the build)
#
# ignore_paths: path-looking strings in the docs that are NOT API routes (filesystem
# paths, /tmp paths, third-party URLs). A scanned path that is neither a live route
# nor on this list FAILS the gate — nothing is silently skipped.
ignore_paths:
  - /dev/null
  - /tmp/crier-agent.key
  - /tmp/crier-payload.txt
  # CR-GAP-056: TESTERS.md now generates one keypair per agent (so a tester can
  # sign as either identity) — these are scratch key files, not API routes.
  - /tmp/crier-alice.key
  - /tmp/crier-bob.key
  # CR-GAP-062: docs/mesh-protocol.md and specs/WEBHOOK-DELIVERY.md are now
  # scanned. These tokens are NOT crier API routes — each is deliberate.
  - /ping                 # illustrative mesh REQUEST path (the target agent's own path)
  - /bridge               # component name in prose ("mesh_peers`/bridge list_agents")
  - /v1/chat/completions  # bridge/Hermes-side third-party path in an example
  - /v1/configure         # bridge/Hermes-side third-party path in an example
  # CR-GAP-059 (docs-sweep T5): docs/specs.md is now scanned. CI-001 keeps the
  # Hivemind source route (/events) in its history line while stating the shipped
  # contract; /events is a source path, NOT a crier API route (grep cmd/ internal/
  # finds no registration), so it is ignored while the shipped route is claimed
  # live just below.
  - /events
  # DF-CRIER-194: README's Stop/restart section and CR_PIDFILE row document
  # the pidfile ownership check against the kernel's /proc/<pid>/exe —
  # filesystem paths the scanner splits at the placeholder, not API routes.
  - /proc/
  - /exe

claims:
  # --- routes (kind: route) — README/TESTERS claim these paths exist; probe live. ---
  - id: ROUTE-README-RELAY-PUBLISH
    kind: route
    doc: README.md
    quote: "POST /relay/publish"
    expect: "/relay/publish"
    xfail: null
  - id: ROUTE-README-RELAY-SUBSCRIBE
    kind: route
    doc: README.md
    quote: "/relay/subscribe/{topic}"
    expect: "/relay/subscribe/{topic}"
    xfail: null
  - id: ROUTE-README-RELAY-TOPICS
    kind: route
    doc: README.md
    quote: "/relay/topics"
    expect: "/relay/topics"
    xfail: null
  - id: ROUTE-README-MESH-CONNECT
    kind: route
    doc: README.md
    quote: "/mesh/connect/{agentID}"
    expect: "/mesh/connect/{agentID}"
    xfail: null
  - id: ROUTE-README-MESH-PEERS
    kind: route
    doc: README.md
    quote: "/mesh/peers"
    expect: "/mesh/peers"
    xfail: null
  - id: ROUTE-README-FED-PEERS
    kind: route
    doc: README.md
    quote: "/fed/peers"
    expect: "/fed/peers"
    xfail: null
  - id: ROUTE-README-REGISTER
    kind: route
    doc: README.md
    quote: "POST /agents"
    expect: "/agents"
    xfail: null
  - id: ROUTE-README-INBOX-DELIVER
    kind: route
    doc: README.md
    quote: "POST /agents/{id}/inbox"
    expect: "/agents/{id}/inbox"
    xfail: null
  - id: ROUTE-README-INBOX-RETRIEVE
    kind: route
    doc: README.md
    quote: "GET /agents/{id}/inbox"
    expect: "/agents/{id}/inbox"
    xfail: null
  - id: ROUTE-README-INBOX-ACK
    kind: route
    doc: README.md
    quote: "/agents/{id}/inbox/ack"
    expect: "/agents/{id}/inbox/ack"
    xfail: null
  - id: ROUTE-README-INBOX-STATS
    kind: route
    doc: README.md
    quote: "/agents/{id}/inbox/stats"
    expect: "/agents/{id}/inbox/stats"
    xfail: null
  - id: ROUTE-TESTERS-DOCS
    kind: route
    doc: TESTERS.md
    quote: "also served live at"
    expect: "/docs"
    xfail: null
  # CR-GAP-059 (docs-sweep T5): CI-001 used to state the Hivemind source's /events
  # route as if the shipped server served it. The corrected line keeps the history
  # AND names the shipped route, which this claim now probes live.
  - id: ROUTE-SPECS-CI001-RELAY-PUBLISH
    kind: route
    doc: docs/specs.md
    quote: "ported as the crier relay: `POST /relay/publish`"
    expect: "/relay/publish"
    xfail: null
  # DF-CRIER-142: the README's observability section names the two opt-in
  # live-inspection paths. Both are claimed live — the docsclaims harness
  # boots the server with CR_ENABLE_METRICS/CR_ENABLE_PPROF on precisely
  # because the docs claim them (the shipped default is off).
  - id: ROUTE-README-METRICS
    kind: route
    doc: README.md
    quote: "GET /metrics` (`CR_ENABLE_METRICS=true`)"
    expect: "/metrics"
    xfail: null
  - id: ROUTE-README-PPROF
    kind: route
    doc: README.md
    quote: "GET /debug/pprof/` (`CR_ENABLE_PPROF=true`)"
    expect: "/debug/pprof/"
    xfail: null

  # --- statuses (kind: status) — the status a doc claims the server answers. ---
  - id: STATUS-RELAY-PUBLISH-NO-AGENT-ID
    kind: status
    doc: README.md
    quote: "requires the `X-Agent-ID` header"
    expect: "401"
    xfail: null
  - id: STATUS-GUARD-BLOCK
    kind: status
    doc: README.md
    quote: "403 GUARD_BLOCKED"
    expect: "403"
    xfail: null

  # --- defaults (kind: default) — compared against the imported production constant,
  # never against a duplicated literal. ---
  - id: DEFAULT-REQUIRE-AGENT-SIG
    kind: default
    doc: README.md
    quote: "CR_REQUIRE_AGENT_SIG"
    expect: true
    xfail: null
  - id: DEFAULT-GUARD-MAX-PAYLOAD-BYTES
    kind: default
    doc: README.md
    quote: "CR_GUARD_MAX_PAYLOAD_BYTES"
    expect: 65536
    xfail: null
  - id: DEFAULT-RATE-LIMIT-PER-MINUTE
    kind: default
    doc: README.md
    quote: "CR_RATE_LIMIT_PER_MINUTE"
    expect: 100
    xfail: null
  - id: DEFAULT-MESH-KEEPALIVE
    kind: default
    doc: README.md
    quote: "30-second keepalive loop"
    expect: 30
    xfail: null
  # CR-GAP-059 (docs-sweep T5): docs/architecture.md is now scanned and carries the
  # same production constant as the README claim. The id is shared on purpose —
  # liveDefault() keys the probe on it, so both docs are pinned to one measurement.
  - id: DEFAULT-MESH-KEEPALIVE
    kind: default
    doc: docs/architecture.md
    quote: "30s interval; no server-side liveness processing"
    expect: 30
    xfail: null
  # DF-CRIER-182: a message that never expires (ttl_seconds=0) reports
  # `expires_at` as JSON null — the key stays present, only its value is null —
  # on the 201 accept AND on the retrieve body. The probe reads the RAW wire
  # value, so the pre-fix zero time 0001-01-01T00:00:00Z arrives here as a
  # non-nil string and fails the claim; a missing key is a probe error, because
  # absent (no inbox entry: webhook deliveries) is a different state from null.
  - id: DEFAULT-NEVER-EXPIRES-WIRE-VALUE
    kind: default
    doc: TESTERS.md
    quote: 'never expires and is reported as `"expires_at":null`'
    expect: null
    xfail: null

  # --- counts (kind: count) — re-measured from source where measurable (openapi
  # paths/operations, router registrations, Makefile threshold, live MCP tools/list);
  # otherwise pinned. ---
  - id: COUNT-OPENAPI-PATHS
    kind: count
    doc: README.md
    quote: "docs/openapi.yaml"
    expect: 13
    xfail: null
  - id: COUNT-OPENAPI-OPERATIONS
    kind: count
    doc: README.md
    # CR-GAP-057: the README now names the unit ("13 paths and 17 operations")
    # instead of the old conflatable "17 endpoints"; only the anchor moved.
    quote: "17 operations"
    expect: 17
    xfail: null
  - id: COUNT-MCP-TOOLS
    kind: count
    doc: TESTERS.md
    quote: "13 tools"
    expect: 13
    xfail: null
  # CR-GAP-057: the README now publishes the same MCP inventory (a tools table
  # with per-tool arguments). Same id and the same live probe (a real tools/list
  # stdio exchange) — the claim is anchored in both docs so either can drift
  # loudly. The id is shared on purpose: liveCount() keys the measurement by id.
  - id: COUNT-MCP-TOOLS
    kind: count
    doc: README.md
    quote: "13 tools"
    expect: 13
    xfail: null
  - id: COUNT-ROUTER-PATHS
    kind: count
    doc: README.md
    # CR-GAP-057: was "16 HTTP endpoints" — the unit is now explicit (router
    # registrations in cmd/server/main.go), so the anchor moved with it.
    quote: "16 router paths"
    expect: 16
    xfail: null
  - id: COUNT-COVERAGE-THRESHOLD
    kind: count
    doc: README.md
    quote: "70% gate"
    expect: 70
    xfail: null

  # --- xfail claims (CR-GAP-062): prose that is FALSE at HEAD, pinned to the board
  # row that will fix it. The anchor is still load-bearing; the assertion is
  # REPORTED (t.Logf) instead of failing the build. Deleting the xfail line makes
  # the claim fail for real, naming claimed vs observed — that is the proof the
  # live probe is not vacuous. xfail must never hide a claim that actually holds.
  # DF-CRIER-187 fixed this claim: pruneRoutesLocked now keys off the configured
  # cap, so the doc line and the live production constant agree and the xfail
  # marker is gone. The id is HISTORICAL — CR-GAP-062 seeded it against the 4096
  # literal that row removed — and is kept because the id keys the live probe in
  # cmd/server/docsclaims_test.go makeLiveDefaultProbes.
  - id: MESH-ROUTE-CAP-4096
    kind: default
    doc: docs/mesh-protocol.md
    quote: "Route table full (`MaxPendingRequests` entries, default 50, flushed wholesale)"
    # `expect` is both the number the DOC prints and the live production
    # constant (mesh.DefaultMeshConfig("").MaxPendingRequests).
    expect: 50
    xfail: null
  - id: WEBHOOK-DEFAULT-BLOCKING
    kind: status
    doc: specs/WEBHOOK-DELIVERY.md
    quote: "- `delivery_mode` — `async` (default) | `blocking` | `batch`."
    # RESOLVED by DF-CRIER-178: the spec prose was the stale side, not the code.
    # async IS the shipped, deliberate default — internal/webhook/driver.go:229-237
    # (effectiveDeliveryMode: envelope override -> agent config -> "async") and
    # internal/registry/handler.go:568-573 (req.DeliveryMode -> target.Webhook.
    # DeliveryMode -> "async"), both landed by commit b1540f2 (CR-FEAT-005:
    # "Async fire-and-forget enqueues and returns immediately"). The id is
    # HISTORICAL — it was seeded when the doc claimed a "blocking" default, and is
    # kept because it keys the live probe in cmd/server/docsclaims_test.go — so a
    # reader knows why the id no longer says "blocking". The live probe delivers
    # with the mode unset and reports the accept it really gets.
    expect: "202"
    xfail: null
  # CR-GAP-056 removed TTL-SECONDS-CLAIM-IGNORED with the doc line it anchored:
  # DF-CRIER-174 rebuilt the TESTERS.md rough-edges table from live evidence and
  # the row claiming ttl_seconds is ignored is FALSE at HEAD (a deliver with
  # ttl_seconds=3600 returns expires_at = now + 3600s — measured, and still
  # measured by liveTTLDeliverySeconds, which is simply no longer pinned to a
  # doc claim). Claiming it again would require a doc line that says the
  # opposite of what the server does.
