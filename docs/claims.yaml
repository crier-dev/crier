  # --- statuses (kind: status) — the status a doc claims the server answers. ---
  - id: STATUS-RELAY-PUBLISH-NO-AGENT-ID
    kind: status
    doc: README.md
    quote: "requires the `X-Agent-ID` header"
    expect: "401"
    xfail: null
  - id: STATUS-GUARD-BLOCK
    kind: status
    doc: README.md
    quote: "403 GUARD_BLOCKED"
    expect: "403"
    xfail: null
  # DF-CRIER-16: the README's agent-scoped signing contract used to state only the
  # missing-trio 401, so a negative-path tester who hit the agent EXISTENCE check
  # read the 404 as a contract mismatch. The corrected prose states the check order
  # (trio -> existence -> timestamp -> signature) and the README sentence anchored
  # below names the unregistered-agent case; the live probe in
  # cmd/server/docsclaims_test.go sends a well-formed-but-bogus trio to an id that
  # is NEVER registered, so the presence check passes and the existence check is
  # what answers — real IDs are registered by the harness, this one deliberately is
  # not (a registered id measures the 401 arm instead: "signature verification
  # failed"). The status measured is the server's resp.StatusCode.
  - id: STATUS-AGENT-SCOPED-UNREGISTERED-404
    kind: status
    doc: README.md
    quote: 'an UNREGISTERED agent id answers 404 "agent not found"'
    expect: "404"
    xfail: null

  # --- defaults (kind: default) — compared against the imported production constant,
  # never against a duplicated literal. ---
  # INT-A2A-001: the README's environment table prints this default, and the
  # option being OFF unless an operator turns it on IS the feature — so the
  # printed value is pinned to config.Config.A2AEnabled, not to a literal here.
  - id: DEFAULT-A2A-ENABLED
    kind: default
    doc: README.md
    quote: "CR_A2A_ENABLED"
    expect: false
    xfail: null
  - id: DEFAULT-REQUIRE-AGENT-SIG
    kind: default
    doc: README.md
    quote: "CR_REQUIRE_AGENT_SIG"
    expect: true
    xfail: null
  # DF-CRIER-287: the mesh connect handshake is OPT-IN, and that is the whole
  # migration contract — the README's environment table prints this default, so
  # it is pinned to the production value an unset environment resolves to
  # (config.Config.RequireMeshAuth, probed in cmd/server/docsclaims_test.go)
  # rather than to a literal here. Turning it on by default would refuse every
  # existing mesh client.
  - id: DEFAULT-REQUIRE-MESH-AUTH
    kind: default
    doc: README.md
    quote: "CR_REQUIRE_MESH_AUTH"
    expect: false
    xfail: null
  - id: DEFAULT-GUARD-MAX-PAYLOAD-BYTES
    kind: default
    doc: README.md
    quote: "CR_GUARD_MAX_PAYLOAD_BYTES"
    expect: 65536
    xfail: null
  - id: DEFAULT-RATE-LIMIT-PER-MINUTE
    kind: default
    doc: README.md
    quote: "CR_RATE_LIMIT_PER_MINUTE"
    expect: 100
    xfail: null
  - id: DEFAULT-MESH-KEEPALIVE
    kind: default
    doc: README.md
    quote: "30-second keepalive loop"
    expect: 30
    xfail: null
  # CR-GAP-059 (docs-sweep T5): docs/architecture.md is now scanned and carries the
  # same production constant as the README claim. The id is shared on purpose —
  # liveDefault() keys the probe on it, so both docs are pinned to one measurement.
  # CR-FEAT-024: the sentence moved off "no server-side liveness processing" —
  # heartbeats ARE processed now (they advance the sender's registry last_seen) —
  # while it keeps the 30s interval the probe below measures.
  - id: DEFAULT-MESH-KEEPALIVE
    kind: default
    doc: docs/architecture.md
    quote: "30s interval; a heartbeat advances the sender's registry liveness"
    expect: 30
    xfail: null
  # DF-CRIER-251: docs/mesh-protocol.md claimed "no server-initiated keepalive"
  # while the shipped accept path started the same 30s loop for every accepted
  # peer (handler.go:46 → peer.go:186). The anchor below is the corrected sentence,
  # so putting the old wording back fails the gate with "anchor missing". The id is
  # shared with the two claims above ON PURPOSE — liveDefault() keys the probe on
  # it, so all THREE docs are pinned to one measurement of the production default
  # mesh.DefaultMeshConfig("").KeepaliveInterval (the probe lives in
  # cmd/server/docsclaims_test.go and is not duplicated here).
  - id: DEFAULT-MESH-KEEPALIVE
    kind: default
    doc: docs/mesh-protocol.md
    quote: "The server sends a KEEPALIVE to every accepted peer every 30 seconds"
    expect: 30
    xfail: null
  # DF-CRIER-182: a message that never expires (ttl_seconds=0) reports
  # `expires_at` as JSON null — the key stays present, only its value is null —
  # on the 201 accept AND on the retrieve body. The probe reads the RAW wire
  # value, so the pre-fix zero time 0001-01-01T00:00:00Z arrives here as a
  # non-nil string and fails the claim; a missing key is a probe error, because
  # absent (no inbox entry: webhook deliveries) is a different state from null.
  - id: DEFAULT-NEVER-EXPIRES-WIRE-VALUE
    kind: default
    doc: TESTERS.md
    quote: 'never expires and is reported as `"expires_at":null`'
    expect: null
    xfail: null
  # CR-FEAT-024: presence. The README prints the shipped staleness window — three
  # missed mesh heartbeats — and the registry derives every row's reported status
  # with it, so the printed number is pinned to the production constant an unset
  # environment resolves to (probe: cmd/server/docsclaims_test.go).
  - id: DEFAULT-PRESENCE-STALE-AFTER-S
    kind: default
    doc: README.md
    quote: "CR_PRESENCE_STALE_AFTER_S"
    expect: 90
    xfail: null

  # --- counts (kind: count) — re-measured from source where measurable (openapi
  # paths/operations, router registrations, Makefile threshold, live MCP tools/list);
  # otherwise pinned. ---
  - id: COUNT-OPENAPI-PATHS
    kind: count
    doc: README.md
    # CR-FEAT-026 added POST /capabilities/{capability}/inbox and CR-FEAT-029
    # added GET /namespaces to the spec, so the merged pair is 18 paths /
    # 22 operations and both moved with it.
    quote: "docs/openapi.yaml"
    expect: 18
    xfail: null
  - id: COUNT-OPENAPI-OPERATIONS
    kind: count
    doc: README.md
    # CR-GAP-057: the README now names the unit ("13 paths and 17 operations")
    # instead of the old conflatable "17 endpoints"; only the anchor moved.
    # DF-CRIER-113 added GET /status to the spec, so the pair is 14 paths /
    # 18 operations and both the anchor and the expectation moved with it.
    # CR-FEAT-025 added POST /agents/{id}/inbox/transfer and
    # GET /agents/{id}/inbox/dead-letters, so the pair is 16 / 20 and both
    # moved with it again. CR-FEAT-026 added
    # POST /capabilities/{capability}/inbox and CR-FEAT-029 added GET
    # /namespaces, so the merged pair is 18 / 22.
    quote: "22 operations"
    expect: 22
    xfail: null
  - id: COUNT-MCP-TOOLS
    kind: count
    doc: TESTERS.md
    quote: "13 tools"
    expect: 13
    xfail: null
  # CR-GAP-057: the README now publishes the same MCP inventory (a tools table
  # with per-tool arguments). Same id and the same live probe (a real tools/list
  # stdio exchange) — the claim is anchored in both docs so either can drift
  # loudly. The id is shared on purpose: liveCount() keys the measurement by id.
  - id: COUNT-MCP-TOOLS
    kind: count
    doc: README.md
    quote: "13 tools"
    expect: 13
    xfail: null
  - id: COUNT-ROUTER-PATHS
    kind: count
    doc: README.md
    # CR-GAP-057: was "16 HTTP endpoints" — the unit is now explicit (router
    # registrations in cmd/server/main.go), so the anchor moved with it.
    # DF-CRIER-113 registered GET /status, so the count was 17.
    # CR-FEAT-030 registered the five opt-in detection routes (they exist only
    # when CR_DETECT_ENABLED is on, but they are HandleFunc registrations in
    # main.go all the same) and CR-FEAT-025 registered
    # POST /agents/{id}/inbox/transfer and GET /agents/{id}/inbox/dead-letters,
    # so the merged count was 16 API + 3 spec-hosting + 5 detection = 24.
    # CR-FEAT-026 registered POST /capabilities/{capability}/inbox and
    # CR-FEAT-029 registered GET /namespaces, so the merged count is
    # 18 API + 3 spec-hosting + 5 detection = 26. Note the README's "21
    # always-on" line counts the 18 API + 3 spec-hosting routes; that line is
    # prose the same number measures, and it moved with it.
    quote: "26 router paths"
    expect: 26
    xfail: null
  - id: COUNT-COVERAGE-THRESHOLD
    kind: count
    doc: README.md
    quote: "70% gate"
    expect: 70
    xfail: null
  # DF-CRIER-171: the README's build-identity section promises that every build
  # path stamps the one identity. The probe re-measures it from source: it scans
  # the shipped build paths (Makefile, Dockerfile, Dockerfile.mcp) for `go build`
  # invocations that produce a crier binary, counts the stamped ones, and FAILS
  # when one of them does not stamp internal/buildinfo — the exact defect the
  # claim exists for (the reference image shipped with `-ldflags "-s -w"` only, so
  # its /version answered the "dev" sentinel and named no commit). Run without
  # Docker: it reads the files, it does not build images.
  #
  # CR-FEAT-028 added a build path — the two cross-compile lines in
  # scripts/release-artifacts.sh that produce what a tester downloads — so this
  # count moved 4 -> 6 and the probe now reads that script too. The stamp must
  # stay INLINE on those `go build` lines: an indirected `$LDFLAGS` would be
  # invisible to the scanner and the release artifacts would be the one path that
  # could ship without an identity.
  - id: COUNT-BUILD-PATHS-STAMPED
    kind: count
    doc: README.md
    quote: "6 build paths that compile a crier binary"
    expect: 6
    xfail: null
  # CR-FEAT-028: the release's front door is its asset set, so the number the
  # README prints is re-measured from source — the default RELEASE_TARGETS in
  # scripts/release-artifacts.sh x the two binaries per target, plus the installer
  # and the checksum manifest. Adding a platform to the release without moving the
  # sentence fails the build (as does an empty or malformed target list, which the
  # probe refuses to read as a smaller release).
  - id: COUNT-RELEASE-ASSETS
    kind: count
    doc: README.md
    quote: "publishes 8 assets"
    expect: 8
    xfail: null

  # --- xfail claims (CR-GAP-062): prose that is FALSE at HEAD, pinned to the board
  # row that will fix it. The anchor is still load-bearing; the assertion is
  # REPORTED (t.Logf) instead of failing the build. Deleting the xfail line makes
  # the claim fail for real, naming claimed vs observed — that is the proof the
  # live probe is not vacuous. xfail must never hide a claim that actually holds.
  # DF-CRIER-187 fixed this claim: pruneRoutesLocked now keys off the configured
  # cap, so the doc line and the live production constant agree and the xfail
  # marker is gone. The id is HISTORICAL — CR-GAP-062 seeded it against the 4096
  # literal that row removed — and is kept because the id keys the live probe in
  # cmd/server/docsclaims_test.go makeLiveDefaultProbes.
  - id: MESH-ROUTE-CAP-4096
    kind: default
    doc: docs/mesh-protocol.md
    quote: "Route table full (`MaxPendingRequests` entries, default 50, flushed wholesale)"
    # `expect` is both the number the DOC prints and the live production
    # constant (mesh.DefaultMeshConfig("").MaxPendingRequests).
    expect: 50
    xfail: null
  # DF-CRIER-191: the §"Error handling and silent drops" claim that
  # DF-CRIER-40 landed and e5973c0 re-stated — a malformed frame is REFUSED
  # on the wire (ERROR INVALID_MESSAGE), not silently dropped — had no claim
  # pinning it, so it could drift back exactly the way DF-CRIER-141's silent
  # drop did. This is a NEW measurement: no existing id drives a raw
  # WebSocket client against the booted server, so a new id-keyed probe in
  # makeLiveStatusProbes is minted for it (the /mesh/connect WS surface is
  # unreachable from the gate's HTTP-only client).
  #
  # Status mapping, identical in claim and probe:
  #   400 = the refusal contract holds: the raw ERROR frame came back with
  #         error.code=INVALID_MESSAGE and a non-empty error.message
  #   200 = the frame was silently dropped (no reply before the deadline) —
  #         the pre-DF-CRIER-40 behaviour this claim exists to bar
  #   500 = a reply arrived that is not the refusal (wrong type or wrong code)
  #   502 = the probe itself failed (dial, handshake, IO) — never a pass
  - id: STATUS-MESH-MALFORMED-FRAME-INVALID-MESSAGE
    kind: status
    doc: docs/mesh-protocol.md
    quote: "A malformed frame is answered with `ERROR` `INVALID_MESSAGE`, not swallowed."
    # `expect` is the mapped probe outcome (400 — see the mapping above), the
    # only reading that means "the live engine refuses malformed frames".
    expect: "400"
    xfail: null
  - id: WEBHOOK-DEFAULT-BLOCKING
    kind: status
    doc: specs/WEBHOOK-DELIVERY.md
    quote: "- `delivery_mode` — `async` (default) | `blocking` | `batch`."
    # RESOLVED by DF-CRIER-178: the spec prose was the stale side, not the code.
    # async IS the shipped, deliberate default — internal/webhook/driver.go:229-237
    # (effectiveDeliveryMode: envelope override -> agent config -> "async") and
    # internal/registry/handler.go:568-573 (req.DeliveryMode -> target.Webhook.
    # DeliveryMode -> "async"), both landed by commit b1540f2 (CR-FEAT-005:
    # "Async fire-and-forget enqueues and returns immediately"). The id is
    # HISTORICAL — it was seeded when the doc claimed a "blocking" default, and is
    # kept because it keys the live probe in cmd/server/docsclaims_test.go — so a
    # reader knows why the id no longer says "blocking". The live probe delivers
    # with the mode unset and reports the accept it really gets.
    expect: "202"
    xfail: null
  # DF-CRIER-175: §3 documented the outbound header block as
  # `X-Crier-Agent: {target_agent_id}`, but the wire has always carried the
  # SENDER there and the envelope named no target at all — a sink author could
  # not tell which agent a delivery was FOR. The corrected §3 separates the two
  # identities (X-Crier-Agent = the sender, X-Crier-Target = the target agent)
  # and the claim below anchors the new line AND measures it live: the probe
  # delivers to a webhook-registered probe agent and asserts the POST that
  # reached the sink named that agent in the header and in `crier.target`.
  - id: WEBHOOK-OUTBOUND-TARGET-HEADER
    kind: status
    doc: specs/WEBHOOK-DELIVERY.md
    quote: "X-Crier-Target: {target_agent_id}"
    expect: "202"
    xfail: null
  # DF-CRIER-11: §3's sample drew the envelope sender as an OBJECT
  # ("sender": {"agent_id": "agent-a"}) on the SAME screen as a scalar target,
  # so the example contradicted itself and described nothing the server emits.
  # The fix is on the DOC side — the wire has always carried the scalar
  # (internal/webhook/webhook.go: Sender string `json:"sender,omitempty"`), the
  # deliver request body types `sender` as a string, and X-Crier-Agent, the
  # header carrying the identical identity, is a scalar. Changing the wire to
  # an object would break every existing sink for a cosmetic symmetry win; the
  # only argument for the object shape (mesh PeerRef) is a different protocol
  # (docs/mesh-protocol.md source/target). This claim is therefore TWO things:
  # the anchor below (the corrected sample line) and a live probe that
  # re-measures the token type end-to-end — the probe's own sink captures the
  # POST the booted server makes, and reports an OBJECT token as an error
  # naming the shape it observed.
  - id: WEBHOOK-OUTBOUND-SENDER-SCALAR
    kind: status
    doc: specs/WEBHOOK-DELIVERY.md
