openapi: "3.1.0"
info:
  title: Crier — Agent Message Bus
  description: |
    Communication backbone for the autonomous agent economy.
    Four primitives: relay, mesh, registry, inboxes.

    Auth: every endpoint except /health and /version requires `Authorization: Bearer <CR_AUTH_TOKEN>` (middleware.Auth). /health and /version are exempt.
  version: "0.1.0"
servers:
  - url: http://localhost:8767
    description: Local development
security:
  - bearerAuth: []
tags:
  - name: health
    description: Server liveness, build identity and effective runtime posture.
  - name: registry
    description: Agent registration, lookup, update and removal.
  - name: inbox
    description: Durable per-agent inboxes — deliver to an agent id, or to a CAPABILITY (round-robin over its live holders, CR-FEAT-026), with an optional sender idempotency key; retrieve with lease, ack, stats, transfer/reassign between inboxes, and the dead-letter destination for messages that expired unacknowledged.
  - name: relay
    description: Topic pub/sub — publish, WebSocket subscribe, list topics.
  - name: mesh
    description: WebSocket peer mesh — connect and list peers.
  - name: federation
    description: Cross-relay federation peer list.
  - name: sessions
    description: "Chat sessions (CR-CHAT-019): the session object, the ordered cross-agent transcript, membership and fan-out into a session, per specs/CHAT-INTERFACE.md §4. Every surface is realm-scoped, and a message sent into a session is delivered through the SHIPPED inbox path — there is no second delivery path."
  - name: groups
    description: "Named agent groups (CR-CHAT-013, D8): a curated, editable roster of agents addressed as `@team:x`, that ONE message fans out to — every CURRENT member, through the same shipped fan-out path. Deliberately NOT a capability target (`@cap:y`), which stays the dynamic round-robin pool over live holders: a named group's audience is enumerable and recordable BEFORE the send, a capability's holder is decided at delivery time."
  - name: dagger
    description: "OPT-IN control surface over a Hermes-dagger pipeline (CR-CHAT-033): create, observe, cancel, resume, rewind and run a registered skill. crier embeds NO executor (decision D18) — every operation is a CLIENT call to the dagger HTTP/JSON endpoint named by CR_DAGGER_URL, and crier holds only the run's record. The six routes exist only while CR_DAGGER_URL is set."
paths:
  # ── Health ──
  # /health exempt — middleware.Auth exempts it from the bearer check
  /health:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok

  # ── Build identity ──
  # /version exempt — middleware.Auth exempts it from the bearer check, like
  # /health, so an operator can ask a running server what build it is without
  # holding a token.
  /version:
    get:
      operationId: buildVersion
      tags: [health]
      summary: Build identity of the running server
      description: >
        Version, git commit, build time and dirty flag of the binary serving
        this request, resolved by internal/buildinfo. This is the same identity
        `crier -version` prints and the startup log carries, so the CLI and the
        HTTP surface cannot disagree. Values fall back to the VCS metadata the
        Go toolchain embeds when no version was stamped at link time.
      security: []
      responses:
        "200":
          description: Resolved build identity
          content:
            application/json:
              schema:
                type: object
                required: [version, commit, build_time, modified]
                properties:
                  version:
                    type: string
                    description: Stamped version (no leading "v"), or "dev" when none was stamped
                    example: "1.2.3"
                  commit:
                    type: string
                    description: Short (8-char) git revision the binary was built from, or "unknown" when unavailable
                    example: "1a2b3c4d"
                  build_time:
                    type: string
                    description: RFC 3339 timestamp — the stamped build time, else the commit time, else "unknown"
                    example: "2026-09-14T06:05:59Z"
                  modified:
                    type: boolean
                    description: True when the working tree had uncommitted changes at build time
                    example: false

  # ── Runtime posture ──
  # /status is NOT exempt — unlike /health and /version it reports whether auth
  # is ENFORCED, so it requires the bearer token when CR_AUTH_TOKEN is set (the
  # exempt-path switch in internal/middleware/auth.go is unchanged).
  /status:
    get:
      operationId: runtimeStatus
      tags: [health]
      summary: Effective runtime posture (auth, guard, registry backend, build identity)
      description: >-
        What is actually in force on this live server, as booleans and modes:
        whether a Bearer token is enforced, whether per-agent ed25519 signing is
        required, whether the LLM message guard is on, which registry backend is
        serving (memory or postgres), the federation/webhook/inspection modes,
        and the build identity — the same object GET /version serves, nested
        under `build`. Operators read this to distinguish a locked server from
        one running wider open; a server that answers /health "ok" cannot be
        told apart from one with auth disabled any other way.

        Secret values are deliberately absent, not redacted: no CR_AUTH_TOKEN,
        no CR_DATABASE_URL (only the backend NAME), no CR_WEBHOOK_SECRET, no
        CR_FED_TOKEN, no guard provider credential and no guard base URL. The
        federation hold queue reports its durability MODE rather than the
        CR_FED_QUEUE_FILE path, so no filesystem or host detail is exposed.

        Not auth-exempt: requires `Authorization: Bearer <CR_AUTH_TOKEN>` when
        CR_AUTH_TOKEN is set, and answers 401 without it.
      responses:
        "200":
          description: Effective runtime posture
          content:
            application/json:
              schema:
                type: object
                required: [auth_enabled, require_agent_signature, mesh_auth_required, mesh_origin_policy, guard_enabled, presence_stale_after_s, registry_backend, rate_limit_per_minute, global_rate_limit_per_minute, queue_depth, queue_depth_history, health, agents_online, agents_total, log_level, log_format, webhook_signing, federation_enabled, federation_hold_queue, metrics_enabled, pprof_enabled, build]
                properties:
                  auth_enabled:
                    type: boolean
                    description: True when a Bearer token is enforced (CR_AUTH_TOKEN set); false is the documented development posture
                    example: true
                  require_agent_signature:
                    type: boolean
                    description: True when per-agent ed25519 signing is enforced on agent-scoped routes (CR_REQUIRE_AGENT_SIG, default true)
                    example: true
                  mesh_auth_required:
                    type: boolean
                    description: >-
                      True when the mesh connect handshake is enforced
                      (CR_REQUIRE_MESH_AUTH, default false). True means a peer
                      must answer an ed25519 challenge before its frames are
                      admitted and before it is listed by GET /mesh/peers;
                      false means the agent id in the connect URL is taken at
                      face value (see docs/mesh-protocol.md §Authentication).
                    example: true
                  mesh_origin_policy:
                    type: string
                    enum: [allow-all, allowlist]
                    description: >-
                      The mode CR_MESH_ALLOWED_ORIGINS resolves to. "allow-all"
                      (the default, origins unset or "*") accepts every origin;
                      "allowlist" means an upgrade carrying an Origin header
                      must name a listed origin. The origins themselves are
                      config and are never reported.
                    example: allowlist
                  guard_enabled:
                    type: boolean
                    description: LLM message guard master switch (CR_GUARD_ENABLED, default true). False means the delivery path skips the guard entirely
                    example: true
                  presence_stale_after_s:
                    type: integer
                    description: >-
                      The EFFECTIVE staleness window, in seconds, that the
                      registry derives a row's reported `status` with
                      (CR_PRESENCE_STALE_AFTER_S, CR-FEAT-024; default 90 = three
                      missed mesh heartbeats). A row with liveness evidence
                      inside this window reports `online`, and `stale` once
                      every piece of evidence is older than it — so this is the
                      number a `stale` row was judged by, reported next to the
                      status it explains.
                    example: 90
                  registry_backend:
                    type: string
                    enum: [memory, postgres]
                    description: >-
                      The backend actually serving this process: "postgres" when
                      CR_DATABASE_URL is set, "memory" otherwise. Derived from
                      the same value that selected the store, so it cannot
                      advertise a backend other than the one answering.
                    example: memory
                  rate_limit_per_minute:
                    type: integer
                    description: Effective relay publish budget (CR_RATE_LIMIT_PER_MINUTE); 0 means unlimited
                    example: 100
                  global_rate_limit_per_minute:
                    type: integer
                    description: >-
                      Effective GLOBAL inbox-ingest budget in deliveries per
                      minute across every agent (CR_RATE_LIMIT_GLOBAL_PER_MINUTE,
                      CR-FEAT-035); 0 — the default — means no global budget
                      exists and the delivery path never sheds. Reported beside
                      the per-agent publish cap because the two are different
                      lanes: this one is what refuses POST /agents/{id}/inbox
                      with 429 RATE_LIMITED_GLOBAL.
                    example: 0
                  queue_depth:
                    type: object
                    nullable: true
                    description: >-
                      LIVE store-wide inbox queue (CR-FEAT-035): how much is
                      waiting right now. Unlike every other field here this is
                      a measurement, not posture, so it changes between two
                      reads of the same server. It is counts and an age only —
                      never a payload, a message id or an agent id. Null when
                      the serving store cannot report a depth (a remote
                      proxy), so "empty" and "unavailable" are never the same
                      reading; GET /metrics reports the same numbers as the
                      inbox_queue_* gauges, and NaN there carries the same
                      "cannot report" meaning.
                    required: [pending, leased, oldest_age_s]
                    properties:
                      pending:
                        type: integer
                        description: Un-acknowledged, un-expired messages across all inboxes, leased ones included (a leased message is still queued)
                        example: 41
                      leased:
                        type: integer
                        description: How many of `pending` are currently held under a live lease
                        example: 3
                      oldest_age_s:
                        type: integer
                        description: How long the oldest pending message has been waiting, in seconds (0 when nothing is queued)
                        example: 12
                  queue_depth_history:
                    type: array
                    nullable: true
                    description: >-
                      The recent trail of queue_depth snapshots (CR-CHAT-020),
                      OLDEST-FIRST, at most 60 samples — the data the status
                      strip's trend/sparkline glyph is a client projection of.
                      Sampled once per GET /status read, from the SAME
                      measurement the response's queue_depth reports, so the
                      trail can never disagree with the figure it trails.
                      Null until at least one sample exists (a fresh process,
                      or a store that cannot report a depth), so "no history
                      yet" and "unavailable" are never the same reading as
                      "measured, flat". Process-lifetime: a restart empties
                      the ring.
                    items:
                      type: object
                      required: [at, pending, leased, oldest_age_s]
                      properties:
                        at:
                          type: string
                          format: date-time
                          description: When this sample was taken (RFC 3339, UTC)
                          example: "2026-10-07T14:02:11Z"
                        pending:
                          type: integer
                          description: The queue_depth.pending value at that instant
                          example: 41
                        leased:
                          type: integer
                          description: The queue_depth.leased value at that instant
                          example: 3
                        oldest_age_s:
                          type: integer
                          description: The queue_depth.oldest_age_s value at that instant
                          example: 12
                  health:
                    type: string
                    enum: [ok, degraded, down]
                    description: >-
                      Graded severity (CR-CHAT-020), derived per read — never
                      configured. "ok" while the serving registry backend
                      answers its probe (a bounded pool ping; a memory backend
                      is the process itself, so it is ok while this endpoint
                      answers); "degraded" when the backend does NOT answer;
                      "down" is the process itself failing to answer, which is
                      what GET /health reports — a word this endpoint cannot
                      honestly say about itself, carried in the enum only so
                      the vocabulary is one system. The grade deliberately
                      does NOT cover federation peer loss or guard errors:
                      those have their own surfaces (GET /fed/peers, the guard
                      verdict metadata), and a grade that aggregated signals
                      the bus does not measure as health would over-claim.
                    example: ok
                  agents_online:
                    type: integer
                    description: >-
                      How many registered agents derive `online` right now
                      (CR-CHAT-020) — THE count behind the UI's "N/M agents
                      online" figure. Counted with the SAME Presence
                      derivation GET /agents reports every row's status with
                      (last_seen vs presence_stale_after_s), against one
                      instant, so this aggregate cannot disagree with the
                      roster it summarizes; a client must not recount GET
                      /agents and present a second number.
                    example: 6
                  agents_total:
                    type: integer
                    description: >-
                      How many agents are registered (CR-CHAT-020) — the M of
                      the "N/M agents online" figure, from the same read as
                      agents_online.
                    example: 6
                  log_level:
                    type: string
                    enum: [debug, info, warn, error]
                    description: Effective logger level (CR_LOG_LEVEL, default info)
                    example: info
                  log_format:
                    type: string
                    enum: [text, json]
                    description: Effective logger format (CR_LOG_FORMAT, default text)
                    example: text
                  webhook_signing:
                    type: boolean
                    description: True when outbound webhook POSTs are HMAC-signed (CR_WEBHOOK_SECRET set). The secret itself is never serialized
                    example: false
                  federation_enabled:
                    type: boolean
                    description: True when relay-to-relay links are configured (CR_FED_LINKS non-empty)
                    example: false
                  federation_hold_queue:
                    type: string
                    enum: [none, memory, file]
                    description: >-
                      Durability mode of the federation hold path: "none" (no
                      links configured, so no hold path exists), "memory" (held
                      deliveries are process-lifetime and lost on restart) or
                      "file" (CR_FED_QUEUE_FILE is set, so they survive a
                      restart). The path itself is config, not posture, and is
                      never reported.
                    example: memory
                  metrics_enabled:
                    type: boolean
                    description: True when GET /metrics is registered (CR_ENABLE_METRICS); false means the path answers 404
                    example: false
                  pprof_enabled:
                    type: boolean
                    description: True when GET /debug/pprof/* is registered (CR_ENABLE_PPROF); false means the paths answer 404
                    example: false
                  build:
                    type: object
                    description: Build identity of the binary serving this request — byte-for-byte the object GET /version serves
                    required: [version, commit, build_time, modified]
                    properties:
                      version:
                        type: string
                        description: Stamped version (no leading "v"), or "dev" when none was stamped
                        example: "1.2.3"
                      commit:
                        type: string
                        description: Short (8-char) git revision the binary was built from, or "unknown" when unavailable
                        example: "1a2b3c4d"
                      build_time:
                        type: string
                        description: RFC 3339 timestamp — the stamped build time, else the commit time, else "unknown"
                        example: "2026-09-14T06:05:59Z"
                      modified:
                        type: boolean
                        description: True when the working tree had uncommitted changes at build time
                        example: false
        "401":
          description: Missing or invalid bearer token — /status is not auth-exempt (CR_AUTH_TOKEN is set and no valid Authorization Bearer header was sent)

  # ── Relay: Pub/Sub ──
  /relay/publish:
    post:
      operationId: relayPublish
      tags: [relay]
      summary: Publish an event to a topic
      description: |-
        The realm a publish belongs to comes from the X-Crier-Namespace HEADER
        (CR-FEAT-029, specs/NAMESPACES.md), never from the body: the per-realm
        rate limit is evaluated before the body is read, so a `namespace`
        MEMBER in the body is refused with 400 rather than silently ignored. A
        publish is delivered only to subscribers of the SAME namespace, even on
        an identical topic name — and the rate limit that applies is that
        namespace's own (keyed by (namespace, agent)), which is what stops one
        realm's flood from costing another realm's agents their budget.
      parameters:
        - $ref: "#/components/parameters/XCrierNamespace"
        - $ref: "#/components/parameters/XCrierNamespaceToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [topic, event]
              properties:
                topic:
                  type: string
                  description: |
                    Literal, dot-separated topic name — segments of letters,
                    digits, "_" or "-" joined by single dots, at most 256
                    bytes. Wildcards are subscriber-side only: a topic
                    containing "*" or ">" is rejected with 400. The event fans
                    out to every matching exact or wildcard subscription, and
                    each matching subscription receives it exactly once.
                event:
                  type: object
                  description: Event payload
      responses:
        "202":
          description: |
            Event accepted for delivery (fire-and-forget). If the topic has
            zero subscribers the event is dropped by design — publishes to
            empty topics are not queued or retained, and the topic does not
            appear in GET /relay/topics until at least one subscriber connects.
        "400":
          description: |-
            Invalid request — malformed JSON, missing or empty topic/event, an
            invalid topic (empty, leading/trailing/consecutive dots, whitespace
            or any character outside `letters digits _ - .`, over 256 bytes, or
            a wildcard token), a namespace the server does not declare (error
            UNKNOWN_NAMESPACE), a `namespace` MEMBER in the body (send the
            X-Crier-Namespace header instead), or a namespace that disagrees
            between the header and the query parameter.
        "401":
          description: X-Agent-ID header required (rate limiting enabled), or the named namespace requires its own credential (X-Crier-Namespace-Token) and it is missing or wrong (error NAMESPACE_UNAUTHORIZED)
        "429":
          description: |
            Rate limit exceeded — the cap is the publishing namespace's OWN
            (CR-FEAT-029) when it declares one, else `CR_RATE_LIMIT_PER_MINUTE`
            (default 100 events/minute, keyed on the X-Agent-ID header and
            counted per (namespace, agent), so one realm's flood cannot spend
            another's budget). The refusal carries a `Retry-After` header
            (CR-FEAT-035) — an integer number of seconds, never below 1 — so a
            client knows how long to back off instead of guessing. The budget
            is PER AGENT within a realm: one noisy publisher cannot spend
            another's. For the delivery path's separate GLOBAL budget see
            POST /agents/{id}/inbox.
          headers:
            Retry-After:
              description: Whole seconds the caller should wait before retrying; a retry at that instant is admitted if no other caller has spent the budget in the meantime.
              schema:
                type: integer
                minimum: 1
                example: 47

  /relay/subscribe/{topic}:
    get:
      operationId: relaySubscribe
      tags: [relay]
      summary: Subscribe to a topic or wildcard pattern via WebSocket
      description: |
        The path accepts a literal topic name or a wildcard subscription
        pattern. Published topic names are always literal — wildcards are
        subscriber-side only.

        Wildcard tokens match whole dot-separated segments:

        - `*` is one complete segment and matches EXACTLY one segment:
          `demo.*` matches `demo.one`, but not `demo.one.two` and not `demo`.
        - `>` is one complete FINAL segment and matches ONE OR MORE trailing
          segments: `demo.>` matches `demo.one` and `demo.one.two`, but not
          `demo` itself.

        Subscription patterns are scoped to a NAMESPACE (realm, CR-FEAT-029,
        specs/NAMESPACES.md): two subscribers of the identical topic name in
        two different namespaces are two disjoint sets, and a publish in one
        realm is never delivered to a subscriber of the other — including
        through a wildcard pattern. There is no cross-realm bridging.

        Every other shape is invalid and is rejected with 400 BEFORE the
        WebSocket upgrade: an embedded token (`foo*bar`), a `>` that is not the
        last segment (`foo.>.bar`), empty segments, leading/trailing dots,
        whitespace, and names over 256 bytes.

        Each matching published event is delivered to a subscription exactly
        once. A subscription appears in `GET /relay/topics` under the pattern
        name it subscribed with.

        Every frame names the LITERAL published topic (see the 101 response),
        which is what makes a wildcard subscription usable.
      parameters:
        - name: topic
          in: path
          required: true
          schema:
            type: string
        - name: namespace
          in: query
          required: false
          schema:
            type: string
          description: |-
            The namespace (realm) to subscribe INSIDE (CR-FEAT-029,
            specs/NAMESPACES.md) — an alias of the X-Crier-Namespace header,
            provided separately because a browser WebSocket cannot set headers.
            Absent = the default namespace, which is what every
            pre-CR-FEAT-029 subscriber already gets. A name the server does not
            declare is refused (400) BEFORE the upgrade; a namespace with
            `auth: "token"` requires the X-Crier-Namespace-Token HEADER (401) —
            a realm credential is never accepted in the query string, because a
            URL is logged far more casually than a header.
        - $ref: "#/components/parameters/XCrierNamespace"
        - $ref: "#/components/parameters/XCrierNamespaceToken"
      responses:
        "101":
          description: |
            WebSocket upgrade. Each published event arrives as ONE text frame
            whose payload is a JSON object naming the LITERAL published topic
            and carrying the event unchanged:

            ```json
            {"topic":"dogfood.news","event":{"from":"publisher","body":"hello bus"}}
            ```

            - `topic` is always the literal published topic — never the
              subscription pattern — so a wildcard subscriber (`dogfood.*`,
              `dogfood.>`) can tell which topic matched.
            - `event` is the published event as its own JSON value: an object,
              a string, an array, a number or `null`. It is spliced in verbatim
              and is never re-encoded as a JSON string, so a subscriber can
              decode it directly.
            - The same shape is delivered to exact and wildcard subscriptions
              alike, and exactly once per matching subscription.

            This is a deliberate breaking wire change (DOGFOOD-RELAY-1): frames
            used to be the bare event (`{"from":"publisher","body":"hello bus"}`)
            with no topic field, which made the matched topic unknowable for a
            wildcard subscriber. `POST /relay/publish` is unchanged — still
            `202` with an empty body.
        "400":
          description: Invalid subscription pattern (rejected before the upgrade)

  /relay/topics:
    get:
      operationId: relayListTopics
      tags: [relay]
      summary: List active topics
      responses:
        "200":
          description: |
            Active topics with subscriber counts. Wildcard subscriptions are
            listed under their pattern name (e.g. `demo.*`).

  # ── P2P Mesh ──
  /mesh/peers:
    get:
      operationId: meshListPeers
      tags: [mesh]
      summary: List connected mesh peers
      responses:
        "200":
          description: Connected peers with agent IDs
          content:
            application/json:
              schema:
                type: object
                required: [peers, count]
                properties:
                  peers:
                    type: array
                    description: Connected peer agent IDs
                    items:
                      type: object
                      required: [agent_id]
                      properties:
                        agent_id:
                          type: string
                          description: Connected agent identifier
                  count:
                    type: integer
                    description: Number of connected peers

  /mesh/connect/{agentID}:
    get:
      operationId: meshConnect
      tags: [mesh]
      summary: Open a P2P WebSocket connection to an agent
      parameters:
        - name: agentID
          in: path
          required: true
          schema:
            type: string
      responses:
        "101":
          description: WebSocket upgrade — bidirectional P2P message frames
        "400":
          description: agentID is required

  # ── Relay Federation (CR-FEAT-006) ──
  /fed/peers:
    get:
      operationId: fedListPeers
      tags: [federation]
      summary: List federation peers (local relay first, then linked relays with their agents)
      description: >
        The local relay is listed first (name from CR_FED_NAME, agents from
        the local registry). Each linked relay (CR_FED_LINKS) follows with
        its agents fetched live from its GET /agents endpoint. A link that
        fails to answer still appears, with an empty agents list.
      responses:
        "200":
          description: Federation peers with their agents
          content:
            application/json:
              schema:
                type: object
                required: [peers]
                properties:
                  peers:
                    type: array
                    description: Local relay first, then each linked relay
                    items:
                      type: object
                      required: [name, url, agents]
                      properties:
                        name:
                          type: string
                          description: Relay display name (CR_FED_NAME or host:port)
                        url:
                          type: string
                          description: Relay base URL
                        agents:
                          type: array
                          description: Agents registered on the relay (id + capabilities)
                          items:
                            type: object
                            required: [id]
                            properties:
                              id:
                                type: string
                                description: Agent identifier
                              capabilities:
                                type: array
                                description: Advertised agent capabilities
                                items:
                                  type: string

  # ── Agent Registry ──
  /agents:
    get:
      operationId: registryListAgents
      tags: [registry]
      summary: List registered agents
      description: |
        Capability discovery (spec §7): with ?capability=abc only agents whose
        advertised capabilities include abc are returned. Without the parameter
        all registered agents are returned.
      parameters:
        - name: capability
          in: query
          required: false
          schema:
            type: string
          description: When set, only agents advertising this capability are returned (capability discovery, CR-FEAT-007)
      responses:
        "200":
          description: >-
            Array of registered agents. `status` is DERIVED per read from each
            row's liveness evidence (`last_seen`) and the documented staleness
            window (CR_PRESENCE_STALE_AFTER_S, default 90s = three missed mesh
            heartbeats; GET /status reports the effective window as
            presence_stale_after_s): `online` while a mesh connect accepted for
            the agent, a KEEPALIVE heartbeat on that socket, or a signed PATCH
            is inside the window — `stale` once none of them is (CR-FEAT-024),
            so a crashed agent stops being reported online. A row that STATES
            `offline` stays offline. The value is never stored: the status
            column keeps the online/offline it was written with, and no sweeper
            runs.
    post:
      operationId: registryRegisterAgent
      tags: [registry]
      summary: Register a new agent
      description: |
        The public_key PRESENCE requirement follows signature enforcement
        (DF-CRIER-192): when CR_REQUIRE_AGENT_SIG=true (the default) an
        omitted public_key is rejected with 400 "public_key is required";
        when signing is disabled the key is optional and the agent is
        registered keyless — unusable on any server that enforces
        signatures (its agent-scoped calls answer 401). A public_key that
        IS supplied is validated identically in both modes (64 hex
        characters, ed25519).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id]
              properties:
                id:
                  type: string
                  description: Agent identifier
                public_key:
                  type: string
                  description: "Ed25519 public key (hex-encoded). Required when signature enforcement is enabled (CR_REQUIRE_AGENT_SIG=true, the default); optional when signing is disabled — omitting it then registers a keyless agent that cannot authenticate on any signed route."
                capabilities:
                  type: array
                  items:
                    type: string
                  description: Advertised capabilities
                webhook:
                  $ref: "#/components/schemas/WebhookConfig"
                  description: "Optional webhook endpoint registered at creation time (same object as the PATCH `webhook` property) — when present the endpoint is registered immediately; absent or null leaves the agent with no webhook. Validated on registration (400 on violation), with the same rules as PATCH."
                guard:
                  $ref: "#/components/schemas/GuardAgentConfig"
                  description: "Optional LLM message-guard policy config (CR-FEAT-010, spec LLM-MESSAGE-GUARD.md §4.1/§9.2) — validated at registration (400 on violation); API keys are never part of it, only env: refs"
                namespace:
                  type: string
                  description: |-
                    The namespace (realm) to register INTO (CR-FEAT-029,
                    specs/NAMESPACES.md). Absent — or `default` — is the
                    implicit namespace every pre-CR-FEAT-029 registration got,
                    and it never appears in a response body. A name the server
                    does not declare is a 400 UNKNOWN_NAMESPACE and NEVER a
                    silent fallback to the default namespace; a namespace with
                    `auth: "token"` additionally requires the
                    X-Crier-Namespace-Token header (401
                    NAMESPACE_UNAUTHORIZED) before the row is created.
      responses:
        "201":
          description: "Agent registered. The response is the stored row: identical to what GET /agents/{id} answers, plus a `namespace` member whenever the agent was registered into a DECLARED namespace (absent for the default namespace, so an existing client's payload is unchanged)."
        "400":
          description: "Invalid request body, webhook config, guard config (guard.policies required, policy id 1..64 runes, action allow|block|sanitize, block_risk low|medium|high, providers ≤ 5, custom requires base_url + api_key_ref, deepseek preset forbids thinking_enabled), or a namespace name this server does not declare (error UNKNOWN_NAMESPACE)"
        "401":
          description: "The named namespace requires its own credential (X-Crier-Namespace-Token) and it is missing or wrong (error NAMESPACE_UNAUTHORIZED)"
        "409":
          description: Agent ID already registered

  /agents/{id}:
    get:
      operationId: registryGetAgent
      tags: [registry]
      summary: Get agent details
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: >-
            Agent detail. `status` is derived per read from this row's liveness
            evidence and the documented staleness window — `online`, `stale`
            (no liveness evidence inside CR_PRESENCE_STALE_AFTER_S) or a stated
            `offline`; see GET /agents and GET /status (CR-FEAT-024).
        "404":
          description: Agent not found
    delete:
      operationId: registryUnregisterAgent
      tags: [registry]
      summary: Unregister an agent
      description: |
        When CR_REQUIRE_AGENT_SIG=true (the default), this endpoint requires the
        per-agent ed25519 signature headers X-Agent-ID, X-Agent-Ts, X-Agent-Sig —
        the same signing contract as inbox retrieve/ack/stats: sign
        "DELETE\n/agents/{id}\n<unix-seconds>". An unsigned or invalidly signed
        DELETE is rejected with 401; an agent may only delete itself (the
        X-Agent-ID must match the {id} in the path, else 403).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/XAgentID"
        - $ref: "#/components/parameters/XAgentTs"
        - $ref: "#/components/parameters/XAgentSig"
      security:
        - bearerAuth: []
          agentSignature: []
      responses:
        "204":
          description: Agent unregistered
        "401":
          description: Missing or invalid agent signature (when CR_REQUIRE_AGENT_SIG=true)
        "403":
          description: X-Agent-ID does not match the target agent
        "404":
          description: Agent not found
    patch:
      operationId: registryUpdateAgent
      tags: [registry]
      summary: Partially update an agent's registration (self-configuration directive, spec §7)
      description: |
        Partial update of an agent's registration — the self-configuration
        surface for configure directives (CR-FEAT-007). `capabilities`, when
        present, replaces the advertised capability list; `webhook`, when
        present, registers or updates the webhook endpoint; when absent or
        null the webhook is removed.

        Agent-owned: when CR_REQUIRE_AGENT_SIG=true (the default), this
        endpoint requires the per-agent ed25519 signature headers X-Agent-ID,
        X-Agent-Ts, X-Agent-Sig — the same signing contract as DELETE
        /agents/{id}: sign "PATCH\n/agents/{id}\n<unix-seconds>". An unsigned
        or invalidly signed PATCH is rejected with 401; an agent may only
        update itself (the X-Agent-ID must match the {id} in the path,
        else 403).

        This PATCH has a body, so the caller MAY bind that body to the
        signature with X-Agent-Body-SHA256 (CR-CHAT-027): send the lowercase
        hex sha256 of the exact body and sign
        "PATCH\n/agents/{id}\n<unix-seconds>\nsha256:<hex>" instead. A body
        that does not match the signed digest is refused with 401
        "body digest mismatch" — so a body swapped after signing no longer
        rides the request signature. Omitted, the 3-line contract above
        applies unchanged.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/XAgentID"
        - $ref: "#/components/parameters/XAgentTs"
        - $ref: "#/components/parameters/XAgentSig"
        - $ref: "#/components/parameters/XAgentBodySHA256"
      security:
        - bearerAuth: []
          agentSignature: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                capabilities:
                  type: array
                  items:
                    type: string
                  description: Replaces the advertised capability list when present
                webhook:
                  $ref: "#/components/schemas/WebhookConfig"
                  nullable: true
                  description: Webhook endpoint config — registers/updates when an object; null or absent removes the webhook
                guard:
                  $ref: "#/components/schemas/GuardAgentConfig"
                  nullable: true
                  description: "LLM message-guard config (CR-FEAT-011, spec §9.2) — an object replaces the whole guard config (validated, 400 on violation); explicit null removes the guard (agent falls back to the server default policy); absent leaves it unchanged"
      responses:
        "200":
          description: Agent updated — the full agent object is returned
        "400":
          description: Invalid request body or webhook config
        "401":
          description: Missing or invalid agent signature (when CR_REQUIRE_AGENT_SIG=true)
        "403":
          description: X-Agent-ID does not match the target agent
        "404":
          description: Agent not found
        "501":
          description: Registry backend does not support agent updates

  # ── Inboxes ──
  /agents/{id}/inbox:
    post:
      operationId: inboxDeliver
      tags: [inbox]
      summary: Deliver a message to an agent's inbox
      description: |
        Delivers a message to the target agent. When the agent has a webhook
        endpoint registered, the message is POSTed there instead of the inbox
        (CR-FEAT-001; delivery_mode blocking|async|batch per WEBHOOK-DELIVERY.md).

        When the target agent has a guard policy (CR-FEAT-010), the message is
        classified by the LLM message guard before ANY delivery: allow →
        delivered as today (guard metadata rides in the envelope `crier.guard`
        and — for webhook deliveries — the X-Crier-Guard-* headers); sanitize →
        delivered with the payload replaced by the quarantine notice (§3.5);
        block → 403 GUARD_BLOCKED, never queued/stored/POSTed. Guard errors
        fail open (delivered, X-Crier-Guard-Error: true) unless the policy is
        fail_closed (→ 403 with the error-path verdict) — except that a
        high-confidence deterministic pre-scan hit blocks even under fail_open,
        since the pre-scan never depends on the provider (DF-CRIER-158,
        spec §3.6); the pre-scan's matches are retained either way.

        Outbound webhook POSTs carry, when guarded (spec §7.2):
        X-Crier-Guard-Decision (allow|sanitize), X-Crier-Guard-Risk,
        X-Crier-Guard-Reason (RFC 3986 percent-encoded),
        X-Crier-Guard-Patterns (comma-joined), X-Crier-Guard-Policy,
        X-Crier-Guard-Provider, X-Crier-Guard-Model, X-Crier-Guard-Error
        (true on the guard-error path, and on the §6.3 over-cap path whose allow
        outcomes are flagged errored because the LLM is never consulted there —
        DF-CRIER-294). Batch POSTs carry the worst-case
        verdict across inner messages; per-message verdicts stay in each
        inner envelope's crier.guard metadata. Redelivery and batch flush
        never re-run the guard — the verdict rides with the message.

        Federation (CR-FEAT-006, DF-CRIER-7): when the target agent is not
        registered here and relay links are configured (CR_FED_LINKS), the
        original request is forwarded to the linked relays in order. A link
        answering anything but 404 with a non-retryable status wins and its
        status+body are relayed back verbatim (a blocking webhook reply
        returns untouched). A transient outage (unreachable link, or a
        retryable 5xx/408/429) is HELD at the source and retried inside
        CR_FED_MAX_HOLD_S: the sender gets 202 {"status":"held",...}, and if
        the delivery still cannot be made it gets exactly one
        FEDERATION_FAILED notification in its own inbox. A definitive
        all-links-404 is answered 404 immediately. With no hold queue
        available the transient failure is reported synchronously as 502 —
        and so is a request that names no `sender`, because that terminal
        notification is addressed to the sender's inbox and the delivery
        would otherwise be held with no possible outcome (DF-CRIER-129).

        The raw HTTP request body is capped by `CR_INBOX_MAX_BODY_BYTES`
        (default 1048576 bytes). The cap is checked before JSON decoding,
        guard, idempotency, transport, federation or store work, and applies
        equally to Content-Length and chunked requests. An over-cap request
        answers 413 with `{"error":"REQUEST_BODY_TOO_LARGE"}` and has no
        delivery side effects.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/XCrierNamespaceToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [payload]
              properties:
                payload:
                  type: object
                  description: "Message payload — arbitrary JSON object, stored as raw bytes and returned base64-encoded on retrieve. The key is REQUIRED and must be a JSON object: a body that omits it (`{}`, or a typo'd `payloads`/`paylaod` key), sends an explicit `null`, or sends a non-object value (string, array, number, bool) is rejected with 400 (`{\"error\":\"payload is required\"}` / `{\"error\":\"payload must be a JSON object\"}`) and nothing is dispatched or stored. An empty object `{}` is a valid payload — the contract refuses a MISSING payload, not an empty one."
                sender:
                  type: string
                  description: Originating agent id (webhook envelope metadata)
                session_id:
                  type: string
                  description: "Conversation context for session-aware delivery (CR-FEAT-004) — the guard resolves per-channel policies against it (spec §4.2)"
                thread_id:
                  type: string
                  description: "Thread context for session-aware delivery (CR-FEAT-004) — deliver-API passthrough of the envelope's thread_id (spec §9.3); the guard resolves per-channel policies against it (spec §4.2)"
                delivery_mode:
                  type: string
                  enum: [blocking, async, batch]
                  description: |
                    Overrides the agent's webhook default delivery mode. The
                    same set the agent's own `webhook.delivery_mode` config
                    accepts, so the request cannot ask for queue semantics the
                    server has no way to execute.

                    Absent (or empty) keeps the existing resolution: the
                    target's configured webhook default, and `async` when it
                    states none. Any other value is rejected with 400 —
                    `{"error":"delivery_mode must be blocking|async|batch"}` —
                    and nothing is dispatched or stored. Validation runs
                    BEFORE the transport/store choice, so an unknown value is
                    refused identically for a webhook target, an agent with no
                    webhook (`transport: "inbox"`) and an unknown agent; the
                    accept body never echoes an unresolved mode back as if it
                    were the resolved semantics.
                timeout_ms:
                  type: integer
                  minimum: 0
                  maximum: 120000
                  default: 30000
                  description: |
                    Bounds a BLOCKING delivery, in milliseconds. Range
                    0..120000 — parity with the agent's `webhook.timeout_ms`
                    config bound. Absent or 0 means the blocking default
                    (30000 ms); it is not "no timeout". A negative value or one
                    above 120000 is rejected with 400
                    (`{"error":"timeout_ms must be 0..120000"}`) instead of
                    being coerced to the default. Only the blocking path
                    consults it; `async`/`batch` queueing is not affected.
                request_id:
                  type: string
                  description: Sender's correlation id, echoed in the reply
                kind:
                  type: string
                  description: Envelope kind (spec §3, §7) — message (default), configure (self-configuration directive), or configure_ack (agent's acknowledgement). Webhook deliveries carry it in the envelope crier.kind field and the X-Crier-Event header unchanged.
                priority:
                  type: integer
                  minimum: 0
                  maximum: 9
                  default: 0
                  description: |
                    Retrieval priority, 0..9 (CR-FEAT-035) — higher is handed
                    back first by GET /agents/{id}/inbox. Ties keep arrival
                    order, and the default (0) is plain FIFO, so a delivery
                    that omits this field is ordered exactly as it was before
                    the field existed. A value outside 0..9 is rejected with
                    400 (`{"error":"priority must be 0..9"}`) and nothing is
                    dispatched or stored — it is never clamped, because a
                    clamped priority would read back in an order the caller
                    could not explain from its own request.

                    The queue is not a priority queue in the algorithm-textbook
                    sense: a higher-priority message is preferred among the
                    messages that are CLAIMABLE at that moment (unacked,
                    unexpired, unleased), and each retrieve hands back at most
                    `limit` of them. A priority is therefore how an urgent
                    message gets ahead of a low-value backlog in the SAME
                    inbox; it cannot pre-empt a lease already handed out, and
                    it does not reorder across agents.

                    Stored on THE MESSAGE, so it is the postgres column
                    `inbox_entries.priority` (migration 007) — the ordering
                    survives a restart on the durable backend, and an existing
                    database reads every message it already holds as priority
                    0, which is the order it has always had.
                idempotency_key:
                  type: string
                  maxLength: 128
                  description: |
                    Optional sender-supplied deduplication key (CR-FEAT-025).
                    A second delivery carrying the SAME key for the SAME agent
                    within the relay's deduplication window
                    (`CR_IDEMPOTENCY_WINDOW_S`, default 24h) is answered with
                    the ORIGINAL accept — same `id`, same status, same
                    transport — and stores nothing: one key yields one
                    message, so a sender that retried after losing the
                    response does not duplicate work on the target.

                    The replay is marked with `idempotent_replay: true` in the
                    response body, so a caller can always tell a replayed
                    accept from a fresh one while still reading the message id
                    it needs from either. A blocking delivery replays with the
                    reply the single endpoint call produced.

                    Scope: per (agent, key) pair — the same key aimed at two
                    different agents is two deliveries. Absent or empty means
                    no deduplication, exactly as before. A key longer than 128
                    characters is rejected with 400. Only an ACCEPT is
                    replayed: a rejected delivery (400/403/404/409/502)
                    records nothing, so a corrected retry under the same key
                    is delivered rather than answered with a replay of the
                    rejection. Two simultaneous duplicates are serialized, and
                    the second answers with the first one's accept; a duplicate
                    that arrives while the original is still in flight for
                    longer than the server's bound is answered 409.
                namespace:
                  type: string
                  description: |-
                    The namespace (realm) this delivery believes it is
                    addressing (CR-FEAT-029, specs/NAMESPACES.md). CHECKED
                    against the target agent's own namespace, never believed:
                    absent means "the target's realm" (what every
                    pre-CR-FEAT-029 request does), and any other value is
                    refused with 403 NAMESPACE_MISMATCH — a message cannot cross
                    namespaces by naming one. The stored message carries the
                    TARGET's realm whatever this member said, and the realm is
                    recorded with the message so a retrieve reports it.
                principal_id:
                  type: string
                  description: |-
                    The HUMAN principal this delivery is made by (CR-CHAT-003,
                    specs/CHAT-PERMISSIONS.md §6.3). With `as_agent` it says
                    "this human speaks AS this agent". Pairing it with a
                    delivery asserts a person's identity — the request must
                    also hold a live BINDING to `as_agent` (§2.3), because a
                    human writes as an agent and never as an anonymous bus
                    identity. Absent is the anonymous sender: allowed on an
                    unclassed target (the shipped posture) and refused on a
                    classed one while the delivery ACL is armed
                    (`CR_PERMISSIONS_ENABLED`). The field is inert while no
                    ACL is deployed.
                as_agent:
                  type: string
                  description: |-
                    The agent a principal speaks AS (§2.3/§6.3). Required
                    whenever `principal_id` is present: a principal that names
                    no binding is refused with 403 DELIVERY_FORBIDDEN and
                    `"reason":"NO_BINDING"`. A binding is a SPEECH right, not
                    a SEND — holding one does not by itself admit the
                    delivery, which is still checked against the action `send`
                    on the target (§6.5).
                addressing:
                  type: string
                  description: |-
                    The optional addressing "to line" (CR-CHAT-004,
                    specs/CHAT-ADDRESSING.md §1.1): a comma/semicolon/whitespace
                    separated address list of `@agent`, `@team:x`, `@cap:y`,
                    `@ns/…`, `@instance/agent` and `#session`, at most 64
                    addresses. Absent (or empty) is the pre-CR-CHAT-004 request
                    and changes nothing. A malformed address is refused with 400
                    `{"error":"INVALID_ADDRESS","address":…,"reason":…,"detail":…}`
                    naming the offending token and the rule — never silently
                    ignored. The header `X-Crier-Addressing` carries the same
                    value; the body field wins when both are present. The list
                    is PARSED, never executed: a tag is addressing, not a task
                    (§2.5), so no fan-out and no work follow from it.
                ttl_seconds:
                  type: integer
                  minimum: 0
                  maximum: 9223372036
                  description: |
                    Message expiry in seconds. Absent leaves the server default
                    (24h). 0 means the message never expires: `expires_at` is
                    reported as JSON null — the key is present, its value is
                    null — and the message is never TTL-purged. A value above
                    the duration bound (or a negative one) is rejected with 400.
                    Applies to messages stored in the target's inbox — a webhook
                    delivery is not stored, so it has no expiry.
      responses:
        "201":
          description: "Message stored in the target's durable inbox (transport \"inbox\"). Webhook-configured agents never answer 201 — their deliveries accept with 200 (blocking) or 202 (async/batch) and are NOT stored (DF-CRIER-157). A stored message that expires while it is still unacknowledged is dead-lettered (GET /agents/{id}/inbox/dead-letters) and produces exactly one MESSAGE_EXPIRED receipt in the SENDER's own inbox (CR-FEAT-025): a TTL expiry is reported, never silent."
          content:
            application/json:
              schema:
                type: object
                required: [id, transport]
                properties:
                  id:
                    type: string
                    description: Assigned message id
                  transport:
                    type: string
                    enum: [inbox]
                    description: "Where the message went (DF-CRIER-157): \"inbox\" — it is in the target's durable inbox and retrievable with GET /agents/{id}/inbox. The field is always present, so a sender branches on it instead of inferring the destination from the status code."
                  expires_at:
                    type: [string, "null"]
                    format: date-time
                    description: "Resolved expiry of the stored message — it reflects the requested ttl_seconds, never a fixed default. RFC 3339 for a finite lifetime; JSON null when ttl_seconds was 0 (the message never expires, and the key is still present — null is the value, not the absence). Absent on webhook deliveries (blocking 200, async/batch 202), where no inbox entry is created; absent and null are therefore distinct states."
                  guard:
                    $ref: "#/components/schemas/GuardVerdictMeta"
                    description: "Guard verdict metadata whenever the verdict is not a CLEAN pass (decision allow + no error + risk low + no matched patterns) — visibility for async senders. Surfaced for sanitize, errored fail-open, and any allow carrying a risk marker (e.g. the over-cap `oversize` marker); a clean allow omits it (CR-FEAT-010, spec §9.3, DF-CRIER-158)"
                  idempotent_replay:
                    type: boolean
                    description: "Present (true) when this accept was answered from the recorded accept of an EARLIER delivery under the same `idempotency_key` (CR-FEAT-025): nothing was stored or dispatched by this request, and `id` is the message the first delivery stored. Absent means this request produced the accept."
        "202":
          description: |
            Accepted, not yet delivered. Two shapes — branch on the body, not on the status code (DF-CRIER-157, DF-CRIER-7).

            (a) WEBHOOK async/batch accept (`transport: "webhook"`): the message was handed to the target's webhook queue and is NOT stored in its inbox, so the target's inbox stays EMPTY by design — an empty retrieve does not mean the delivery was lost. `delivery_mode` echoes the RESOLVED queue semantics (`async` = one queued POST; `batch` = coalesced into the endpoint's next batch flush). Failure recovery: when the queue exhausts its bounded retries (`CR_WEBHOOK_MAX_RETRIES` failing attempts — or the endpoint's smaller `retries` budget — one per `CR_WEBHOOK_REDELIVER_S` tick), exactly one durable `WEBHOOK_FAILED` message is written into the SENDER's own inbox — a direct store write that never routes back through webhook delivery.

            (b) HELD federation delivery (`status: "held"`): every link is failing transiently, so the request is queued at this relay and retried inside `CR_FED_MAX_HOLD_S`; a terminal failure is reported once as `FEDERATION_FAILED` in the sender's own inbox. This held shape REQUIRES a `sender` on the request: the terminal report is addressed to that inbox, so a request that names no sender can never deliver its own outcome and is never held — it is answered synchronously with the `502` FEDERATION_FAILED shape below (DF-CRIER-129).
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/WebhookDeliverAccept"
                  - type: object
                    required: [status, id, target, max_hold_s]
                    properties:
                      status:
                        type: string
                        enum: [held]
                        description: "held — the federation delivery is queued at the source and retried (only when the request names a `sender`; a sender-less request is answered 502 FEDERATION_FAILED instead, DF-CRIER-129)"
                      id:
                        type: string
                        description: Assigned message id (also the correlation id of the FEDERATION_FAILED notification, if any)
                      target:
                        type: string
                        description: Target agent id the held delivery is addressed to
                      max_hold_s:
                        type: integer
                        description: "Hold budget (CR_FED_MAX_HOLD_S) in seconds — after this the sender is told FEDERATION_FAILED"
        "200":
          description: "Blocking webhook delivery completed — the endpoint's reply is in the body (delivery_mode=blocking). Nothing is stored in the target's inbox, and the 200 is webhook-transported by construction (DF-CRIER-157)."
          content:
            application/json:
              schema:
                type: object
                required: [id, transport, reply]
                properties:
                  id:
                    type: string
                    description: Assigned message id
                  transport:
                    type: string
                    enum: [webhook]
                    description: "Always \"webhook\": a blocking delivery exists only on the webhook path"
                  reply:
                    description: "The endpoint's reply, extracted per the agent's reply schema (`schema_template` or `custom_schema.response_map`: JSONPath into the body, or `raw` = the whole body) — arbitrary JSON"
                  session_id:
                    type: string
                    description: Session id from the original request, when present
                  request_id:
                    type: string
                    description: Sender correlation id, echoed back
                  idempotent_replay:
                    type: boolean
                    description: "Present (true) when this reply was answered from the recorded accept of an EARLIER delivery under the same `idempotency_key` (CR-FEAT-025): the endpoint was called ONCE, and `reply` is the reply that single call produced."
        "400":
          description: |
            Invalid request — nothing is dispatched to the target's webhook and
            no inbox entry is created. Five classes:

            (a) the body is not JSON;
            (b) a store-level input is invalid (`ttl_seconds` negative, or above
            the duration bound);
            (c) a REQUEST-LEVEL DELIVERY PARAMETER cannot be honored
            (DF-CRIER-180): `delivery_mode` outside the enum, or `timeout_ms`
            outside 0..120000. The error names the allowed values, e.g.
            `{"error":"delivery_mode must be blocking|async|batch"}` or
            `{"error":"timeout_ms must be 0..120000"}`. This validation runs
            BEFORE the transport/store choice, so the same request is refused
            with the same 400 for a webhook target, an agent with no webhook,
            and an unknown agent.
            (d) the REQUIRED `payload` key is missing or is not a JSON object
            (DF-CRIER-112): the requestBody schema declares
            `required: [payload]` with `payload: type: object`, so a body that
            omits the key (`{}`, or the same client typo under another name —
            `payloads`, `paylaod`) is rejected with
            `{"error":"payload is required"}`, and an explicit `null`, a
            string, an array, a number or a bool is rejected with
            `{"error":"payload must be a JSON object"}`. Nothing is dispatched
            or stored — an empty object `{}` IS a valid payload, so the
            refusal is about the missing/invalid key, never about content.
            Like (c), this check runs BEFORE the transport/store choice and is
            therefore identical for a webhook target, an inbox-only agent and
            an unknown agent.
            (e) the optional `addressing` "to line" is malformed (CR-CHAT-004,
            specs/CHAT-ADDRESSING.md §4): a bad character, an empty token
            (`@`, `#`, `@team:`, `@cap:`, `@ns/`), a reserved-prefix misuse, a
            trailing separator, a second `#` room in one write, or more than
            `maxAddressesPerWrite` (64) addresses. The body is
            `{"error":"INVALID_ADDRESS","address":"@team:","reason":"EMPTY_GROUP_NAME","detail":"…"}`
            — a machine-readable NAMED refusal naming the offending token and
            the rule, never a silent drop. Like (c) and (d), it runs BEFORE the
            transport/store choice: nothing is dispatched and nothing is stored.
            A request with no `addressing` field (or an empty one) is exactly
            the pre-CR-CHAT-004 request.
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error:
                    type: string
                    description: "Human-readable rejection naming the offending field and its allowed values, e.g. 'delivery_mode must be blocking|async|batch', 'payload is required', 'payload must be a JSON object'"
        "413":
          description: "The raw request body exceeds CR_INBOX_MAX_BODY_BYTES (default 1048576). Nothing was decoded, dispatched, forwarded, guarded or stored. The stable error is REQUEST_BODY_TOO_LARGE."
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error:
                    type: string
                    enum: [REQUEST_BODY_TOO_LARGE]
        "403":
          description: "Message blocked by the LLM message guard (CR-FEAT-010, spec §2.1) — never queued, never stored, never POSTed; the body carries the verdict. Also the NAMESPACE_MISMATCH refusal (CR-FEAT-029): the request named a namespace the TARGET agent is not registered in, and the message was not stored — a delivery cannot cross namespaces by naming one (specs/NAMESPACES.md §5). Also the DELIVERY ACL refusal (CR-CHAT-003, specs/CHAT-PERMISSIONS.md §6.7), present only while `CR_PERMISSIONS_ENABLED` arms the ACL and only for a CLASSED target: the effective sender holds no live grant, no ownership rule (§3.2) and no scope reach, and the delivery is refused with `{\"error\":\"DELIVERY_FORBIDDEN\",\"reason\":\"NO_GRANT\"|\"NO_BINDING\",\"principal\":…,\"as_agent\":…,\"target\":{…},\"action\":…,\"detail\":…}` — a machine-readable body a client branches on, with no store side effect."
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/GuardBlockedResponse"
                  - type: object
                    required: [error]
                    properties:
                      error:
                        type: string
                        enum: [NAMESPACE_MISMATCH]
                      detail:
                        type: string
                        description: Names the target's namespace and the one the request asked for
        "404":
          description: "Agent not found — locally and on every linked relay (a definitive all-links-404). A link outage is never reported as 404 (DF-CRIER-7): it is held (202) when the request names a sender, or reported as 502 FEDERATION_FAILED (no hold queue, queue refused, or no sender on the request — DF-CRIER-129)."
        "429":
          description: |
            Global ingest budget exceeded (CR-FEAT-035,
            `CR_RATE_LIMIT_GLOBAL_PER_MINUTE`) — the bus refused to take on
            more work. The delivery reached no transport, no guard call and no
            inbox: a shed is cheap by construction, which is the point of
            having one. The error is NAMED (`RATE_LIMITED_GLOBAL`) rather than
            prose, so a client can branch on it, and the response carries a
            `Retry-After` header plus the same figure as `retry_after_s` in the
            body.

            Scope: GLOBAL across every agent and every sender — the budget
            exists because a per-agent cap cannot shed a flood that arrives
            from many ids at once. It is opt-in: with
            `CR_RATE_LIMIT_GLOBAL_PER_MINUTE` unset (the default, 0) no
            delivery is ever refused with this status, and the only
            backpressure on the bus is the per-agent publish cap
            (`CR_RATE_LIMIT_PER_MINUTE`, POST /relay/publish). Per-namespace
            budgets are part of CR-FEAT-029; today every delivery counts
            against one global key.

            Ordering: the budget is checked AFTER the request has been decoded,
            validated and the containment (CR-FEAT-030) decision made, and
            BEFORE idempotency bookkeeping, federation forwarding, the guard
            call and the store write — so a malformed delivery still answers
            400, a contained agent still answers 403 `AGENT_QUARANTINED`, and
            neither is masked by a 429.
          headers:
            Retry-After:
              description: Whole seconds to wait before retrying; a retry at that instant is admitted if no other caller has spent the budget in the meantime.
              schema:
                type: integer
                minimum: 1
                example: 60
          content:
            application/json:
              schema:
                type: object
                required: [error, scope, limit_per_minute, retry_after_s]
                properties:
                  error:
                    type: string
                    enum: [RATE_LIMITED_GLOBAL]
                    description: The named refusal. A client that retries on any 429 without reading this cannot tell the two budgets apart.
                  scope:
                    type: string
                    enum: [global]
                    description: Which budget refused the delivery. `global` today; CR-FEAT-029 adds one value per namespace.
                  limit_per_minute:
                    type: integer
                    description: The budget in force, so a client logs the number it was refused by rather than assuming a server default.
                    example: 600
                  retry_after_s:
                    type: integer
                    minimum: 1
                    description: The same wait as the Retry-After header, for clients that log only the body.
                    example: 60
        "502":
          description: |
            Bad gateway — the delivery was rejected upstream; a rejection is never reported as 404.

            (a) BLOCKING webhook delivery permanently rejected (`error: "webhook: permanent failure: …"`): the endpoint answered a non-retryable status (4xx other than 408/429 — bad auth, wrong URL, bad request) or answered 2xx with a body the agent's reply schema cannot map (`reply extraction: …`). Retrying the identical message cannot succeed, so it fails fast instead of burning the caller's budget (DF-CRIER-157). A timeout or an exhausted budget stays `504`, where a later attempt can still land.

            (b) FEDERATION_FAILED — a transient link failure that is NOT held: every link is unreachable or answered a retryable status (5xx/408/429), and no hold was taken because there is no hold queue available, the queue refused the delivery, or the request names no `sender` (an unreportable delivery — the terminal FEDERATION_FAILED is addressed to the sender's inbox, so it is answered synchronously instead of being held, DF-CRIER-129). `detail` states the reason.
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    required: [error]
                    properties:
                      error:
                        type: string
                        description: "\"webhook: permanent failure: status 400\" / \"webhook: permanent failure: reply extraction: …\" — the endpoint's non-retryable rejection of a blocking delivery (DF-CRIER-157)"
                  - type: object
                    required: [error, message_id, target, attempts]
                    properties:
                      error:
                        type: string
                        enum: [FEDERATION_FAILED]
                      message_id:
                        type: string
                        description: Assigned message id of the failed delivery
                      target:
                        type: string
                        description: Target agent id
                      sender:
                        type: string
                        description: Sender from the original request, when present
                      request_id:
                        type: string
                        description: Sender correlation id, when present
                      session_id:
                        type: string
                        description: Session id, when present
                      attempts:
                        type: integer
                        description: Forward attempts made before giving up
                      status:
                        type: integer
                        description: Last retryable remote status observed (absent when the failure was transport-level)
                      detail:
                        type: string
                        description: "Why the delivery was NOT held, plus the last transport/status error behind it — one of: \"federation: no link reachable|no link delivered …\" (every link unreachable or answering a retryable status, and no hold queue available), \"federation: hold delivery: …\" (the hold queue refused the delivery), \"federation: no sender on the deliver request (target …): …\" (the request names no sender, so a terminal FEDERATION_FAILED could never be reported — an unreportable delivery is never held, DF-CRIER-129). Never carries the link token."
    get:
      operationId: inboxRetrieve
      tags: [inbox]
      summary: Retrieve undelivered messages from inbox
      description: |
        When CR_REQUIRE_AGENT_SIG=true (the default), this endpoint requires the
        per-agent ed25519 signature headers X-Agent-ID, X-Agent-Ts, X-Agent-Sig —
        the same signing contract as DELETE /agents/{id}: sign
        "GET\n/agents/{id}/inbox\n<unix-seconds>". An unsigned or invalidly signed
        retrieve is rejected with 401; an agent may only retrieve its own inbox
        (the X-Agent-ID must match the {id} in the path, else 403).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/XAgentID"
        - $ref: "#/components/parameters/XAgentTs"
        - $ref: "#/components/parameters/XAgentSig"
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
          description: >-
            Maximum messages to claim per retrieve (1..100; >100 answers 400
            "max must be <= 100"). Alias of the historical `max` — both
            spellings are accepted; when both appear in one request, `max`
            wins and `limit` fills in only what it left absent.
        - name: lease_seconds
          in: query
          schema:
            type: integer
            default: 30
            description: Duration to lease messages (prevents double delivery)
          description: >-
            Lease duration in seconds. Alias of the historical `lease` — both
            spellings are accepted; when both appear in one request, `lease`
            wins and `lease_seconds` fills in only what it left absent.
        - name: wait_seconds
          in: query
          schema:
            type: integer
            default: 0
            minimum: 0
            maximum: 120
          description: |-
            Long-poll budget in seconds, 0..120 (default 0 = absent = the
            poll-only read, byte-identical to the response this endpoint has
            always returned).

            With `wait_seconds` > 0 the request PARKS until a message is
            claimable and then answers immediately with that batch — the
            long-poll every agent framework already understands. If nothing
            arrives inside the budget it answers `200` with the same empty body
            (`messages: []`, `lease_id: ""`, plus the live `queue_depth` /
            `leased_count`) a poll-only read gets, so a client treats both the
            same way and simply re-polls. A message that arrives through this
            relay's deliver endpoint wakes a parked read at once; inbox writes
            that bypass it (the federation hold queue, webhook-failure notices,
            a second relay process sharing the store) surface within about a
            second. Errors are NOT waited out: an unregistered agent still
            answers `404` immediately.

            The budget is honored or rejected, never silently ignored
            (DF-CRIER-180): a non-integer, a negative value, or one above 120
            answers `400`. 120 is the ceiling the request-level blocking
            deliver budget uses (`webhook.timeout_ms`), so the two
            request-level waits cannot disagree. Lease, ack and TTL semantics
            are untouched — a long-poll is a sequence of ordinary retrieves.

            An agent that cannot hold an HTTP request open can instead be
            pinged on its mesh socket (`?inbox_notify=1` on `GET
            /mesh/connect/{agentID}`, frame `INBOX_NOTIFY` — docs/mesh-protocol.md).
      security:
        - bearerAuth: []
          agentSignature: []
      responses:
        "200":
          description: |-
            Array of leased messages. A long-poll (`wait_seconds` > 0) that expires
            with nothing claimable answers this exact shape with an empty `messages`
            array and an empty `lease_id` — the same body a poll-only read gets, so
            the two are indistinguishable by design and a client simply re-polls.
          content:
            application/json:
              schema:
                type: object
                required: [messages, lease_id, queue_depth, leased_count]
                properties:
                  messages:
                    type: array
                    description: Leased inbox entries — payload objects travel as base64-encoded strings (Go []byte JSON encoding); decode each entry's payload before use. Entries carry guard metadata (CR-FEAT-010) when the delivery was guarded. Always a JSON array (never null); an empty array means nothing was claimed.
                    items:
                      $ref: "#/components/schemas/InboxEntry"
                  lease_id:
                    type: string
                    description: |-
                      Lease covering the returned messages — pass it to inboxAck together with IDs from THIS response to release them. It is an EMPTY STRING exactly when no messages were claimed (empty inbox, or every queued message is already leased and unexpired): no lease is minted, the messages array is empty, and there is nothing to ack. Do not reuse a lease ID from an earlier retrieval, and do not ack an empty batch.
                  queue_depth:
                    type: integer
                    description: "Undelivered messages in the queue — same value GET /agents/{id}/inbox/stats reports, taken immediately after this retrieve (DF-CRIER-177). An empty messages array with queue_depth > 0 means messages exist but none were claimable now."
                  leased_count:
                    type: integer
                    description: "Messages currently held under unexpired leases — same value GET /agents/{id}/inbox/stats reports, taken immediately after this retrieve (DF-CRIER-177). An empty messages array with leased_count > 0 means everything queued is HELD by other retrievers, not lost — the messages return after lease expiry or are removed by their holder's ack."
        "401":
          description: Missing or invalid agent signature (when CR_REQUIRE_AGENT_SIG=true)
        "403":
          description: X-Agent-ID does not match the target agent
        "404":
          description: Agent not found

  /agents/{id}/inbox/stats:
    get:
      operationId: inboxStats
      tags: [inbox]
      summary: Get inbox queue statistics
      description: |
        When CR_REQUIRE_AGENT_SIG=true (the default), this endpoint requires the
        per-agent ed25519 signature headers X-Agent-ID, X-Agent-Ts, X-Agent-Sig —
        the same signing contract as DELETE /agents/{id}: sign
        "GET\n/agents/{id}/inbox/stats\n<unix-seconds>". An unsigned or invalidly
        signed request is rejected with 401; an agent may only read its own stats
        (the X-Agent-ID must match the {id} in the path, else 403).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/XAgentID"
        - $ref: "#/components/parameters/XAgentTs"
        - $ref: "#/components/parameters/XAgentSig"
      security:
        - bearerAuth: []
          agentSignature: []
      responses:
        "200":
          description: Queue statistics
          content:
            application/json:
              schema:
                type: object
                required: [queue_depth, leased_count, oldest_age_ms]
                properties:
                  queue_depth:
                    type: integer
                    description: Undelivered messages in queue
                  leased_count:
                    type: integer
                    description: Messages currently leased out
                  oldest_age_ms:
                    type: integer
                    description: Age of oldest queued message in milliseconds
        "401":
          description: Missing or invalid agent signature (when CR_REQUIRE_AGENT_SIG=true)
        "403":
          description: X-Agent-ID does not match the target agent
        "404":
          description: Agent not found

  /agents/{id}/inbox/ack:
    post:
      operationId: inboxAck
      tags: [inbox]
      summary: Acknowledge message delivery (release lease)
      description: |
        When CR_REQUIRE_AGENT_SIG=true (the default), this endpoint requires the
        per-agent ed25519 signature headers X-Agent-ID, X-Agent-Ts, X-Agent-Sig —
        the same signing contract as DELETE /agents/{id}: sign
        "POST\n/agents/{id}/inbox/ack\n<unix-seconds>". An unsigned or invalidly
        signed ack is rejected with 401; an agent may only ack its own inbox
        (the X-Agent-ID must match the {id} in the path, else 403).

        The ack body MAY be bound to the signature with X-Agent-Body-SHA256
        (CR-CHAT-027): send the lowercase hex sha256 of the exact body and sign
        "POST\n/agents/{id}/inbox/ack\n<unix-seconds>\nsha256:<hex>". A body
        that does not match the signed digest is refused with 401
        "body digest mismatch". Omitted, the 3-line contract above applies
        unchanged.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/XAgentID"
        - $ref: "#/components/parameters/XAgentTs"
        - $ref: "#/components/parameters/XAgentSig"
        - $ref: "#/components/parameters/XAgentBodySHA256"
      security:
        - bearerAuth: []
          agentSignature: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [lease_id, message_ids]
              properties:
                lease_id:
                  type: string
                  description: |-
                    The non-empty lease ID from the inboxRetrieve response that returned these message IDs. It must match the lease currently held on every acked message, or the server rejects with 409. A retrieve that claimed nothing returns an empty lease_id — such a response has no IDs to ack, so never send it here.
                message_ids:
                  type: array
                  items:
                    type: string
                  description: IDs to acknowledge — only IDs returned by the same retrieve call as lease_id. An ID the inbox does not hold (never delivered, already acked, or expired) is rejected with 404.
      responses:
        "204":
          description: Messages acknowledged, lease released (no body)
        "400":
          description: Invalid request body, or missing lease_id / message_ids
        "401":
          description: Missing or invalid agent signature (when CR_REQUIRE_AGENT_SIG=true)
        "403":
          description: X-Agent-ID does not match the target agent
        "404":
          description: |-
            Agent not found, OR at least one message_id does not exist in the agent's inbox (never delivered, already acknowledged, or expired and purged). A missing ID always answers 404 — it is never reported as a lease conflict — and the error body names the offending IDs.
        "409":
          description: |-
            Lease conflict — every requested message ID exists, but at least one is leased under a different (or no) lease. The body reports the current lease held on the message, so the caller can re-retrieve instead of acking with a stale lease.

  /agents/{id}/inbox/transfer:
    post:
      operationId: inboxTransfer
      tags: [inbox]
      summary: Transfer (reassign) messages from one inbox to another
      description: |
        Moves messages out of this inbox and into another agent's — the
        rebalance surface for a STUCK lease (CR-FEAT-025). A holder that took a
        message and never acked it can be worked around immediately: the
        messages land in the destination UNLEASED, so a live worker claims them
        without waiting out the lease and racing every other consumer for them.

        The lease stays a real lock by default: a message that is currently
        leased must be moved under ITS lease (`lease_id`), exactly as an ack
        requires, and a mismatch answers 409 with nothing moved. An UNLEASED
        message needs no lease — nobody owns it, and it is claimable by any
        consumer anyway — so rebalancing unfetched work needs no override.
        `force: true` is the explicit operator override for a holder that is
        gone: it moves the messages whatever their lease state, and it must be
        asked for on every call.

        Messages move as a UNIT: an unknown ID answers 404 and nothing moves. A
        moved message keeps its id, payload, creation time and expiry; only its
        agent and lease/ack state change.

        When CR_REQUIRE_AGENT_SIG=true (the default), this endpoint requires the
        per-agent ed25519 signature headers X-Agent-ID, X-Agent-Ts, X-Agent-Sig
        — the same signing contract as DELETE /agents/{id}: sign
        "POST\n/agents/{id}/inbox/transfer\n<unix-seconds>". The holder signs its
        own rebalance; an operator acting on a dead holder's behalf uses the
        shared relay token (CR_AUTH_TOKEN) with signature enforcement off, the
        same authorization the other inbox routes accept.

        The transfer body MAY be bound to the signature with
        X-Agent-Body-SHA256 (CR-CHAT-027): send the lowercase hex sha256 of the
        exact body and sign
        "POST\n/agents/{id}/inbox/transfer\n<unix-seconds>\nsha256:<hex>". A
        body that does not match the signed digest is refused with 401
        "body digest mismatch". Omitted, the 3-line contract above applies
        unchanged.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: The CURRENT holder's agent id — the inbox the messages move out of.
        - $ref: "#/components/parameters/XAgentID"
        - $ref: "#/components/parameters/XAgentTs"
        - $ref: "#/components/parameters/XAgentSig"
        - $ref: "#/components/parameters/XAgentBodySHA256"
      security:
        - bearerAuth: []
          agentSignature: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [target_agent_id, message_ids]
              properties:
                target_agent_id:
                  type: string
                  description: "The destination inbox. Must be a registered agent, and must differ from the {id} in the path (400 otherwise). An unregistered target answers 404 — a transfer to nowhere is refused, never queued."
                lease_id:
                  type: string
                  description: "The lease a LEASED message is currently held under. A message held under a different (or no) lease answers 409 and nothing moves. An unleased message needs no lease — nobody owns it, and it is claimable by any consumer anyway, so moving it displaces nobody."
                message_ids:
                  type: array
                  minItems: 1
                  items:
                    type: string
                  description: "The messages to move — required and non-empty. All of them move or none does: an ID the source inbox does not hold (never delivered, already acked, or expired) is answered 404 naming the offending IDs."
                force:
                  type: boolean
                  description: "Operator override: move the messages whatever their lease state, clearing the lease so the destination can claim them. The escape hatch for a holder that is gone. Never implied and never defaulted — it must be set on every call that needs it, which is why this schema states no default at all (an absent field is false by the JSON contract, not by a server-side default)."
      responses:
        "200":
          description: Messages moved (all of them, or the request was rejected)
          content:
            application/json:
              schema:
                type: object
                required: [from, to, moved, message_ids]
                properties:
                  from:
                    type: string
                    description: The source inbox the messages left.
                  to:
                    type: string
                    description: The destination inbox the messages joined, unleased.
                  moved:
                    type: integer
                    description: How many messages moved — equal to len(message_ids) on success.
                  message_ids:
                    type: array
                    items:
                      type: string
                    description: The moved message ids, in the order they were requested. They are unchanged, so a lease or receipt naming an id still resolves after the move.
                  forced:
                    type: boolean
                    description: Present (true) when the move overrode a lease.
        "400":
          description: Invalid request body, a missing target_agent_id or message_ids, or a target equal to the source.
        "401":
          description: Missing or invalid agent signature (when CR_REQUIRE_AGENT_SIG=true)
        "403":
          description: X-Agent-ID does not match the source agent
        "404":
          description: |-
            The source agent is not registered, the target agent is not registered, or at least one message_id is not in the source inbox. The error body names the unknown ids.
        "409":
          description: |-
            Lease conflict — every requested message ID exists in the source inbox, but at least one is leased under a different (or no) lease and `force` was not set. Nothing moved. The body reports the current lease held on the message.
        "501":
          description: The configured registry store does not implement transfers.

  /agents/{id}/inbox/dead-letters:
    get:
      operationId: inboxDeadLetters
      tags: [inbox]
      summary: List messages that expired unacknowledged in this inbox
      description: |
        The dead-letter destination (CR-FEAT-025): the messages that expired
        while they were still unacknowledged in this agent's inbox, newest
        first, each with the payload that was delivered and the correlation ids
        of the delivery. A message expires because nobody came back for it — the
        queue this answers for is the one whose consumer stopped consuming.

        Every message listed here also produced exactly ONE `MESSAGE_EXPIRED`
        receipt in its SENDER's inbox, and its `message_id` is the primary key
        of the destination: a message is dead-lettered once, so it is reported
        once.

        The agent ROW need not still exist: a dead letter outlives the
        registration it was addressed to (that is precisely when it matters
        most), so this route answers from the dead-letter destination alone
        rather than 404-ing on a missing registry row.

        Retention: the destination is bounded by TIME. A persisting backend
        sweeps records older than its documented retention window (7 days) on
        the same pass that produces them, and the in-memory backend keeps the
        most recent records up to its capacity. A record that ages out is gone —
        read it while it is there.

        When CR_REQUIRE_AGENT_SIG=true (the default), this endpoint requires the
        per-agent ed25519 signature headers X-Agent-ID, X-Agent-Ts, X-Agent-Sig
        — the same signing contract as DELETE /agents/{id}: sign
        "GET\n/agents/{id}/inbox/dead-letters\n<unix-seconds>".
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: The agent id whose inbox the messages expired in.
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
          description: "Maximum records to return. Honored or rejected, never silently clamped: a value outside 1..100 (or a non-integer) answers 400."
        - $ref: "#/components/parameters/XAgentID"
        - $ref: "#/components/parameters/XAgentTs"
        - $ref: "#/components/parameters/XAgentSig"
      security:
        - bearerAuth: []
          agentSignature: []
      responses:
        "200":
          description: Dead letters for this inbox (an empty array is a normal answer — nothing has expired here)
          content:
            application/json:
              schema:
                type: object
                required: [agent_id, dead_letters, count]
                properties:
                  agent_id:
                    type: string
                    description: The inbox these records belong to.
                  dead_letters:
                    type: array
                    items:
                      $ref: "#/components/schemas/DeadLetter"
                    description: Always a JSON array (never null). Newest first.
                  count:
                    type: integer
                    description: "The number of records in THIS response (the page), never a total."
        "400":
          description: limit is not an integer, or is outside 1..100.
        "401":
          description: Missing or invalid agent signature (when CR_REQUIRE_AGENT_SIG=true)
        "403":
          description: X-Agent-ID does not match the target agent
        "501":
          description: The configured registry store does not keep a dead-letter destination.

  # ── Capability-routed delivery (CR-FEAT-026) ──
  # The registry's advertised capabilities become a dialable worker pool: the
  # path names a CAPABILITY where /agents/{id}/inbox names an agent, and the
  # holder is chosen from the pool. Everything after that choice is the by-id
  # operation above — same guard, same webhook driver, same durable inbox, same
  # lease/ack/TTL.
  /capabilities/{capability}/inbox:
    post:
      operationId: capabilityDeliver
      tags: [inbox]
      summary: Deliver a message to a capability (round-robin over its live holders)
      description: |
        Deliver to a CAPABILITY instead of an agent id — the registry's
        capability index turned into a worker pool a sender can dial. Before
        this, GET /agents?capability=abc could tell you who advertises a
        capability and delivery still required naming one agent id, so the index
        was a phone book nobody could dial (the gap measured live by the
        external review `DISPATCH · CRI-001`, CR-FEAT-026).

        **Selection rule.** Candidates are every registered agent whose
        advertised `capabilities` include the name, matched EXACTLY — the same
        comparison `GET /agents?capability=` uses. LIVE holders rank first:
        liveness is the registry's own derived status (`online` while the row's
        liveness evidence is inside `CR_PRESENCE_STALE_AFTER_S`, CR-FEAT-024),
        and while at least one holder is live the pool is exactly the live
        holders, so a crashed worker absorbs no work. The choice rotates
        ROUND-ROBIN over the pool, one holder per delivery, in agent-id
        ascending order, with ONE cursor per capability advanced once per
        dispatched delivery.

        **When no holder is live** the pool falls back to ALL holders rather
        than refusing: the inbox is durable, so the message waits for a worker
        that comes back. A message nobody ever takes is carried by the existing
        ownership path — the sender gets exactly one `MESSAGE_EXPIRED` receipt
        in its own inbox (CR-FEAT-025) — and a holder that dies MID-LEASE needs
        no case of its own: the lease expires and the message returns to the
        queue it was delivered to (`GET /agents/{id}/inbox`, §4 lease/ack).

        **Zero holders is a NAMED error, never a silent drop**: 404
        `{"error":"NO_CAPABLE_AGENT","capability":"<name>","detail":"…"}`, which
        also states the limit that selection is LOCAL to this relay — a
        capability held only on a linked relay is not selected, because
        federation forwards a delivery by AGENT ID (CR-FEAT-006).

        **The accept names what it chose** (`"capability":"solver"`,
        `"target":"worker-b"`), because a routed sender has to know which worker
        took the work. A by-id delivery's body carries neither field.

        **Retries do not fan out.** A capability-routed delivery carrying an
        `idempotency_key` is scoped to the CAPABILITY rather than to the holder
        (the holder is not known when the key is resolved): a repeated key is
        answered with the FIRST attempt's accept — same id, same `target` —
        instead of dispatching the same work to a second worker in the pool, and
        it is answered even if the pool has since emptied. A concurrently
        in-flight duplicate is `409`, as on the by-id path.

        The request body is the one `POST /agents/{id}/inbox` accepts — the same
        required `payload` object, the same optional correlation/session fields,
        the same `delivery_mode` / `timeout_ms` validation and the same 400s —
        restated here so this operation reads on its own. The response is the
        by-id accept plus those two routing fields. Delivery by agent id is
        unchanged in every respect.

        Stated limit: the cursor lives in the serving process and is not
        persisted, so a restart, a second process on the same store, or two
        relays behind a load balancer each rotate on their own. This is fairness
        across holders, not exactly-once dispatch.

        The shared raw HTTP request-body cap is `CR_INBOX_MAX_BODY_BYTES`
        (default 1048576 bytes). It applies before capability selection,
        JSON decoding, guard, idempotency, transport, federation or store work;
        Content-Length and chunked requests are both covered. An over-cap
        request answers 413 with `{"error":"REQUEST_BODY_TOO_LARGE"}` and
        leaves every holder's queue unchanged.
      parameters:
        - name: capability
          in: path
          required: true
          schema:
            type: string
          description: "The advertised capability to deliver to, matched exactly against each agent's `capabilities` (the same comparison `GET /agents?capability=` applies)."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [payload]
              properties:
                payload:
                  type: object
                  description: "Message payload — the same REQUIRED JSON object `POST /agents/{id}/inbox` takes (a body that omits the key, or sends null / a non-object, is refused with 400 `payload is required` / `payload must be a JSON object` and nothing is dispatched or stored)."
                sender:
                  type: string
                  description: Originating agent id — also the inbox a `MESSAGE_EXPIRED` receipt is delivered to if the message expires unacknowledged.
                session_id:
                  type: string
                  description: Conversation context for session-aware delivery (CR-FEAT-004).
                thread_id:
                  type: string
                  description: Thread context for session-aware delivery (CR-FEAT-004).
                delivery_mode:
                  type: string
                  enum: [blocking, async, batch]
                  description: "Overrides the resolved holder's webhook default; validation is identical to the by-id path (400 for any other value, before anything is dispatched or stored)."
                timeout_ms:
                  type: integer
                  minimum: 0
                  maximum: 120000
                  default: 30000
                  description: Bounds a BLOCKING delivery to the resolved holder's webhook (0..120000, same bound and same 400 as the by-id path).
                request_id:
                  type: string
                  description: Sender's correlation id, echoed in the reply.
                kind:
                  type: string
                  description: Message kind (defaults to `message`; `configure` carries a self-configuration directive, CR-FEAT-007).
                ttl_seconds:
                  type: integer
                  minimum: 0
                  description: "Requested lifetime of the stored message (absent = store default, 0 = never expires), resolved into the accept's `expires_at` exactly as on the by-id path."
                idempotency_key:
                  type: string
                  description: "Sender-supplied deduplication key (CR-FEAT-025). On this operation the key is scoped to the CAPABILITY: a second delivery of the same key is answered with the first attempt's accept — same id, same `target` — and stores nothing."
      responses:
        "201":
          description: "Stored in the resolved holder's durable inbox. The accept is the by-id accept plus `capability` and `target`."
          content:
            application/json:
              schema:
                type: object
                required: [id, transport]
                properties:
                  id:
                    type: string
                    description: Assigned message id.
                  transport:
                    type: string
                    enum: [inbox]
                    description: The holder has no webhook endpoint, so the message went to its durable inbox.
                  expires_at:
                    type: string
                    nullable: true
                    description: "The resolved message expiry (RFC 3339), or null when the message never expires."
                  capability:
                    type: string
                    description: The capability this delivery was dialed to.
                  target:
                    type: string
                    description: "The holder the registry chose — the inbox the message is retrievable from."
                  guard:
                    type: object
                    description: "Present when the guard verdict was not a clean allow (spec §9.3), exactly as on the by-id path (the RESOLVED holder's guard policy applies)."
                  idempotent_replay:
                    type: boolean
                    description: "Present and true when this accept was answered from the recorded accept of an earlier delivery under the same idempotency_key — the `target` then names the holder the FIRST attempt chose."
                  location:
                    $ref: "#/components/schemas/MessageLocation"
                    description: The machine-readable WHERE of the delivered message (CR-CHAT-029) — mirrors the location stored with the inbox entry.
        "200":
          description: "Blocking webhook delivery (the resolved holder has a webhook endpoint and `delivery_mode: blocking`): the endpoint's reply, with the same `capability` / `target` fields."
        "202":
          description: "Accepted for webhook push to the resolved holder (`delivery_mode: async|batch`) — queued, NOT stored in the inbox (spec §4), with the same `capability` / `target` fields."
        "400":
          description: "Same refusals as the by-id operation: malformed JSON, a missing/invalid `payload`, an unknown `delivery_mode`, an out-of-range `timeout_ms`/`ttl_seconds`, or an over-long `idempotency_key`. Nothing is dispatched and nothing is stored. A refusal cannot depend on the target, so it is answered before the pool is consulted."
        "413":
          description: "The raw request body exceeds CR_INBOX_MAX_BODY_BYTES (default 1048576). Nothing was decoded, capability-selected, dispatched, forwarded, guarded or stored. The stable error is REQUEST_BODY_TOO_LARGE."
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error:
                    type: string
                    enum: [REQUEST_BODY_TOO_LARGE]
        "403":
          description: "`GUARD_BLOCKED` — the resolved holder's guard policy blocked the message (never queued, never stored, never POSTed); `AGENT_QUARANTINED` — the sender, or the RESOLVED holder, is contained by the detection layer's kill-switch (CR-FEAT-030)."
        "404":
          description: |-
            `NO_CAPABLE_AGENT` — no agent registered ON THIS RELAY advertises the capability, so there is no holder to choose. The body is `{"error":"NO_CAPABLE_AGENT","capability":"<name>","detail":"…"}` and nothing is dispatched or stored. This is deliberately NOT the plain `agent not found` of the by-id path: the two say different things.

            (A delivery to a holder that is unregistered between selection and the store write answers the by-id `agent not found` instead, the same race a by-id delivery has.)
        "409":
          description: "`idempotency_key` already has a delivery in flight — nothing was stored by this request, exactly as on the by-id path."
        "502":
          description: "Blocking webhook delivery to the resolved holder was permanently rejected (non-retryable status, or a reply the holder's schema cannot map), or a federation failure for a holder id that vanished after selection — the same `502` contract as the by-id operation."
  /namespaces:
    get:
      operationId: listNamespaces
      tags: [registry]
      summary: List the namespace (realm) policies this server enforces
      description: |-
        The realm dimension (CR-FEAT-029, specs/NAMESPACES.md): every
        namespace this server serves, with the policy it is actually
        enforcing for it and a live per-namespace agent census.

        Always answers, on every deployment: a server with no namespaces
        declared reports exactly one entry — the implicit `default`
        namespace, unconfigured and shared-posture — which is what makes
        "nothing changes for an existing deployment" visible rather than
        implied.

        Secrets are never disclosed. `token_ref` is the `env:VAR`
        REFERENCE a `token`-posture namespace resolves its credential
        from; the value it resolves to is never serialized, logged or
        echoed, and no response carries it. A namespace's `guard_policy`
        is likewise not echoed (only whether one is declared) — the
        listing states WHAT is enforced, not the policy documents.

        NOT auth-exempt: like `GET /status` it reports posture, so on a
        server with CR_AUTH_TOKEN set a token-less caller gets 401. With
        auth unset (the development posture) it is open, like every other
        route.
      responses:
        "200":
          description: |-
            Every namespace this server serves, the `default` one first.
            `count` counts the entries in THIS response, so an unconfigured
            deployment answers `count: 1` with the single implicit realm.
          content:
            application/json:
              schema:
                type: object
                required: [default, count, namespaces]
                properties:
                  default:
                    type: string
                    description: "The name of the implicit namespace every agent belongs to when it declares none. Always `default` — served so a client never has to hard-code the spelling of the realm whose wire form is the empty string."
                  count:
                    type: integer
                    description: Number of namespaces in this response (always ≥ 1).
                  namespaces:
                    type: array
                    description: The namespace policies, the default namespace first.
                    items:
                      $ref: "#/components/schemas/NamespacePolicy"
        "401":
          description: Missing or invalid bearer token (when CR_AUTH_TOKEN is set — this route is NOT auth-exempt)

  # ── Permission management (CR-CHAT-007 phase 1) ──
  # The WRITE half of the delivery ACL (specs/CHAT-PERMISSIONS.md §2.1/§2.3/
  # §6.1): mint a principal, create a binding, create a grant, revoke a grant.
  # Every write requires the admin token CR_PERMISSIONS_ADMIN_TOKEN as Bearer —
  # a SECOND constant-time secret, deliberately distinct from CR_AUTH_TOKEN, so
  # a leaked message token cannot mint permissions. A deployment with no ACL
  # (CR_PERMISSIONS_ENABLED unset) has no store and refuses every write 403
  # MANAGEMENT_FORBIDDEN; so does an armed deployment whose admin token is not
  # presented. granted_by is recorded as "admin" — phase 1 has no login (§2.4),
  # so the operator's token is the granter of record.
  /principals:
    post:
      operationId: mintPrincipal
      tags: [registry]
      summary: Mint a principal (a HUMAN user, §2.1)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                display_name:
                  type: string
                namespace:
                  type: string
                  description: The realm the principal belongs to; absent = the default realm.
                role:
                  type: string
                  enum: [owner, admin, member, viewer]
                  description: The namespace role bundle (§5.2); absent = no role.
                status:
                  type: string
                  enum: [invited, active, suspended, revoked]
                  description: "Defaults to `active` — phase 1 has no login (§2.4) to move invited→active."
      responses:
        "201":
          description: Minted. The response body is the principal record with its minted `prin_`-prefixed id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrincipalRecord"
        "400":
          description: Invalid JSON body
        "403":
          description: The management surface is not armed, or the admin token was not presented (MANAGEMENT_FORBIDDEN)
  /bindings:
    post:
      operationId: createBinding
      tags: [registry]
      summary: Record a binding — a principal's speech right onto an agent (§2.3)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [principal, agent]
              properties:
                principal:
                  type: string
                  description: The principal id (a `prin_` id, never an agent id).
                agent:
                  type: string
                as_agent:
                  type: boolean
                  description: "Defaults to true — the only value this version defines (§2.3)."
      responses:
        "201":
          description: Recorded. The response body is the binding record with its minted `bind_`-prefixed id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BindingRecord"
        "400":
          description: Invalid JSON, or principal/agent missing
        "403":
          description: The management surface is not armed, or the admin token was not presented (MANAGEMENT_FORBIDDEN)
  /grants:
    post:
      operationId: createGrant
      tags: [registry]
      summary: Create a grant — an ACL entry binding a principal to a subject (§6.1)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [principal, subject, actions]
              properties:
                principal:
                  type: string
                  description: The principal id, NEVER an agent id (§6.1).
                subject:
                  type: object
                  required: [type, ref]
                  properties:
                    type:
                      type: string
                      enum: [agent, group, capability, session, namespace]
                    ref:
                      type: string
                actions:
                  type: array
                  minItems: 1
                  items:
                    type: string
                    enum: [send, read, invite, admin, mint, invoke]
                expires_at:
                  type: string
                  format: date-time
                  description: "Absent/null = no expiry; a timestamp = the grant is inert after it (§6.1)."
                note:
                  type: string
      responses:
        "201":
          description: Created. The response body is the grant record with its minted `grant_`-prefixed id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GrantRecord"
        "400":
          description: Invalid JSON, or an unknown action / subject type — the error names the accepted set (§6.1)
        "403":
          description: The management surface is not armed, or the admin token was not presented (MANAGEMENT_FORBIDDEN)
  /grants/{grantid}/revoke:
    post:
      operationId: revokeGrant
      tags: [registry]
      summary: Tombstone a grant (§6.6) — the record stays, the grant is inert
      security:
        - bearerAuth: []
      parameters:
        - name: grantid
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Tombstoned. Takes effect on the NEXT delivery (§6.6 per-request evaluation).
          content:
            application/json:
              schema:
                type: object
                properties:
                  revoked:
                    type: string
                    description: The revoked grant id.
        "403":
          description: The management surface is not armed, or the admin token was not presented (MANAGEMENT_FORBIDDEN)
        "404":
          description: No grant with that id

  # ── Sessions (CR-CHAT-019) ──
  # The core session object surfaces of specs/CHAT-INTERFACE.md §4 (rows 8-15,
  # 24, 31, 37). A session is an AGGREGATE over the durable inbox deliveries
  # that already exist (specs/CHAT-SESSIONS.md §3.3): a message sent into one is
  # delivered by one POST per participant through the shipped inbox path, and
  # the transcript record is that room's ordered log. Every surface is
  # realm-scoped: the session carries the namespace it was created in, reads
  # resolve X-Crier-Namespace, and a fan-out refuses a target in another realm.
  /sessions:
    get:
      operationId: listSessions
      tags: [sessions]
      summary: List chat sessions (a view over the session objects)
      description: |-
        The session list (specs/CHAT-INTERFACE.md §4 rows 8, 9): every session
        in the request's realm, each with its lifecycle state, its audience and
        participant counts, its message and thread counts and the last message's
        preview. It is a VIEW over the same session objects every other session
        route serves from — not a second object.

        Filters narrow the view without changing it: `state` (open | closed,
        row 12), `kind` (channel | direct, the channel/DM narrowing of row 39),
        `min_messages` and `min_participants` (the count filters of row 9).

        Realm: `X-Crier-Namespace` selects the realm (absent = the default), so
        the list can never show a session from another realm. A namespace this
        server does not declare is 400 UNKNOWN_NAMESPACE — never a silent
        fallback to the default.
      parameters:
        - name: state
          in: query
          required: false
          schema:
            type: string
            enum: [open, closed]
        - name: kind
          in: query
          required: false
          schema:
            type: string
            enum: [channel, direct]
        - name: min_messages
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
        - name: min_participants
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
        - $ref: "#/components/parameters/XCrierNamespace"
      responses:
        "200":
          description: The sessions this realm holds, sorted by id.
          content:
            application/json:
              schema:
                type: object
                required: [sessions, count]
                properties:
                  sessions:
                    type: array
                    items:
                      $ref: "#/components/schemas/Session"
                  count:
                    type: integer
        "400":
          description: A malformed filter, or a namespace this server does not declare (UNKNOWN_NAMESPACE)
        "401":
          description: Missing or invalid credentials (the bearer token, or a token-posture realm's X-Crier-Namespace-Token)
    post:
      operationId: createSession
      tags: [sessions]
      summary: Create a chat session (room)
      description: |-
        Opens a session (specs/CHAT-INTERFACE.md §4 rows 10, 11). The creator is
        recorded on the session (`created_by`, or `principal_id`/`as_agent`):
        §1.4 of specs/CHAT-SESSIONS.md refuses a request that cannot name one, so
        it is NEVER defaulted to a service identity.

        Creating does not imply inviting (§1.4): the creator is not added
        automatically. `members` may name initial participants, each recorded as
        a membership event with its own role.

        `namespace` (or `X-Crier-Namespace`) is the realm the room lives in and
        is recorded with it; a name this server does not declare is refused. A
        session may declare a `retention_seconds` SHORTER than its realm's,
        never longer (§3.5).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSessionRequest"
      responses:
        "201":
          description: The created session object.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "400":
          description: "A malformed request: an absent creator (CREATED_BY_REQUIRED), an unknown kind or visibility, or a retention longer than the realm's"
        "401":
          description: Missing or invalid credentials
        "409":
          description: A session with that id already exists (SESSION_EXISTS)

  # ── Named groups (CR-CHAT-013, CR-CHAT-022, D8) ──
  # A NAMED, CURATED set of agents addressed as `@team:x` — an address target
  # with a roster, and nothing else: no participants, no transcript, no state.
  # A send targeting a group (POST /sessions/{id}/messages with a
  # `{"kind":"group"}` target, or a body mention `@team:<name>`) fans out ONE
  # delivery per CURRENT member through the shipped inbox path; a roster edit
  # routes the NEXT send to the current members. Inspectable: who is in it,
  # who created it, who last edited it.
  #
  # Storage (CR-CHAT-022): the roster persists in the SELECTED session backend
  # — the `chat_groups`/`chat_group_members` tables in the session SQLite or
  # PostgreSQL database (reached by the schema with no migration step), or the
  # JSONL roster log otherwise. This is a GROUP, not a capability: `@cap:y`
  # stays the dynamic round-robin pool over live holders
  # (POST /capabilities/{capability}/inbox) — different endpoint, different
  # object, different delivery semantics (fan-out vs one-holder selector), and
  # neither may silently become the other (D8, specs/CHAT-ADDRESSING.md §1.4).
  /groups:
    post:
      operationId: createGroup
      tags: [groups]
      summary: Create a named agent group (a curated roster addressable as @team:x)
      description: |-
        Opens a named group (specs/CHAT-ADDRESSING.md §1.4). The name must be
        addressable as `@team:<name>` (the ident charset); the creator is
        recorded (`created_by`, or the X-Agent-ID header) and never defaulted
        to a service identity. A duplicate name is 409 GROUP_EXISTS.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateGroupRequest"
      responses:
        "201":
          description: The created group.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Group"
        "400":
          description: "A malformed request: an unaddressable name (INVALID_GROUP), an empty or non-ident member id, or an absent creator (CREATED_BY_REQUIRED)"
        "401":
          description: Missing or invalid credentials
        "409":
          description: A group with that name already exists (GROUP_EXISTS)
    get:
      operationId: listGroups
      tags: [groups]
      summary: List the named groups of the request's realm
      parameters:
        - $ref: "#/components/parameters/XCrierNamespace"
      responses:
        "200":
          description: Every group in the realm, sorted by name.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Groups"
        "401":
          description: Missing or invalid credentials
  /groups/{name}:
    get:
      operationId: getGroup
      tags: [groups]
      summary: Read one named group's CURRENT roster
      description: |-
        The roster is INSPECTABLE: the members, who created the group and who
        last edited it (§1.4). A group of another realm reads as 404 — the
        realm wall never confirms that a group it will not serve exists.
      parameters:
        - $ref: "#/components/parameters/GroupName"
        - $ref: "#/components/parameters/XCrierNamespace"
      responses:
        "200":
          description: The group's current roster.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Group"
        "404":
          description: No such group in this realm (GROUP_NOT_FOUND)
  /groups/{name}/members:
    patch:
      operationId: updateGroupMembers
      tags: [groups]
      summary: Add and/or remove members (one edit event over the current roster)
      description: |-
        Applies `remove` first, then `add`, to the CURRENT roster and records
        who made the edit (`actor`, or the X-Agent-ID header). The NEXT send
        targeting `@team:<name>` resolves the edited set — membership changes
        take effect for subsequent sends, never retroactively; a member's
        existing deliveries are untouched (§2.4 rule 3).
      parameters:
        - $ref: "#/components/parameters/GroupName"
        - $ref: "#/components/parameters/XCrierNamespace"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateGroupMembersRequest"
      responses:
        "200":
          description: The roster after the edit.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Group"
        "400":
          description: "A malformed request: the edit names nothing, or a member id is not an ident (INVALID_MEMBER)"
        "404":
          description: No such group in this realm (GROUP_NOT_FOUND)

  /sessions/{id}/messages:
    get:
      operationId: readSessionTranscript
      tags: [sessions]
      summary: Read the ordered cross-agent transcript of a session
      description: |-
        THE ordered cross-agent transcript (specs/CHAT-INTERFACE.md §4 row 14):
        every participant's messages, in `seq` order (the ordering authority —
        never `created_at` alone, §3.1), each with a resolvable `parent_id`, the
        thread it belongs to (`thread_id`, `root_id`), its kind and its thread
        depth and reply depth (rows 42, 43).

        The reconstruction is from storage ALONE (specs/CHAT-SESSIONS.md §4.3) —
        no client state, no membership lookup. `findings` reports what it had to
        DECIDE about a thread key, so a derived or broken thread is visible
        rather than hidden.

        A session whose `visibility` is `private` requires the caller to be a
        member (X-Agent-ID) or to hold a read permission on it (CR-CHAT-003);
        otherwise 403 VISIBILITY_FORBIDDEN.
      parameters:
        - $ref: "#/components/parameters/SessionID"
        - $ref: "#/components/parameters/XCrierNamespace"
      responses:
        "200":
          description: The session object and its ordered transcript.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionTranscript"
        "403":
          description: The session is private and the caller is neither a member nor granted a read (VISIBILITY_FORBIDDEN)
        "404":
          description: No such session in this realm (SESSION_NOT_FOUND)
    post:
      operationId: postSessionMessage
      tags: [sessions]
      summary: Send a message into a session (fan-out to its participants)
      description: |-
        Composes INTO a session (specs/CHAT-INTERFACE.md §4 row 31): one message
        delivered to each participant through the SHIPPED inbox path — the same
        guard choke point, durable inbox write, lease/ack/TTL and federation
        fallback every delivery uses. There is no second delivery path
        (specs/CHAT-SESSIONS.md §3.4).

        Ordering follows §3.2 exactly: the transcript record is written first as
        the intent (message id + resolved audience), the fan-out follows, and
        each target's outcome is written back onto the same record. The
        `audience` is the caller's explicit `targets`, or every active
        participant except the author; a `principal` target is recorded but has
        no inbox to deliver to (reached through a bound agent, CR-CHAT-007).

        Threading (§4.5, D11): name `parent_id` to reply — the reply STAYS in its
        parent's thread. Omit it and the message opens a new thread whose id is
        the message's own id. A reply never carries a new thread_id.

        Mention addressing (CR-CHAT-022, D8): a body tag `@team:<name>` resolves
        to the NAMED group of that name and adds it to the audience as a
        `group` target — ONE message fans out to EVERY CURRENT member through
        the shipped inbox path, and a roster edit routes the NEXT send to the
        current members. The capability form `@cap:y` is NOT a group: it is a
        SELECTOR (one live holder, round-robin — `POST
        /capabilities/{capability}/inbox`) and is never expanded into a fan-out
        here. A named group and a capability target are different address
        kinds and neither may silently become the other (D8,
        specs/CHAT-ADDRESSING.md §1.4). A mention of a group with no roster is
        a recorded skip, never a guessed delivery.
      parameters:
        - $ref: "#/components/parameters/SessionID"
        - $ref: "#/components/parameters/XCrierNamespace"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PostSessionMessageRequest"
      responses:
        "201":
          description: The recorded transcript message, with its per-target outcomes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TranscriptMessage"
        "400":
          description: A malformed request (an absent author or payload, an unknown message kind, a parent that does not exist, or a thread mismatch)
        "403":
          description: The session's realm refuses the credential (NAMESPACE_UNAUTHORIZED)
        "404":
          description: No such session in this realm (SESSION_NOT_FOUND)
        "409":
          description: The session is closed and admits no new message (SESSION_CLOSED)
        "502":
          description: The transcript record is durable but the fan-out did not complete (FANOUT_INCOMPLETE)

  /sessions/{id}/tasks:
    post:
      operationId: createSessionTask
      tags: [sessions]
      summary: Create a TASK addressed to explicit targets (the agent-driven call-out)
      description: |-
        The explicit "do this" kind (specs/CHAT-ADDRESSING.md §2.5, D12;
        specs/CHAT-PERMISSIONS.md §6.11). A tag is ADDRESSING, never an
        action: only this route creates work. The task rides a `task`-kind
        message record carrying `task:{task_id, state, owner}` (§3.7), fans
        out to its targets through the SHIPPED inbox path (no second
        delivery path), and opens (or joins, via `parent_id`) the thread the
        human reads the agents' outputs in.

        AUTHORITY — different from sending a message: the sender needs
        `invoke` on EACH target plus `send` on the session (§6.11). An
        unauthorized creation is refused `403 TASK_FORBIDDEN`
        `reason=NO_TASK_AUTHORITY` and is NEVER delivered as an ordinary
        message. With the ACL unarmed the shipped trust-by-reach posture
        applies to every kind alike.

        There is no "everyone" default for work: a task names an explicit
        target set. The task's lifecycle is moved by
        `POST /sessions/{id}/tasks/{task_id}/claim` and `/complete`; every
        transition is a NEW record-version in the SAME thread.
      parameters:
        - $ref: "#/components/parameters/SessionID"
        - $ref: "#/components/parameters/XCrierNamespace"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PostSessionTaskRequest"
      responses:
        "201":
          description: |-
            The recorded task message (kind `task`, with its task payload and
            per-target outcomes), PLUS the task's OWN id and current state
            (`task_id`, `state`) at the TOP level (DF-CRIER-304): the message
            view's `id` is the message id, so the task id the claim/complete/GET
            routes take and the state a caller checks are named here rather than
            only under `task`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionTaskCreated"
        "400":
          description: A malformed request (an absent author or payload, an empty target set, or a thread mismatch)
        "403":
          description: The sender lacks the task authority (TASK_FORBIDDEN, reason NO_TASK_AUTHORITY) or the realm refuses the credential (NAMESPACE_UNAUTHORIZED)
        "404":
          description: No such session in this realm (SESSION_NOT_FOUND)
        "409":
          description: The session is closed and admits no new message (SESSION_CLOSED)
        "502":
          description: The transcript record is durable but the fan-out did not complete (FANOUT_INCOMPLETE)

    get:
      operationId: listSessionTasks
      tags: [sessions]
      summary: List a session's tasks at their CURRENT state
      description: |-
        The READ half of the task lifecycle (specs/CHAT-ADDRESSING.md §2.5,
        DF-CRIER-304). Every task in the session, one entry per task id, each
        at the state of its LATEST record-version (§3.7 keep-LAST: every claim
        or complete appends a NEW `task`-kind message carrying the same task
        id, so the newest record for that id is the current state). A caller
        that created or moved a task can verify where it stands instead of
        firing and forgetting.

        Each entry names the task id the claim/complete routes take, the
        current `state`, the `owner` (once claimed), the message
        record-version carrying that state and the thread it lives in. `tasks`
        is always an array — empty, never null, when the session has no tasks.
      parameters:
        - $ref: "#/components/parameters/SessionID"
        - $ref: "#/components/parameters/XCrierNamespace"
      responses:
        "200":
          description: The session's tasks at their current state (newest record-version per task id).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionTaskList"
        "403":
          description: The session is private and the caller may not read it (VISIBILITY_FORBIDDEN) or the realm refuses the credential (NAMESPACE_UNAUTHORIZED)
        "404":
          description: No such session in this realm (SESSION_NOT_FOUND)

  /sessions/{id}/tasks/{task_id}:
    get:
      operationId: getSessionTask
      tags: [sessions]
      summary: Read ONE task's current state
      description: |-
        The read the lifecycle owes a caller (specs/CHAT-ADDRESSING.md §2.5,
        DF-CRIER-304): the CURRENT state of one task, the owner once it is
        claimed, and the message record-version and thread the state lives in.
        The task id is the `task_id` the create response names — NOT the
        message `id`, which names the record that CARRIES the state; an id that
        is not a task in this session is refused `404 TASK_NOT_FOUND`, the same
        named refusal the claim and complete routes give.
      parameters:
        - $ref: "#/components/parameters/SessionID"
        - $ref: "#/components/parameters/XCrierNamespace"
        - name: task_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The task's current state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionTask"
        "403":
          description: The session is private and the caller may not read it (VISIBILITY_FORBIDDEN) or the realm refuses the credential (NAMESPACE_UNAUTHORIZED)
        "404":
          description: No such session in this realm (SESSION_NOT_FOUND), or no such task in the session (TASK_NOT_FOUND)

  /sessions/{id}/tasks/{task_id}/claim:
    post:
      operationId: claimSessionTask
      tags: [sessions]
      summary: Claim a task (open -> claimed, naming its owner)
      description: |-
        The §2.5 lifecycle, step one: an addressee claims the open task, and
        the transition is a NEW `task`-kind record-version in the SAME thread
        (a reply anchored to the task's message), so the human sees who took
        the work. A task that is not `open` is refused `409
        INVALID_TASK_TRANSITION`. The actor needs `send` on the session
        (§6.11); a refusal is `403 TASK_FORBIDDEN reason NO_TASK_AUTHORITY`.
      parameters:
        - $ref: "#/components/parameters/SessionID"
        - $ref: "#/components/parameters/XCrierNamespace"
        - name: task_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskTransitionRequest"
      responses:
        "201":
          description: The transition record (state `claimed`, owner = the actor).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskTransitionResponse"
        "400":
          description: The body names no actor (AUTHOR_REQUIRED)
        "403":
          description: The actor lacks the send authority (TASK_FORBIDDEN, reason NO_TASK_AUTHORITY)
        "404":
          description: No such task in this session (TASK_NOT_FOUND)
        "409":
          description: The task is not open (INVALID_TASK_TRANSITION)

  /sessions/{id}/tasks/{task_id}/complete:
    post:
      operationId: completeSessionTask
      tags: [sessions]
      summary: Complete a task (claimed/running -> done, or failed via new_state)
      description: |-
        The §2.5 lifecycle, step two: the owner (or any actor with `send` on
        the session) completes the task. The transition is a NEW
        `task`-kind record-version in the SAME thread — the completion output
        (`payload`) is what the human reads there. A task that is not
        `claimed` or `running` is refused `409 INVALID_TASK_TRANSITION`; a
        failure closes with `new_state: "failed"`.
      parameters:
        - $ref: "#/components/parameters/SessionID"
        - $ref: "#/components/parameters/XCrierNamespace"
        - name: task_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskTransitionRequest"
      responses:
        "201":
          description: The transition record (state `done`, or `failed` when new_state names it).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskTransitionResponse"
        "400":
          description: The body names no actor (AUTHOR_REQUIRED) or an unknown new_state
        "403":
          description: The actor lacks the send authority (TASK_FORBIDDEN, reason NO_TASK_AUTHORITY)
        "404":
          description: No such task in this session (TASK_NOT_FOUND)
        "409":
          description: The task is neither claimed nor running (INVALID_TASK_TRANSITION)

  /sessions/{id}/participants:
    get:
      operationId: listSessionParticipants
      tags: [sessions]
      summary: List a session's participants
      description: |-
        The membership of a session (specs/CHAT-INTERFACE.md §4 row 24): each
        participant with its type (agent | principal), its role and its
        `active` flag. A removed member is returned with `active: false` rather
        than erased — membership is a recorded event, not a mutable set
        (specs/CHAT-SESSIONS.md §2.3, §2.4). `count` counts the ACTIVE members.
      parameters:
        - $ref: "#/components/parameters/SessionID"
        - $ref: "#/components/parameters/XCrierNamespace"
      responses:
        "200":
          description: The membership rows.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionParticipants"
        "403":
          description: The session is private and the caller is neither a member nor granted a read (VISIBILITY_FORBIDDEN)
        "404":
          description: No such session in this realm (SESSION_NOT_FOUND)
    post:
      operationId: addSessionParticipant
      tags: [sessions]
      summary: Add a participant to a session
      description: |-
        Records a membership event (specs/CHAT-INTERFACE.md §4 rows 24, 37):
        `member_type` (agent | principal), `member_id` and a role (default
        `member`). An agent that is already registered in ANOTHER realm is
        refused (NAMESPACE_MISMATCH) — two realms must not share one room.

        A closed session admits no membership change (§1.3).

        The late-join context answer (§4.6, D10): `context_share` names how
        much of the in-flight conversation the joiner is given — `none`
        (fresh) | `summary` (a generated digest) | `since` (the messages
        after `boundary_message_id`) | `full` (the whole history). Absent,
        it defaults to `summary` — and the default answer is RECORDED as
        part of the membership event, never left undecided.

        FEDERATED ROOMS (CR-CHAT-023, specs/CHAT-FEDERATION.md §3): a member of
        a peer instance joins as a REMOTE participant by naming a
        remote-qualified id `remote:<peer>:<subject>`. The join is admitted
        only when the peer has a policy record (CR_FED_PEERS_FILE) AND that
        policy admits the session's namespace (default deny). Refusals are
        NAMED: FED_PEER_UNTRUSTED (unknown peer), FED_NAMESPACE_NOT_PERMITTED
        (policy wall). A joined remote participant is marked `remote: true` in
        the participant list and receives messages fanned out to the session
        through the shipped federation path.
      parameters:
        - $ref: "#/components/parameters/SessionID"
        - $ref: "#/components/parameters/XCrierNamespace"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddParticipantRequest"
      responses:
        "201":
          description: The recorded participant.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionParticipant"
        "400":
          description: A malformed request (an unknown member_type, or an absent member_id)
        "404":
          description: No such session in this realm (SESSION_NOT_FOUND)
        "409":
          description: The session is closed (SESSION_CLOSED), or the agent is in another realm (NAMESPACE_MISMATCH)

  # ── Late-join context share (CR-CHAT-016, §4.6 D10) ──
  # Adding a participant to an in-flight conversation asks how much context to
  # share; the answer (or the `summary` default) is recorded on the thread as
  # a system event. These two routes surface the joiner's MATERIALIZED view —
  # what it was given, and why it answers as it does — and the recorded LATER
  # change of that answer.
  /sessions/{id}/participants/{member_type}/{member_id}/context:
    get:
      operationId: getMemberContext
      tags: [sessions]
      summary: What a member was given when it joined — the materialized context view
      description: |-
        The joiner's context share (§4.6, D10): the recorded `share` (mode +
        boundary), who set it and when, the MATERIALIZED view of what the
        joiner was given (for `summary`, a `generated_summary` digest — an
        index that never replaces the raw messages, §4.7 rule 2; for `since`
        and `full`, the given message ids in seq order), and an
        `explanation` tying the joiner's reply state to what it holds.

        `decided: false` marks a member whose share was never decided —
        distinct from an explicit `none` (§4.6 rule 6).
      parameters:
        - $ref: "#/components/parameters/SessionID"
        - $ref: "#/components/parameters/XCrierNamespace"
      responses:
        "200":
          description: The member's materialized context view.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberContextView"
        "403":
          description: The session is private and the caller is neither a member nor granted a read (VISIBILITY_FORBIDDEN)
        "404":
          description: No such session or member in this realm (SESSION_NOT_FOUND / MEMBER_NOT_FOUND)
    put:
      operationId: setMemberContext
      tags: [sessions]
      summary: Change a member's context share — recorded as a new event
      description: |-
        A LATER change to the member's context share (§4.6 rule 3): the new
        answer is appended as a `session.member.context` record — a new
        event, never a rewrite of the join. A `since` change names an
        existing `boundary_message_id` (CONTEXT_BOUNDARY_NOT_FOUND
        otherwise). A closed session admits no change (SESSION_CLOSED).
      parameters:
        - $ref: "#/components/parameters/SessionID"
        - $ref: "#/components/parameters/XCrierNamespace"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetMemberContextRequest"
      responses:
        "200":
          description: The recorded share change (the latest-state row).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberContextState"
        "400":
          description: "A malformed request: an unknown mode, or a `since` mode without a boundary message id (INVALID_CONTEXT_SHARE), or a boundary that does not exist (CONTEXT_BOUNDARY_NOT_FOUND)"
        "404":
          description: No such session or member in this realm (SESSION_NOT_FOUND / MEMBER_NOT_FOUND)
        "409":
          description: The session is closed and admits no change (SESSION_CLOSED)

  # ── Compile / merge (CR-CHAT-028) ──
  # Select N messages — from one thread, from several, or across sessions of
  # the realm — MERGE them into ONE payload and hand it to an agent by tagging
  # it. Distinct from a quote/reply: a reply answers "in answer to X" with an id
  # pointer, a compile answers "here is everything relevant, gathered" with the
  # content INLINE plus a PROVENANCE citation per part (specs/CHAT-SESSIONS.md
  # §4.8). The merged message is a NEW message and rides the shipped delivery
  # path (no second delivery path, CHAT-INTERFACE.md §5.1).
  /sessions/{id}/compile:
    post:
      operationId: compileSessionMessages
      tags: [sessions]
      summary: Compile (merge) messages into ONE cited context bundle
      description: |-
        Gathers the named sources into ONE new message in this session and hands
        it to the tagged agents through the shipped inbox path — the same guard
        choke point, durable inbox write, lease/ack/TTL and federation fallback
        every delivery uses (specs/CHAT-SESSIONS.md §3.4, §4.8).

        `message_ids` is the shorthand form for sources of THIS session;
        `sources` names `{session_id, message_id}` for a source in another
        session of the same realm. A source named in both forms is gathered once.

        The merged message is a NEW message: it opens its own thread and the
        sources are never mutated, moved or re-parented — they stay resolvable to
        anyone who may read them. Every part carries `{source_session_id,
        source_message_id}` so a recipient can expand it back to its original
        (GET /sessions/{id}/messages/{mid}/expand).

        A source the compiler could NOT read — another realm, a session or
        message that does not exist, or a private session the compiler is neither
        a member of nor granted a read on — is OMITTED WITH A NAMED GAP: the part
        is still present with `cited: false` and its reason in `omitted`. A
        source is never silently included and never silently dropped; a merge
        whose every source is unreadable is refused (422
        COMPILE_NO_READABLE_SOURCE).

        `message_kind` is `plain` or `addressed` (the default is `addressed`
        when targets are named) and can never be `task`: a compile is addressing,
        never an instruction to execute (D12, §4.4).
      parameters:
        - $ref: "#/components/parameters/SessionID"
        - $ref: "#/components/parameters/XCrierNamespace"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompileSessionRequest"
      responses:
        "201":
          description: The ONE recorded compiled message, its parts and its completeness.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompileSessionResponse"
        "400":
          description: "A malformed request: an absent author (AUTHOR_REQUIRED), no source, a source with an empty message_id, an invalid message_kind (a `task` compile is refused, D12), or an invalid audience"
        "403":
          description: The session's realm refuses the credential (NAMESPACE_UNAUTHORIZED)
        "404":
          description: No such session in this realm (SESSION_NOT_FOUND)
        "409":
          description: The session is closed and admits no new message (SESSION_CLOSED)
        "422":
          description: No source could be read — the merge is refused, naming every gap (COMPILE_NO_READABLE_SOURCE)
        "502":
          description: The transcript record is durable but the fan-out did not complete (FANOUT_INCOMPLETE)
        "503":
          description: No inbox deliverer is wired, so a compiled message cannot be fanned out (SESSION_DELIVERY_UNCONFIGURED)

  /sessions/{id}/messages/{mid}/expand:
    get:
      operationId: expandCompiledMessage
      tags: [sessions]
      summary: Resolve a compiled message's citations back to their originals
      description: |-
        Resolves every part of a compiled message (CR-CHAT-028) back to the
        ORIGINAL it came from, reporting that message's content and location: the
        source session, the message id, the author, the timestamp, the `seq` and
        the thread (§4.8).

        The resolution runs as the CALLER, not as the compiler: a part whose
        source the caller may not read is reported with `resolved: false` and a
        NAMED gap rather than served. A source stays resolvable to anyone who may
        read it.
      parameters:
        - $ref: "#/components/parameters/SessionID"
        - name: mid
          in: path
          required: true
          description: The compiled message's id.
          schema:
            type: string
        - $ref: "#/components/parameters/XCrierNamespace"
      responses:
        "200":
          description: One resolved (or named-gap) row per part of the compiled message.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExpandCompiledMessageResponse"
        "400":
          description: The message is not a compiled bundle (NOT_COMPILED)
        "403":
          description: The session is private and the caller is neither a member nor granted a read (VISIBILITY_FORBIDDEN)
        "404":
          description: "No such session in this realm (SESSION_NOT_FOUND), or no such message (MESSAGE_NOT_FOUND)"

  # ── Thread navigability (CR-CHAT-017) ──
  # Depth collapse, the timeline rail, the per-thread generated summary and
  # search that returns a LOCATION (specs/CHAT-INTERFACE.md §3.8.2). The
  # collapse is a READ shape over the thread tree — records are never
  # truncated (D11 consequence 5).
  /sessions/{id}/threads/{thread_id}:
    get:
      operationId: readThreadWithDepth
      tags: [sessions]
      summary: Read a thread with depth collapse
      description: |-
        One thread of a session with its messages and its sub-threads, down to
        the requested depth. Children at or beyond the depth limit are returned
        COLLAPSED (`collapsed: true`) as a generated summary card, never
        dropped — the read folds a branch, it does not hide it.

        `depth` defaults to 3 (CHAT-INTERFACE §3.8.2): the deepest a reader is
        asked to follow before the interface offers to summarise instead. The
        collapse is a read shape over the thread tree — the records themselves
        are never truncated.
      parameters:
        - $ref: "#/components/parameters/SessionID"
        - $ref: "#/components/parameters/XCrierNamespace"
        - name: thread_id
          in: path
          required: true
          schema: { type: string }
        - name: depth
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 3
          description: The depth limit. Children at or beyond it collapse into summary cards.
      responses:
        "200":
          description: The thread with its on-screen tree and its collapsed branches.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ThreadReadResponse"
        "400":
          description: An invalid depth (a negative or non-integer value)
        "403":
          description: The session is private and the caller is neither a member nor granted a read (VISIBILITY_FORBIDDEN)
        "404":
          description: No such session (SESSION_NOT_FOUND) or thread (THREAD_NOT_FOUND) in this realm

  /sessions/{id}/threads/{thread_id}/messages:
    get:
      operationId: readThreadMessagesByLocation
      tags: [sessions]
      summary: Fetch the messages of a location (the location-addressed read)
      description: |-
        The LOCATION-ADDRESSED fetch (CR-CHAT-029 part b): an agent takes the
        machine-readable location its delivery carried (instance, namespace,
        channel, thread, sub_thread — the InboxEntry `location` field) and
        issues THIS fetch; the answer is EXACTLY the messages of that location
        it is permitted to read.

        The permission rule is the shipped one: the session realm wall and the
        `private` visibility rule hold first. A caller the rules refuse gets
        403 PERMISSION_FORBIDDEN — a NAMED refusal, NEVER an empty list (an
        empty list would read as "the thread is quiet" and hide the permission
        problem). An unknown thread is 404 THREAD_NOT_FOUND, a DIFFERENT
        answer, so a caller can tell a typo from a permission wall.

        `?sub_thread_id=` narrows the fetch to a sub-thread of the named
        thread: the two-level location a spawned delivery carries (its
        `thread` is the parent, its `sub_thread` the child).
      parameters:
        - $ref: "#/components/parameters/SessionID"
        - $ref: "#/components/parameters/XCrierNamespace"
        - name: thread_id
          in: path
          required: true
          schema: { type: string }
        - name: sub_thread_id
          in: query
          required: false
          schema: { type: string }
          description: Fetch this sub-thread's messages instead of the named thread's own. Must be a child of the named thread, else 404.
      responses:
        "200":
          description: Exactly the permitted messages of the location, with the location echoed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ThreadMessagesResponse"
        "403":
          description: The caller is not permitted to read this location (PERMISSION_FORBIDDEN) — a named refusal, never an empty list
        "404":
          description: No such session (SESSION_NOT_FOUND) in this realm, or no such thread / sub-thread-of-this-thread (THREAD_NOT_FOUND)
  /sessions/{id}/threads/{thread_id}/timeline:
    get:
      operationId: readThreadTimeline
      tags: [sessions]
      summary: Read a thread's branch timeline
      description: |-
        The branch structure of the thread AND where the reader currently is
        (CHAT-INTERFACE §3.8.2): every sub-thread as a rail node carrying its
        depth, parent and anchor, and the node holding the session's latest
        message marked `current: true`.
      parameters:
        - $ref: "#/components/parameters/SessionID"
        - $ref: "#/components/parameters/XCrierNamespace"
        - name: thread_id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: The branch rail with the current position.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ThreadTimelineResponse"
        "403":
          description: The session is private and the caller is neither a member nor granted a read (VISIBILITY_FORBIDDEN)
        "404":
          description: No such session (SESSION_NOT_FOUND) or thread (THREAD_NOT_FOUND) in this realm

  /sessions/{id}/threads/{thread_id}/summary:
    get:
      operationId: readThreadSummary
      tags: [sessions]
      summary: Read a thread's generated summary
      description: |-
        A GENERATED digest of the thread (CHAT-INTERFACE §3.8.2, D10's index
        rule): visibly marked `generated`, never a replacement for the record,
        with the raw messages one read underneath (`raw_messages` names the
        transcript read that returns them).
      parameters:
        - $ref: "#/components/parameters/SessionID"
        - $ref: "#/components/parameters/XCrierNamespace"
        - name: thread_id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: The generated summary card and the link to the raw messages.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ThreadSummaryResponse"
        "403":
          description: The session is private and the caller is neither a member nor granted a read (VISIBILITY_FORBIDDEN)
        "404":
          description: No such session (SESSION_NOT_FOUND) or thread (THREAD_NOT_FOUND) in this realm

  /sessions/{id}/output:
    get:
      operationId: readSessionOutput
      tags: [sessions]
      summary: Read a session's output in trace or summary mode (dual output)
      description: |-
        ONE session-level read with a mode toggle (CR-CHAT-031). `mode=trace`
        (the default) serves exactly the ordered, timestamped transcript
        payload `GET /sessions/{id}/messages` serves — the same read path,
        never a fork of it: the trace IS the record. `mode=summary` serves a
        GENERATED index of the session's threads: visibly marked `generated`,
        a `covers` field naming what it covers (session id, thread ids,
        message count) and a `trace` link to the record one read underneath
        (§4.7 rule 2). Switching views hides or deletes nothing. A session
        with no threads has no summary: 404 SUMMARY_UNAVAILABLE, never an
        empty or synthesised summary.
      parameters:
        - $ref: "#/components/parameters/SessionID"
        - $ref: "#/components/parameters/XCrierNamespace"
        - name: mode
          in: query
          required: false
          schema:
            type: string
            enum: [trace, summary]
            default: trace
      responses:
        "200":
          description: The ordered transcript (trace) or the generated summary index (summary).
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/SessionTranscript"
                  - $ref: "#/components/schemas/SessionSummaryResponse"
        "400":
          description: "A mode other than trace|summary (OUTPUT_MODE_INVALID)"
        "403":
          description: The session is private and the caller is neither a member nor granted a read (VISIBILITY_FORBIDDEN)
        "404":
          description: No such session (SESSION_NOT_FOUND) in this realm; or mode=summary with no threads to summarise (SUMMARY_UNAVAILABLE)

  /sessions/{id}/search:
    get:
      operationId: searchSessionMessages
      tags: [sessions]
      summary: Search a session's transcript (hits carry their location)
      description: |-
        Search that returns LOCATION, not a fragment (CHAT-INTERFACE §3.8.2):
        every hit carries `full_path` — `[namespace, channel, thread_id,
        parent_thread_id?, message_id]`, the parent thread id present only for
        a sub-thread hit — so a reader can walk to where the hit lives.
      parameters:
        - $ref: "#/components/parameters/SessionID"
        - $ref: "#/components/parameters/XCrierNamespace"
        - name: q
          in: query
          required: true
          schema: { type: string, minLength: 1 }
          description: Case-insensitive substring match over payload text, thread ids and message ids.
      responses:
        "200":
          description: The hits, each with its full location path.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionSearchResponse"
        "400":
          description: "An empty query (QUERY_REQUIRED)"
        "403":
          description: The session is private and the caller is neither a member nor granted a read (VISIBILITY_FORBIDDEN)
        "404":
          description: No such session in this realm (SESSION_NOT_FOUND)

  # ── Audit + permission READS (CR-CHAT-021, §4 rows 21-23) ──
  # Three READ-ONLY surfaces over events the bus ALREADY records: the session
  # log's membership/lifecycle records and, when the CR-CHAT-003 ACL is armed,
  # its grant records. Nothing is written by a GET here — the delivery-log
  # (row 20/21) opt-in precedent is answered by not writing anything, not by
  # gating a read behind a flag; GET /delivery-log remains the OPT-IN
  # dead-letter/moderation surface it is and is NOT a session audit.
  /sessions/{id}/audit:
    get:
      operationId: getSessionAudit
      tags: [sessions]
      summary: The session+principal audit trail (a CLOSED event vocabulary)
      description: |-
        The audit panel (CHAT-INTERFACE §4 row 21): Time / Principal / Event /
        Details. The event vocabulary is CLOSED — the response carries it —
        and an event kind outside it is REFUSED at the write boundary, never
        skipped and never guessed. Message records are deliberately NOT audit
        events (they are the transcript, row 14).

        Sources, stated honestly per backend: the JSONL log renders its full
        record stream (session.start/close/reopen, member.added/removed,
        member.context, thread.branched — the full event history, §2.3); the
        SQL view renders its projected LATEST-STATE facts (session.start,
        member.added/removed, session.close when closed — a re-join reads as
        one add and a close+reopen pair as neither). When the CR-CHAT-003 ACL
        is armed, grants on the session's subject overlay as
        permission.grant / permission.revoke events from the permission log,
        including tombstones.
      parameters:
        - $ref: "#/components/parameters/SessionID"
        - $ref: "#/components/parameters/XCrierNamespace"
      responses:
        "200":
          description: The audit trail with its closed vocabulary.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionAuditTrail"
        "403":
          description: The session is private and the caller is neither a member nor granted a read (VISIBILITY_FORBIDDEN)
        "404":
          description: No such session in this realm (SESSION_NOT_FOUND)

  /sessions/{id}/permissions:
    get:
      operationId: getSessionPermissions
      tags: [sessions]
      summary: The permission matrix for a session
      description: |-
        The matrix (CHAT-INTERFACE §4 row 23): the send / read / invite /
        admin columns against every ACTIVE participant, one row per
        participant with its role (row 22's badge) and one cell per column.
        A cell's `source` names where it came from — `role` (the role bundle)
        or `grant` (a live CR-CHAT-003 grant on the session subject). False is
        a dash, never an error: the matrix is a read of what IS.
      parameters:
        - $ref: "#/components/parameters/SessionID"
        - $ref: "#/components/parameters/XCrierNamespace"
      responses:
        "200":
          description: The permission matrix.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionPermissionMatrix"
        "403":
          description: The session is private and the caller is neither a member nor granted a read (VISIBILITY_FORBIDDEN)
        "404":
          description: No such session in this realm (SESSION_NOT_FOUND)

  /sessions/{id}/roles:
    get:
      operationId: getSessionRoles
      tags: [sessions]
      summary: The per-principal role badges
      description: |-
        The role pill per participant (CHAT-INTERFACE §4 row 22): the role
        RECORDED on the membership event. Every member has exactly one role
        (§2.1); a join that names none has `member` applied and RECORDED at
        join time, so a badge is always the durable event's role, never a
        client-side guess. A removed member keeps its badge with
        `active: false`.
      parameters:
        - $ref: "#/components/parameters/SessionID"
        - $ref: "#/components/parameters/XCrierNamespace"
      responses:
        "200":
          description: The role badges.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionRoleBadges"
        "403":
          description: The session is private and the caller is neither a member nor granted a read (VISIBILITY_FORBIDDEN)
        "404":
          description: No such session in this realm (SESSION_NOT_FOUND)

  # ── Dagger control (CR-CHAT-033) ──
  # The OPT-IN control surface over a Hermes-dagger pipeline. crier does NOT
  # embed a second executor (decision D18): every route here is a CLIENT call
  # to the dagger HTTP/JSON endpoint named by CR_DAGGER_URL, and crier holds
  # only the run's record (id, state, evidence references, requesting agent).
  # All six routes exist ONLY while CR_DAGGER_URL is set; with it unset they
  # are not registered at all and answer the router's JSON 404.
  #
  # A run that reaches a terminal state (`succeeded` / `failed` / `cancelled`)
  # is delivered to the REQUESTING agent's durable inbox exactly once, through
  # the shipped delivery path (the same store write a MESSAGE_EXPIRED receipt
  # uses) — never a side channel.
  /dagger/runs:
    post:
      operationId: daggerCreateRun
      tags: [dagger]
      summary: Create a Dagger run
      description: |-
        Start a prompt-driven DAG and record it. The run id comes from
        the executor; crier never mints one, because an id it invented would
        name nothing the executor could be asked about.

        The create records the REQUESTING agent: when the run reaches a
        terminal state, the outcome is delivered to that agent's durable inbox.

        The optional `target` names WHERE the run executes (CR-CHAT-035):
        absent or empty = the local dagger surface (CR_DAGGER_URL, recorded as
        `local`), or a named remote target from the CR_DAGGER_TARGET_<NAME>
        table. The resolved target is recorded at create time and NEVER
        re-resolved — later observations always go to the recorded target.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [agent_id, prompt]
              properties:
                agent_id:
                  type: string
                  description: The agent the run is started for — the inbox a terminal outcome is delivered to.
                prompt:
                  type: string
                  description: The prompt describing the DAG to run.
                target:
                  type: string
                  description: |-
                    Optional execution target (CR-CHAT-035): empty = local, or a
                    named remote target configured via CR_DAGGER_TARGET_<NAME>.
                    Recorded at create time and never re-resolved. An unknown
                    name is refused with 400 before any bridge is touched.
      responses:
        "201":
          description: The run was created and recorded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DaggerRunRecord"
        "400":
          description: "`invalid dagger request` — a missing `agent_id`/`prompt`, or a body member this operation does not declare."
        "502":
          description: "The dagger surface refused the create (transport failure, non-2xx answer) — NOTHING is recorded locally, because crier never falls back to executing anything itself."
        "503":
          description: "`DAGGER_UNCONFIGURED` — the server runs with no dagger bridge wired (CR_DAGGER_URL unset)."
  /dagger/runs/{id}:
    get:
      operationId: daggerRunStatus
      tags: [dagger]
      summary: Read a Dagger run's record
      description: |-
        Observe a run: crier asks the dagger surface for the current state and
        returns the record it holds, updating it with what the executor
        reported. The FIRST observation of a terminal state delivers the
        outcome to the requesting agent's inbox.

        A status word the server cannot map is recorded as `unknown` rather
        than guessed at, and `unknown` is NOT terminal — it never fires a
        completion.
      parameters:
        - name: id
          in: path
          required: true
          description: Run id returned by the create operation.
          schema:
            type: string
      responses:
        "200":
          description: The run's record.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DaggerRunRecord"
        "404":
          description: "`dagger run not found` — crier holds no record for this id, or the executor does not know it."
        "502":
          description: The dagger surface could not be reached to observe the run.
        "503":
          description: "`DAGGER_UNCONFIGURED` — no dagger bridge is wired (CR_DAGGER_URL unset)."
  /dagger/runs/{id}/cancel:
    post:
      operationId: daggerCancelRun
      tags: [dagger]
      summary: Cancel a Dagger run
      description: |-
        Ask the executor to cancel a running DAG. The state the executor reports
        wins; a cancel that reported no state is recorded as `cancelled`, which
        is what cancelling means.
      parameters:
        - name: id
          in: path
          required: true
          description: Run id to cancel.
          schema:
            type: string
      responses:
        "200":
          description: The run's updated record (terminal `cancelled` on success).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DaggerRunRecord"
        "404":
          description: "`dagger run not found`."
        "502":
          description: The dagger surface refused the cancel.
        "503":
          description: "`DAGGER_UNCONFIGURED` — no dagger bridge is wired (CR_DAGGER_URL unset)."
  /dagger/runs/{id}/resume:
    post:
      operationId: daggerResumeRun
      tags: [dagger]
      summary: Resume a Dagger run from its last checkpoint
      description: |-
        Ask the executor to continue a paused DAG from its last checkpoint. The
        state the executor reports wins; a resume that reported no state is
        recorded as `running`.
      parameters:
        - name: id
          in: path
          required: true
          description: Run id to resume.
          schema:
            type: string
      responses:
        "200":
          description: The run's updated record.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DaggerRunRecord"
        "404":
          description: "`dagger run not found`."
        "502":
          description: The dagger surface refused the resume.
        "503":
          description: "`DAGGER_UNCONFIGURED` — no dagger bridge is wired (CR_DAGGER_URL unset)."
  /dagger/runs/{id}/rewind:
    post:
      operationId: daggerRewindRun
      tags: [dagger]
      summary: Rewind a Dagger run to a node
      description: |-
        Ask the executor to discard checkpoints from `node_id` onward. The node
        id is passed to the executor VERBATIM: crier holds no graph, so it
        never validates a node against one.
      parameters:
        - name: id
          in: path
          required: true
          description: Run id to rewind.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [node_id]
              properties:
                node_id:
                  type: string
                  description: The node to rewind to; forwarded to the executor unchanged.
      responses:
        "200":
          description: The run's updated record.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DaggerRunRecord"
        "400":
          description: "`invalid dagger request` — a missing `node_id`, or a body member this operation does not declare."
        "404":
          description: "`dagger run not found`."
        "502":
          description: The dagger surface refused the rewind.
        "503":
          description: "`DAGGER_UNCONFIGURED` — no dagger bridge is wired (CR_DAGGER_URL unset)."
  /dagger/skills/{skill}/run:
    post:
      operationId: daggerRunSkill
      tags: [dagger]
      summary: Run a registered Dagger skill
      description: |-
        Run a skill REGISTERED with the executor. crier never loads or
        interprets a skill: it names it, and the executor's answer becomes the
        run's record. As with the create operation, the run's terminal outcome
        is delivered to the requesting agent's inbox.
      parameters:
        - name: skill
          in: path
          required: true
          description: Name of a skill the executor has registered.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [agent_id]
              properties:
                agent_id:
                  type: string
                  description: The agent the run is started for — the inbox a terminal outcome is delivered to.
                args:
                  type: object
                  description: Optional skill arguments (opaque JSON; forwarded unchanged).
                  additionalProperties: true
      responses:
        "201":
          description: The skill run was created and recorded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DaggerRunRecord"
        "400":
          description: "`invalid dagger request` — a missing `agent_id`, or a body member this operation does not declare."
        "404":
          description: "`dagger run not found` — the executor does not know a skill by that name, or refused it as absent."
        "502":
          description: The dagger surface refused the skill run.
        "503":
          description: "`DAGGER_UNCONFIGURED` — no dagger bridge is wired (CR_DAGGER_URL unset)."
  /dagger/wait:
    post:
      operationId: daggerDeliverAndWait
      tags: [dagger]
      summary: Deliver to an agent and wait, bounded
      description: |-
        Deliver a payload to an agent's durable inbox — through the SHIPPED
        delivery path, the same store write every delivery uses — and BLOCK,
        bounded, until the agent acks the delivered message (the ordinary
        inbox ack) or posts a reply to the wait's resolve endpoint. The next
        DAG node can then consume the resolution.

        The idempotency key is recorded BEFORE the first delivery and is
        journaled: a retried or resumed call with the SAME key — including
        one made after a server restart, recovered by replaying the journal
        — joins the SAME wait WITHOUT re-delivering, so an agent is never
        asked to do the same work twice.

        The budget is bounded on both ends: an absent, zero, negative or
        absurd `timeout_seconds` is refused, never clamped. A budget that
        expires is the NAMED error `DELIVERY_WAIT_TIMEOUT` (504), never a
        silent 200. A run cancelled while its waits are parked releases them
        with the named error `WAIT_CANCELLED` (409).

        The three wait routes exist ONLY while CR_DAGGER_URL is set, with the
        rest of the control surface.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [agent_id, payload, idempotency_key, timeout_seconds]
              properties:
                agent_id:
                  type: string
                  description: The agent whose durable inbox the payload is delivered to.
                payload:
                  description: The work the DAG node hands the agent, delivered verbatim.
                idempotency_key:
                  type: string
                  maxLength: 128
                  description: The wait's identity. One key = at most one delivery, across retries and restarts.
                timeout_seconds:
                  type: integer
                  minimum: 1
                  maximum: 120
                  description: How long the request may block, in seconds. Unbounded waits are refused, never clamped.
                run_id:
                  type: string
                  description: Optional run the wait belongs to; cancelling that run releases the wait with WAIT_CANCELLED.
      responses:
        "200":
          description: The wait resolved — the agent acked or replied.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DaggerWaitResult"
        "400":
          description: "`invalid dagger request` — a missing field, or an unbounded/absurd `timeout_seconds` (refused, never clamped)."
        "404":
          description: The target agent does not exist.
        "409":
          description: "`WAIT_CANCELLED` — the run the wait belongs to was cancelled and the wait was released."
        "503":
          description: "`DAGGER_UNCONFIGURED` — no dagger bridge is wired (CR_DAGGER_URL unset)."
        "504":
          description: "`DELIVERY_WAIT_TIMEOUT` — the budget expired with neither an ack nor a reply. The delivered work REMAINS in the agent's inbox."
  /dagger/waits/{key}/resolve:
    post:
      operationId: daggerResolveWait
      tags: [dagger]
      summary: Record a reply on a wait
      description: |-
        The replying agent's endpoint: record the node's output on the wait
        named by the idempotency key. The wait resolves, every joined caller
        returns, and the resolution is journaled. Resolving an already-
        resolved wait returns its recorded state unchanged (a duplicate
        resolve is a no-op, never an unwinding).
      parameters:
        - name: key
          in: path
          required: true
          description: The idempotency key the wait was created under.
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                message_id:
                  type: string
                  description: Optional message id the reply answers.
                reply:
                  description: The agent's output for the node, stored verbatim.
      responses:
        "200":
          description: The wait's recorded (possibly pre-existing) resolution.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DaggerWaitResult"
        "404":
          description: No wait is recorded under this key.
        "503":
          description: "`DAGGER_UNCONFIGURED` — no dagger bridge is wired (CR_DAGGER_URL unset)."
  /dagger/waits/{key}:
    get:
      operationId: daggerWaitStatus
      tags: [dagger]
      summary: Read a wait's state without joining it
      description: |-
        Read the wait's current state — `pending`, `resolved`, `cancelled` or
        `abandoned` (a delivery that failed and freed its key) — without
        blocking.
      parameters:
        - name: key
          in: path
          required: true
          description: The idempotency key the wait was created under.
          schema:
            type: string
      responses:
        "200":
          description: The wait's current state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DaggerWaitResult"
        "404":
          description: No wait is recorded under this key.
        "503":
          description: "`DAGGER_UNCONFIGURED` — no dagger bridge is wired (CR_DAGGER_URL unset)."

components:
  parameters:
    XAgentID:
      name: X-Agent-ID
      in: header
      required: true
      description: The agent claiming to act — must match the {id} in the path (else 403). Required when CR_REQUIRE_AGENT_SIG=true (the default).
      schema:
        type: string
    XAgentTs:
      name: X-Agent-Ts
      in: header
      required: true
      description: Unix timestamp (seconds) of the signature — must be within ±30s of server time.
      schema:
        type: integer
    XAgentSig:
      name: X-Agent-Sig
      in: header
      required: true
      description: Hex-encoded ed25519 signature (128 hex chars) over the payload "<METHOD>\n<path>\n<unix-seconds>" where path is the raw URL path (query string excluded).
      schema:
        type: string
    XAgentBodySHA256:
      name: X-Agent-Body-SHA256
      in: header
      required: false
      description: |-
        OPT-IN body binding (CR-CHAT-027). When PRESENT, the per-agent
        signature must cover the request body: send the lowercase hex sha256
        of the exact body and sign
        "<METHOD>\n<path>\n<unix-seconds>\nsha256:<hex>". The server recomputes
        sha256 of the delivered body and, if it does not match this value (or
        the signature does not verify over the digest-bearing transcript),
        rejects the request with 401 "body digest mismatch" — so a body
        swapped between the signed request and its delivery no longer rides a
        still-valid request signature. ABSENT (the default, and always for a
        bodyless GET/DELETE) the verification is the original 3-line
        "<METHOD>\n<path>\n<unix-seconds>" contract, unchanged.
      schema:
        type: string
        pattern: "^[0-9a-fA-F]{64}$"
    XCrierNamespace:
      name: X-Crier-Namespace
      in: header
      required: false
      description: |-
        The NAMESPACE (realm) a relay request acts in (CR-FEAT-029,
        specs/NAMESPACES.md). Absent = the default namespace, which is what
        every pre-CR-FEAT-029 client already gets. A name the server does not
        declare is refused (400 UNKNOWN_NAMESPACE) and is NEVER mapped back to
        the default namespace, so a typo cannot join the wrong realm.

        On POST /relay/publish the realm must be sent HERE, not in the body:
        the per-realm rate limit is evaluated before the body is read, and a
        `namespace` body member is refused with 400 rather than ignored. On GET
        /relay/subscribe/{topic} the `namespace` query parameter is an alias of
        this header (a browser WebSocket cannot set headers); when both are
        present they must agree, else 400.

        Publishes in one realm reach only subscribers of that same realm, even
        on an identical topic name; there is no cross-realm bridging.
      schema:
        type: string
    XCrierNamespaceToken:
      name: X-Crier-Namespace-Token
      in: header
      required: false
      description: |-
        The namespace-scoped credential a namespace with `auth: "token"`
        requires (CR-FEAT-029, specs/NAMESPACES.md §4.1). Resolved server-side
        from the namespace's `token_ref` (an `env:VAR` reference — the secret is
        never in the config file, and never echoed by any response). Required on
        the surfaces where the namespace is known: registering an agent INTO the
        namespace, delivering to an agent IN it, and publishing/subscribing in
        it on the relay. A missing or wrong credential is 401
        NAMESPACE_UNAUTHORIZED; a namespace with the default `shared` posture
        never asks for one.
      schema:
        type: string
    SessionID:
      name: id
      in: path
      required: true
      description: The session's id (an opaque, URL-safe token). A session in another realm reads as 404 — the realm wall never confirms that a session it will not serve exists.
      schema:
        type: string
    GroupName:
      name: name
      in: path
      required: true
      description: The named group's name — the same token `@team:<name>` addresses (the ident charset [A-Za-z0-9_][A-Za-z0-9_.-]*). A group of another realm reads as 404.
      schema:
        type: string
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Bearer token from CR_AUTH_TOKEN — required on all requests except /health and /version
    agentSignature:
      type: apiKey
      in: header
      name: X-Agent-Sig
      description: |-
        Per-agent ed25519 signature — the second factor on agent-owned endpoints.
        Send a hex-encoded ed25519 signature (128 hex chars) over
        "<METHOD>\n<path>\n<unix-seconds>", where path is the raw URL path with
        the query string excluded, together with the companion headers
        X-Agent-ID (must match the {id} in the path, else 403) and X-Agent-Ts
        (±30 seconds of server time). Required — alongside bearerAuth — when
        CR_REQUIRE_AGENT_SIG=true (the default) on DELETE /agents/{id}, PATCH
        /agents/{id}, GET /agents/{id}/inbox, GET /agents/{id}/inbox/stats,
        POST /agents/{id}/inbox/ack, POST /agents/{id}/inbox/transfer and
        GET /agents/{id}/inbox/dead-letters; an unsigned or invalidly signed
        request is rejected with 401.

        OPT-IN body binding (CR-CHAT-027): a caller MAY additionally send
        X-Agent-Body-SHA256 (lowercase hex sha256 of the exact request body)
        and sign "<METHOD>\n<path>\n<unix-seconds>\nsha256:<hex>", which binds
        the body to the signature: a body that differs from the signed digest
        is refused with 401 "body digest mismatch". Absent the header, the
        3-line contract above is unchanged.
  schemas:
    Group:
      type: object
      required: [name, members, created_at, updated_at]
      description: |-
        ONE named, curated set of agents (CR-CHAT-013, §1.4) — an address
        target with a roster, and nothing else: no participants, no
        transcript, no state. Addressable as `@team:<name>`.
      properties:
        name:
          type: string
          description: The group's identity and its address token.
        namespace:
          type: string
          description: The realm the group lives in. Omitted for the default realm.
        members:
          type: array
          description: The CURRENT member agent ids, sorted and de-duplicated.
          items:
            type: string
        created_at:
          type: string
          format: date-time
        created_by:
          type: string
          description: Who opened the roster. Never a service identity (§1.4).
        updated_at:
          type: string
          format: date-time
          description: The last membership edit.
        updated_by:
          type: string
          description: Who made the last membership edit.
    Groups:
      type: object
      required: [groups, count]
      properties:
        groups:
          type: array
          items:
            $ref: "#/components/schemas/Group"
        count:
          type: integer
    CreateGroupRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          description: Must be addressable as `@team:<name>` (the ident charset).
        namespace:
          type: string
          description: The realm to create the group in; must be one this server declares.
        members:
          type: array
          description: Optional initial members (agent ids).
          items:
            type: string
        created_by:
          type: string
          description: Who creates the roster; required (the X-Agent-ID header is accepted as an alternative).
    UpdateGroupMembersRequest:
      type: object
      description: |-
        One edit over the CURRENT roster: `remove` applies first, then `add`.
        An id named in both lists is removed and then re-added (add wins).
        The edit names nothing (`add` and `remove` both absent) is a 400.
      properties:
        add:
          type: array
          items:
            type: string
        remove:
          type: array
          items:
            type: string
        actor:
          type: string
          description: Who makes the edit; the X-Agent-ID header is accepted as an alternative.
    InboxEntry:
      type: object
      required: [id, agent_id, payload, created_at, expires_at, acked]
      properties:
        id:
          type: string
          description: Message id
        agent_id:
          type: string
          description: Owning agent id
        payload:
          type: string
          format: byte
          description: Message payload as a base64-encoded string (Go []byte JSON encoding). Decode to recover the original JSON object delivered via inboxDeliver.
        created_at:
          type: string
          format: date-time
          description: Enqueue time (RFC 3339)
        expires_at:
          type: [string, "null"]
          format: date-time
          description: Expiry time (RFC 3339) for a finite lifetime, or null when the message never expires (ttl_seconds was 0). The key is always present (see the required list), so null — never the zero time 0001-01-01T00:00:00Z — is how "never expires" reaches a client; a date-parsing client must read null, not a timestamp.
        leased_at:
          type: string
          format: date-time
          description: Present when the message is currently leased
        lease_id:
          type: string
          description: Lease covering this message (present while leased)
        acked:
          type: boolean
          description: Whether the message has been acknowledged
        guard:
          $ref: "#/components/schemas/GuardVerdictMeta"
          description: "LLM message-guard verdict metadata (CR-FEAT-010) — present on guarded deliveries, absent when the guard is disabled; a sanitized entry's payload is the quarantine notice and the original rides here in quarantined_payload"
        sender:
          type: string
          description: "The agent that delivered this message (CR-FEAT-025), or absent when the delivery named no sender. Recorded WITH the message because it is the address a terminal outcome is reported to: when the message expires unacknowledged, a MESSAGE_EXPIRED receipt is written into the SENDER's inbox, which a purge that no longer knew the sender could not do. It is metadata, not routing: the webhook envelope carries its own copy."
        idempotency_key:
          type: string
          description: "The sender-supplied deduplication key this message was delivered under (CR-FEAT-025), or absent when the delivery carried none. Provenance only — the deduplication itself happens at deliver time, before the message is stored. It is what lets a dead letter state which key produced the message."
        delivery_ms:
          type: integer
          format: int64
          description: >-
            The wall-clock latency, in whole milliseconds, of the deliver
            request that stored this message (CR-CHAT-020): decode → guard →
            durable write, measured around the whole POST. This is the
            per-message figure the chat meta line draws ("⚡ 86ms"). ABSENT
            when the entry was not written by a timed deliver — a federation
            hold release, a webhook-failure notice, an expiry receipt — which
            is "not measured", never a zero: a sub-millisecond delivery is a
            real measurement and must not share a representation with "no
            delivery produced this entry". The latency of YOUR retrieve is
            not this field; it is the delivery's.
        namespace:
          type: string
          description: "The namespace (realm) this message was delivered INTO (CR-FEAT-029, specs/NAMESPACES.md). Derived from the TARGET agent's registered namespace, never from the sender's claim — a delivery that names a different realm is refused with 403 NAMESPACE_MISMATCH. Recorded WITH the message so a retrieved message states its realm even after the agent's row is gone; ABSENT means the default namespace, which is what every pre-CR-FEAT-029 message is."
        principal_id:
          type: string
          description: "The HUMAN principal this message was delivered by (CR-CHAT-007, specs/CHAT-PERMISSIONS.md §6.3/§2.1), or absent when the delivery named no principal. The request's `principal_id`, resolved through its live binding by the delivery ACL before anything is stored: it is the audit answer to \"which human spoke as which agent\" (T3). It is provenance, never routing — the sender stays the agent; the bus never sees a principal as an identity."
        location:
          $ref: "#/components/schemas/MessageLocation"
    PrincipalRecord:
      type: object
      description: |-
        A HUMAN user (CR-CHAT-007, specs/CHAT-PERMISSIONS.md §2.1) — a
        different kind of thing from an agent: a principal never appears as a
        bus identity, it is the ANSWER to "which human spoke as which agent".
        `kind` is part of the record so an id is never guessed as "agent or
        human" by its shape.
      properties:
        id:
          type: string
          description: The minted principal id (`prin_…`).
        kind:
          type: string
          description: Always `principal`.
        display_name:
          type: string
        namespace:
          type: string
          description: The realm the principal belongs to; absent = the default realm.
        role:
          type: string
          description: The namespace role bundle (§5.2); absent = no role.
        status:
          type: string
          enum: [invited, active, suspended, revoked]
          description: The lifecycle state (§2.2).
        created_at:
          type: string
          format: date-time
    BindingRecord:
      type: object
      description: |-
        A principal's speech right onto an agent (CR-CHAT-007, §2.3): "this
        human may speak AS this agent". It does NOT say "may read its inbox"
        and it does not by itself admit a send (§6.5).
      properties:
        id:
          type: string
          description: The minted binding id (`bind_…`).
        kind:
          type: string
          description: Always `binding`.
        principal:
          type: string
        agent:
          type: string
        as_agent:
          type: boolean
          description: "True is the only value this version defines (§2.3)."
        created_at:
          type: string
          format: date-time
        created_by:
          type: string
          description: "`admin` in phase 1 — no login exists yet (§2.4)."
    GrantRecord:
      type: object
      description: |-
        An ACL entry binding a principal to a subject with an action set
        (CR-CHAT-007, §6.1).
      properties:
        id:
          type: string
          description: The minted grant id (`grant_…`).
        kind:
          type: string
          description: Always `grant`.
        principal:
          type: string
          description: A principal id, NEVER an agent id (§6.1).
        subject:
          type: object
          properties:
            type:
              type: string
              enum: [agent, group, capability, session, namespace]
            ref:
              type: string
        actions:
          type: array
          items:
            type: string
            enum: [send, read, invite, admin, mint, invoke]
        granted_by:
          type: string
          description: "`admin` in phase 1 — no login exists yet (§2.4)."
        granted_at:
          type: string
          format: date-time
        expires_at:
          type: [string, "null"]
          format: date-time
          description: "null = no expiry; a timestamp = the grant is inert after it (§6.1)."
        note:
          type: string
    MessageLocation:
      type: object
      description: |-
        The machine-readable WHERE of a delivered message (CR-CHAT-029): the
        agent can SAY where it is — instance, namespace, channel, thread and
        sub-thread — populated by the delivery path itself, never inferred from
        prose. An agent takes this location and issues the location-addressed
        fetch GET /sessions/{channel}/threads/{thread}/messages to read the
        context of the place it is in. Absent on entries written before
        CR-CHAT-029 and on deliveries with no location context at all.
      properties:
        instance:
          type: string
          description: The serving relay's name (CR_FED_NAME / host:port — the same name /fed/peers announces). Absent when the deployment names no instance.
        namespace:
          type: string
          description: The realm the message was delivered into. ABSENT means the default namespace.
        channel:
          type: string
          description: The session id the message was delivered into (the deliver body's session_id).
        thread:
          type: string
          description: The thread's root message id (specs/CHAT-SESSIONS.md §4.3).
        sub_thread:
          type: string
          description: The sub-thread's id when the send spawned a deliberately branched child thread (§4.5); `thread` then names the PARENT thread the child branched from. Absent on a plain in-thread delivery.
    DeadLetter:
      type: object
      required: [message_id, agent_id, payload, created_at, expires_at, dead_lettered_at, reason]
      properties:
        message_id:
          type: string
          description: "The id the message was delivered under. It is the primary key of the dead-letter destination, which is what makes a dead letter exactly-once: the same message cannot be recorded twice, and therefore cannot produce a second expiry receipt."
        agent_id:
          type: string
          description: "The inbox the message died in — the TARGET of the delivery, not its sender."
        sender:
          type: string
          description: "The agent that delivered the message, or absent when the delivery named none. It is the address the MESSAGE_EXPIRED receipt went to."
        payload:
          type: string
          format: byte
          description: "The stored message body, base64-encoded (Go []byte JSON encoding), byte-for-byte what was delivered — after the guard's verdict was applied, exactly like the inbox copy. This is the record a sender re-delivers from."
        created_at:
          type: string
          format: date-time
          description: When the message was delivered (RFC 3339).
        expires_at:
          type: string
          format: date-time
          description: "The expiry instant that elapsed unacknowledged (RFC 3339). Always finite: a message that never expires (ttl_seconds=0) is never purged and so never dead-lettered."
        dead_lettered_at:
          type: string
          format: date-time
          description: When the expiry sweep removed the message from the inbox (RFC 3339).
        reason:
          type: string
          description: "Why the message was dead-lettered. `ttl_expired_unacked` is the only reason the inbox lane produces today."
        idempotency_key:
          type: string
          description: "The sender-supplied key the delivery carried, or absent when it carried none (CR-FEAT-025)."
        namespace:
          type: string
          description: "The namespace (realm) the message belonged to when it expired (CR-FEAT-029). Copied from the inbox entry at sweep time because a dead letter outlives its agent's row (the destination is deliberately not foreign-keyed) — without it, the realm whose retention policy expired the message would be unrecoverable. ABSENT = the default namespace."
        principal_id:
          type: string
          description: "The HUMAN principal the delivery was made by (CR-CHAT-007, specs/CHAT-PERMISSIONS.md §6.3), copied from the inbox entry at sweep time. A dead letter is the surviving copy of the message, so the audit answer to \"which human spoke as which agent\" (T3) survives the expiry that removed the inbox row. ABSENT when the delivery named no principal."
    NamespacePolicy:
      type: object
      required: [name, auth]
      description: "One namespace (realm) and the policy this server is enforcing for it (CR-FEAT-029, specs/NAMESPACES.md). Reported by GET /namespaces: the posture and the `env:` REFERENCE, never a resolved secret. Every policy axis is INHERITED when unset, so a namespace with no declared values behaves exactly like the pre-CR-FEAT-029 deployment."
      properties:
        name:
          type: string
          description: "Operator-facing name. `default` is the implicit namespace every deployment has; a declared namespace spells its own name."
        auth:
          type: string
          enum: [shared, token]
          description: "Authentication posture. `shared` (the default): the deployment's CR_AUTH_TOKEN bearer and per-agent ed25519 signature are the whole gate. `token`: an additional namespace-scoped credential is required on the surfaces where the namespace is known — registration into it, delivery into it, and relay publish/subscribe in it — supplied in X-Crier-Namespace-Token."
        token_ref:
          type: string
          description: "The `env:VAR` reference the required credential resolves from (present only for a `token` posture). A REFERENCE, so it is safe to report; the value it resolves to is never serialized, logged or echoed."
        configured:
          type: boolean
          description: "True when this namespace declares at least one policy value; false means every axis inherits the deployment's setting (the default namespace of an unconfigured deployment is always false)."
        rate_limit_per_minute:
          type: integer
          description: "Relay publish cap per agent WITHIN this namespace. Absent = the deployment cap (CR_RATE_LIMIT_PER_MINUTE). 0 = no per-namespace cap. The counter is keyed by (namespace, agent), so two namespaces never consume each other's budget."
        guard_enabled:
          type: boolean
          description: "Whether the LLM message guard is consulted for deliveries INTO this namespace. Absent = the deployment's guard posture. false SKIPS the choke point entirely for this namespace's deliveries, which is what keeps one realm's traffic out of the process-wide guard budget and circuit breaker."
        has_guard_policy:
          type: boolean
          description: "True when the namespace declares a guard_policy (the realm-level default policy for deliveries into it; an agent's own guard.policies still outrank it). The policy itself is not echoed here."
        retention_seconds:
          type: integer
          description: "Default message lifetime for deliveries into this namespace, in seconds. Absent = the store's DefaultMessageTTL (24h). An explicit ttl_seconds on a delivery always wins."
        agents:
          type: integer
          description: "Live census: agents registered into this namespace, derived from the same rows the delivery path routes on."
    GuardAgentConfig:
      type: object
      required: [policies]
      description: "LLM message-guard configuration carried on an agent registration (Agent.guard, CR-FEAT-010, spec LLM-MESSAGE-GUARD.md §4.1). At least one policy required. API keys are never part of it — only env: refs. Resolution (spec §4.2, CR-FEAT-011): first policy in list order whose channel_match matches the message's session/thread wins; a policy with channel_match \"\" or \"*\" is the agent default (list it last); no match → the server default (CR_GUARD_DEFAULT_POLICY env) → the built-in default."
      properties:
        policies:
          type: array
          minItems: 1
          description: "Policies in resolution order (spec §4.2) — first channel_match match wins"
          items:
            $ref: "#/components/schemas/GuardPolicy"
    GuardPolicy:
      type: object
      required: [id]
      description: "One guard policy. Inline minimal form: {id, fail_closed, providers:[{model, base_url, api_key_ref}]}; a bare id naming a built-in named policy (e.g. \"default\") also resolves."
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 64
          description: Policy id — unique within the agent
        channel_match:
          type: string
          maxLength: 256
          description: "Channel glob (spec §4.2, CR-FEAT-011): Go path.Match pattern matched against session:<session_id> and thread:<thread_id> — a policy matches if it matches either key; a bare glob (no session:/thread: prefix) matches session_id only; \"\" or \"*\" = agent default (matches every channel, including unchanneled messages)"
        checks:
          $ref: "#/components/schemas/GuardChecks"
        thresholds:
          $ref: "#/components/schemas/GuardThresholds"
        action:
          type: string
          enum: [allow, block, sanitize]
          description: "Guard-error path action when fail_closed (default block, spec §3.6)"
        fail_closed:
          type: boolean
          default: false
          description: "true = guard errors block the message (apply action); false (default) = fail open (deliver with guard_error metadata). A high-confidence deterministic pre-scan hit blocks under fail_open too — the pre-scan is provider-independent (DF-CRIER-158, spec §3.6)"
        providers:
          type: array
          maxItems: 5
          description: "Provider failover chain — empty = [deepseek preset] (deepseek-v4-flash, thinking disabled)"
          items:
            $ref: "#/components/schemas/GuardProviderSpec"
        kanban:
          $ref: "#/components/schemas/GuardKanbanConfig"
    GuardChecks:
      type: object
      description: "Attack-class toggles (spec §4.1) — false removes the class from the prompt and suppresses its prematch patterns; absent = true"
      properties:
        instruction_injection:
          type: boolean
        jailbreak:
          type: boolean
        masquerade:
          type: boolean
        structured_object:
          type: boolean
    GuardThresholds:
      type: object
      description: "Deterministic escalation caps (spec §3.4) — the LLM can never under-block below block_risk"
      properties:
        block_risk:
          type: string
          enum: [low, medium, high]
          default: high
    GuardProviderSpec:
      type: object
      required: [provider]
      description: "One provider in the failover chain (spec §5.1). Named presets: deepseek (default base https://api.deepseek.com/v1, env:DEEPSEEK_API_KEY, deepseek-v4-flash — thinking forbidden), groq (env:GROQ_API_KEY), nvidia (env:NVIDIA_API_KEY). custom requires base_url + api_key_ref."
      properties:
        provider:
          type: string
          enum: [deepseek, groq, nvidia, custom]
        model:
          type: string
          description: Empty = preset default model
        base_url:
          type: string
          description: Empty = preset default base URL (required for custom)
        api_key_ref:
          type: string
          description: "env:VAR reference — resolved at call time, never stored inline (required for custom)"
        thinking_enabled:
          type: boolean
          default: false
          description: "Adds the thinking field to the request; hard-forbidden on the deepseek preset (spec §5.2)"
    GuardKanbanConfig:
      type: object
      description: "CR-FEAT-014 output option (spec §8) — opt-in per policy, OFF by default; cards are written fire-and-forget to the configured CardWriter — the `hermes kanban create` CLI by default, or an HTTP sink POSTing the card JSON when CR_GUARD_KANBAN_URL is set (CR-FEAT-009) — never blocking the delivery"
      properties:
        enabled:
          type: boolean
          default: false
        on:
          type: string
          enum: [block, all]
          default: block
          description: "block (default) = card when the verdict is block/sanitize (or a guard-error whose error-path decision is block); all = card for every guarded message on the channel"
        assignee:
          type: string
          description: "Card assignee; empty defaults to the operator (Bane)"
        board_url:
          type: string
          description: "Originating project board link for the card (e.g. the crier board path)"
    GuardVerdictMeta:
      type: object
      description: "Per-message guard verdict metadata (spec §3.7) — carried on webhook envelope crier.guard, inbox entries, deliver responses, kanban cards, and emitted as X-Crier-Guard-* headers"
      required: [decision, risk_level, reason]
      properties:
        message_id:
          type: string
          description: "Guarded message id (spec §8.2 — populated on the envelope path)"
        decision:
          type: string
          enum: [allow, block, sanitize]
        risk_level:
          type: string
          enum: [low, medium, high]
        reason:
          type: string
          description: "Justification — guard_error: … when the verdict came from the error path"
        matched_patterns:
          type: array
          items:
            type: string
          description: "Attack-class identifiers / pattern names (spec §1.1, §6.4)"
        policy:
          type: string
          description: Policy id
        provider:
          type: string
          description: Provider that produced the verdict
        model:
          type: string
          description: Model that produced the verdict
        errored:
          type: boolean
          description: "true when the verdict is not the product of a completed LLM check: the guard-error path (§3.6) or the §6.3 over-cap path's allow outcomes, where the LLM is never consulted (DF-CRIER-294)"
        quarantined:
          type: boolean
          description: "true when the message was sanitized — the delivered payload is the quarantine notice"
        quarantined_payload:
          type: string
          format: byte
          description: "base64(std) of the ORIGINAL payload when sanitized (spec §3.5) — recipient's choice whether to recover it"
    GuardBlockedResponse:
      type: object
      required: [error, guard]
      description: "Uniform 403 body for guard-blocked deliveries (spec §2.1/§9.3) — every delivery mode"
      properties:
        error:
          type: string
          enum: [GUARD_BLOCKED]
        guard:
          $ref: "#/components/schemas/GuardVerdictMeta"
    WebhookConfig:
      type: object
      description: "Webhook endpoint configuration (CR-FEAT-001, spec WEBHOOK-DELIVERY.md) — the object accepted by POST /agents (`webhook` at creation) and PATCH /agents/{id} (`webhook` object registers/updates it). `url` is required when registering; the remaining fields fall back to the server defaults. Registration is strict about this object's vocabulary: an unknown or misnamed member — nested objects (`batch`, `custom_schema`, `request_shape`) included — is refused with 400 naming the member and the members that are accepted (DF-CRIER-150), so a caller that wrote e.g. `mode` instead of `delivery_mode` is told rather than silently given the default."
      properties:
        url:
          type: string
          description: Endpoint URL (http(s)://) — required when registering
        auth_type:
          type: string
          enum: [none, bearer]
        auth_value_ref:
          type: string
          description: "env:VAR reference for bearer tokens (never stored inline)"
        schema_template:
          type: string
          enum: [generic-custom, openai-compatible, hermes-http-gateway]
        custom_schema:
          type: object
          description: Bring-your-own schema — wins over the named template
        delivery_mode:
          type: string
          enum: [blocking, async, batch]
        batch:
          type: object
          description: Batch-mode coalescing (max_messages, flush_interval_s)
        retries:
          type: integer
          minimum: 0
          maximum: 10
          description: |
            Bounded redelivery budget for THIS endpoint. Absent or 0 uses the server budget
            `CR_WEBHOOK_MAX_RETRIES` (default 5); 1..10 is the budget for this endpoint; a value above the
            server setting is capped by it.
        timeout_ms:
          type: integer
          minimum: 0
          maximum: 120000
    WebhookDeliverAccept:
      type: object
      required: [id, transport, delivery_mode]
      description: "Accept body for an async/batch webhook delivery (DF-CRIER-157). The message is queued for the target's webhook endpoint and is NOT stored in its inbox, so GET /agents/{id}/inbox stays empty by design. When the queue exhausts its bounded retries (`CR_WEBHOOK_MAX_RETRIES` failing attempts — or the endpoint's smaller `retries` budget — one per `CR_WEBHOOK_REDELIVER_S` tick), exactly one durable WEBHOOK_FAILED message — {\"kind\":\"error\",\"code\":\"WEBHOOK_FAILED\",\"message_id\":\"<original>\",\"target\":\"<agent>\",\"retries\":N,\"status_code\":S,\"error\":\"…\"} — is written into the SENDER's own inbox (direct store write, never webhook-routed; `status_code` omitted and `error` carrying the string on a transport failure)."
      properties:
        id:
          type: string
          description: Assigned message id
        transport:
          type: string
          enum: [webhook]
          description: "Where the message went: \"webhook\" — the target has a webhook endpoint and its durable inbox was bypassed"
        delivery_mode:
          type: string
          enum: [async, batch]
          description: "Resolved queue semantics of this accept: `async` = one queued POST; `batch` = coalesced into the endpoint's next batch flush. The per-message `delivery_mode` override wins over the agent's configured default"
        guard:
          $ref: "#/components/schemas/GuardVerdictMeta"
          description: "Guard verdict metadata whenever the verdict is not a CLEAN pass — same contract as the 201 inbox accept (CR-FEAT-010, spec §9.3)"
        idempotent_replay:
          type: boolean
          description: "Present (true) when this accept was answered from the recorded accept of an EARLIER delivery under the same `idempotency_key` (CR-FEAT-025) — nothing was queued by this request, and `id` is the message the first delivery queued."
    DaggerRunRecord:
      type: object
      required: [run_id, state, requesting_agent, kind]
      description: |-
        crier's record of one Dagger run (CR-CHAT-033): the run id the executor
        returned, the state it last reported, the requesting agent, and
        references to the run's evidence. It is the REST body, the stored
        record and the MCP tool result — one shape, so a reader cannot tell
        them apart. The record is a REFERENCE to the executor's state, never a
        copy of its graph: crier holds no nodes, no results and no scheduler.
      properties:
        run_id:
          type: string
          description: The run id the executor assigned. crier never mints one.
        state:
          type: string
          enum: [running, succeeded, failed, cancelled, unknown]
          description: |-
            The lifecycle state crier acts on. `succeeded` / `failed` /
            `cancelled` are TERMINAL and are the only states delivered to the
            requesting agent. `unknown` is a status word crier could not map —
            it is recorded rather than guessed at, and it is NOT terminal, so
            it never fires a completion.
        requesting_agent:
          type: string
          description: The agent whose inbox a terminal outcome is delivered to. Recorded at create time and never re-resolved.
        kind:
          type: string
          enum: [prompt, skill]
          description: What created the run.
        prompt:
          type: string
          description: The create prompt (present when kind is `prompt`).
        skill:
          type: string
          description: The skill name (present when kind is `skill`).
        evidence:
          type: array
          items:
            type: string
          description: Opaque references the executor reported (checkpoint ids, artifact urls, …). crier never interprets them — and no bytes ever cross the bus, whatever the target.
        target:
          type: string
          description: |-
            WHERE the run executes (CR-CHAT-035): `local` (the default, the
            CR_DAGGER_URL surface) or the name of a configured remote target
            (CR_DAGGER_TARGET_<NAME>). Resolved at create time and recorded
            verbatim; every later observation goes to THIS target, never a
            re-resolved one.
        link_lost:
          type: boolean
          description: |-
            True when an observation to a REMOTE target failed while the run
            was non-terminal (CR-CHAT-035): an explicit held/unknown
            indication, never an invented outcome. The `state` stays exactly
            what the executor last reported and is never silently rewritten to
            a terminal word. Cleared by the next successful observation.
            Never set for a local run.
        link_lost_at:
          type: string
          format: date-time
          description: When the failed remote observation marked the link lost. Zero once cleared.
        nodes:
          type: array
          description: The last reported node shape, when the executor supplied one.
          items:
            type: object
            properties:
              id:
                type: string
              status:
                type: string
              error:
                type: string
        notified:
          type: boolean
          description: True once the terminal outcome was delivered to the requesting agent's inbox. This is what makes delivery exactly-once across repeated observations.
        notify_error:
          type: string
          description: Why a terminal delivery did not land, when it did not. A missing notification is a reported fact, never a silence.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    DaggerWaitResult:
      type: object
      required: [state]
      description: |-
        A delivery wait's state (CR-CHAT-034): what the agent did with the
        work a DAG node handed it. The same shape is the POST /dagger/wait
        resolution body and the GET /dagger/waits/{key} read-back.
      properties:
        state:
          type: string
          enum: [pending, resolved, cancelled, abandoned]
          description: |-
            `pending` = the work is delivered and nobody has answered yet;
            `resolved` = the agent acked or replied; `cancelled` = the run was
            cancelled and the wait was released; `abandoned` = the delivery
            itself failed and the idempotency key was freed for a retry. A
            TIMEOUT is NOT a state — it is the named DELIVERY_WAIT_TIMEOUT
            error.
        message_id:
          type: string
          description: The delivered message the resolution names. Absent while pending.
        reply:
          description: The replying agent's output, verbatim. Absent on an ack resolution and while pending.

    # ── Sessions (CR-CHAT-019, specs/CHAT-INTERFACE.md §4) ──
    Session:
      type: object
      required: [id, kind, created_at, created_by, state]
      description: |-
        The session object (CHAT-INTERFACE.md §4 row 11): title, id, start
        timestamp, audience count, lifecycle state and visibility.
      properties:
        id:
          type: string
        namespace:
          type: string
          description: The realm the session lives in. Omitted for the default realm (the canonical spelling of "default" is the empty string).
        kind:
          type: string
          enum: [channel, direct]
          description: A channel (a project room) and a direct message (a 1:1) are the SAME object with different defaults (CHAT-SESSIONS.md §1.2).
        title:
          type: string
        created_at:
          type: string
          format: date-time
          description: The session's start time.
        created_by:
          type: object
          description: Who created the session. Never a service identity (§1.4).
          properties:
            agent:
              type: string
            principal:
              type: string
            as_agent:
              type: string
            system:
              type: string
        state:
          type: string
          enum: [open, closed]
          description: "The lifecycle (§1.3): open accepts records; closed admits no new message, reply or membership change and retains the transcript."
        closed_at:
          type: string
          format: date-time
        visibility:
          type: string
          enum: [realm, private]
          description: "The privacy field (row 13). Omitted/`realm` = readable within the realm; `private` restricts reads to members (or a CR-CHAT-003 read grant)."
        audience_count:
          type: integer
          description: The number of ACTIVE agent participants — the size of the fan-out set a send resolves to.
        participant_count:
          type: integer
          description: Every active participant, agents and principals.
        message_count:
          type: integer
        thread_count:
          type: integer
        last_message_at:
          type: string
          format: date-time
        preview:
          type: string
          description: The `text` of the last message's payload, truncated (the existing `payload.text` convention).
    CreateSessionRequest:
      type: object
      description: POST /sessions — the creator is required (§1.4).
      properties:
        id:
          type: string
          description: Optional. Absent mints one.
        title:
          type: string
        kind:
          type: string
          enum: [channel, direct]
        namespace:
          type: string
          description: The realm to create the room in; must be one this server declares.
        visibility:
          type: string
          enum: [realm, private]
        retention_seconds:
          type: integer
          minimum: 1
          description: A message lifetime SHORTER than the realm's, never longer (§3.5).
        created_by:
          type: object
          properties:
            agent:
              type: string
            principal:
              type: string
            as_agent:
              type: string
            system:
              type: string
        principal_id:
          type: string
          description: An alternative spelling of `created_by.principal`.
        as_agent:
          type: string
        members:
          type: array
          description: Optional initial membership. Creating does not imply inviting — the creator is not added automatically.
          items:
            $ref: "#/components/schemas/AddParticipantRequest"
    AddParticipantRequest:
      type: object
      required: [member_type, member_id]
      properties:
        member_type:
          type: string
          enum: [agent, principal]
        member_id:
          type: string
        role:
          type: string
          description: The member's single role. Defaults to `member`. The role VOCABULARY is CHAT-PERMISSIONS.md's (CR-CHAT-003); it is stored as data.
        context_share:
          type: object
          description: The late-join context answer (§4.6, D10), recorded on the membership event.
          properties:
            mode:
              type: string
              enum: [none, summary, full, since]
            boundary_message_id:
              type: string
        actor:
          type: string
          description: The agent id recording the change; falls back to the X-Agent-ID header.
    SetMemberContextRequest:
      type: object
      required: [mode]
      description: A LATER change to a member's context share (§4.6 rule 3) — recorded as a session.member.context event, never a rewrite of the join.
      properties:
        mode:
          type: string
          enum: [none, summary, full, since]
        boundary_message_id:
          type: string
          description: Required when mode is `since` — the messages after this id are what the member is given.
        actor:
          type: string
          description: The agent id recording the change; falls back to the X-Agent-ID header.
    MemberContextState:
      type: object
      required: [session_id, member_type, member_id, mode, set_at]
      description: The latest-state context-share row for one member (§5.2 chat_context_shares); the events remain the record of how it changed.
      properties:
        session_id:
          type: string
        member_type:
          type: string
          enum: [agent, principal]
        member_id:
          type: string
        mode:
          type: string
          enum: [none, summary, full, since]
        boundary_message_id:
          type: string
        set_by:
          type: string
        set_at:
          type: string
          format: date-time
    MemberContextView:
      type: object
      required: [session_id, member_type, member_id, decided, given_count, explanation]
      description: |-
        The member's MATERIALIZED context view (§4.6, D10): the recorded share,
        what the member was given at its join, and the explanation tying its
        reply state to what it holds.
      properties:
        session_id:
          type: string
        member_type:
          type: string
          enum: [agent, principal]
        member_id:
          type: string
        decided:
          type: boolean
          description: False only for a member whose share was never decided — distinct from an explicit `none` (§4.6 rule 6).
        share:
          type: object
          description: The latest recorded share answer; absent while undecided.
          properties:
            mode:
              type: string
              enum: [none, summary, full, since]
            boundary_message_id:
              type: string
        set_by:
          type: string
        set_at:
          type: string
          format: date-time
        generated_summary:
          type: string
          description: The GENERATED digest text for mode `summary` — an index, never a replacement for the raw messages (§4.7 rule 2).
        given_message_ids:
          type: array
          items:
            type: string
          description: The message ids the member was given, in seq order (modes `since` and `full`).
        given_count:
          type: integer
        explanation:
          type: string
          description: Why the joiner's reply state is what it is — what it was given, and what was withheld.
    SessionParticipant:
      type: object
      required: [member_type, member_id, role, added_at, active]
      properties:
        member_type:
          type: string
          enum: [agent, principal]
        member_id:
          type: string
          description: |-
            The member's identity. A REMOTE participant (CR-CHAT-023) carries a
            remote-qualified id `remote:<peer id>:<external subject id>` naming
            the peer instance it lives on and its id there.
        role:
          type: string
        added_at:
          type: string
          format: date-time
        removed_at:
          type: string
          format: date-time
        active:
          type: boolean
        remote:
          type: boolean
          description: |-
            True when the participant lives on a federated PEER instance
            (CR-CHAT-023): its member_id is remote-qualified, its permissions are
            decided on THIS instance (peer policy + local ACL), and it is never
            presented as a local participant. Absent (omitempty) for locals.
        context_share:
          type: object
          properties:
            mode:
              type: string
            boundary_message_id:
              type: string
    SessionParticipants:
      type: object
      required: [session_id, participants, count]
      properties:
        session_id:
          type: string
        participants:
          type: array
          items:
            $ref: "#/components/schemas/SessionParticipant"
        count:
          type: integer
          description: The number of ACTIVE participants.
    TranscriptMessage:
      type: object
      required: [id, thread_id, seq, message_kind, author, audience, created_at]
      description: |-
        One transcript record (row 14) with its ancestry (rows 42, 43).
      properties:
        id:
          type: string
        thread_id:
          type: string
          description: The thread's root message id. A reply NEVER carries a new thread_id (§4.5, D11).
        parent_id:
          type: string
          description: The immediate parent's message id — reply ATTRIBUTION, not depth. Absent on a thread root.
        parent_resolvable:
          type: boolean
          description: True when parent_id names a message in this transcript, or the message is a root. False is the §4.3 broken-thread case.
        root_id:
          type: string
        seq:
          type: integer
          format: int64
          description: The ordering authority within the session (§3.1).
        message_kind:
          type: string
          enum: [plain, addressed, task]
          description: "The three structural kinds (§4.4, D12). NOT the shipped envelope `kind` (message | configure | configure_ack)."
        author:
          type: object
          properties:
            agent:
              type: string
            principal:
              type: string
            as_agent:
              type: string
            system:
              type: string
        payload:
          type: object
          description: The opaque message body. The existing convention reads `payload.text`.
        audience:
          type: object
          required: [rule, targets]
          properties:
            rule:
              type: string
              enum: [session, reply-default, explicit]
            targets:
              type: array
              items:
                type: object
                properties:
                  kind:
                    type: string
                    enum: [agent, group, capability, principal]
                  id:
                    type: string
        outcomes:
          type: array
          description: The per-target fan-out result (§3.2). A `refused` outcome is shown, never swallowed.
          items:
            type: object
            properties:
              target:
                type: string
              outcome:
                type: string
                enum: [delivered, leased, acked, expired, refused]
              inbox_entry_id:
                type: string
              detail:
                type: string
                description: Why a delivery was refused, when the caller is being told about their own send. Empty on a re-read from storage (the durable shape carries the outcome vocabulary only).
              updated_at:
                type: string
                format: date-time
        idempotency_key:
          type: string
        created_at:
          type: string
          format: date-time
        task:
          type: object
          description: |-
            The task lifecycle payload (CR-CHAT-030, specs/CHAT-STORAGE.md
            §3.7). Present on `task`-kind records only — a reader never
            guesses a kind from the text (D12).
          properties:
            task_id:
              type: string
            state:
              type: string
              enum: [open, claimed, running, done, failed]
            owner:
              type: string
              description: Who holds the claimed task; absent while open.
            updated_at:
              type: string
              format: date-time
        thread_depth:
          type: integer
          description: The thread tree's level — a deliberate branch adds one (ThreadDepth over parent_thread_id).
        reply_depth:
          type: integer
          description: The parent_id chain length — reply attribution, never depth (D11).
        spawned_thread:
          $ref: "#/components/schemas/SpawnedThread"
    SessionTranscript:
      type: object
      required: [session, messages, count]
      properties:
        session:
          $ref: "#/components/schemas/Session"
        messages:
          type: array
          items:
            $ref: "#/components/schemas/TranscriptMessage"
        count:
          type: integer
        findings:
          type: array
          description: What the reconstruction had to DECIDE about a thread key (§4.3) — a derived or broken thread, reported rather than hidden.
          items:
            type: object
            properties:
              message_id:
                type: string
              kind:
                type: string
                enum: [derived-thread-id, broken-thread]
              thread_id:
                type: string
              parent_id:
                type: string
              detail:
                type: string
    SpawnedThread:
      type: object
      required: [thread_id, parent_thread_id, anchor_message_id, root_message_id, depth, reason, non_member_addressees]
      description: |-
        The sub-thread a send SPAWNED (CR-CHAT-017, §4.5 rule 2): the message
        addressed a non-participant agent, so it branched into a child thread.
        Present only on the send that did the spawning.
      properties:
        thread_id:
          type: string
          description: The child thread's id — the branching message's own id (§4.3).
        parent_thread_id:
          type: string
          description: The thread the reply was headed for before it branched.
        anchor_message_id:
          type: string
          description: The message the branch hangs from (the parent_id the branching message carried).
        root_message_id:
          type: string
        depth:
          type: integer
          description: The child's level in the thread tree (parent depth + 1).
        reason:
          type: string
        non_member_addressees:
          type: array
          description: The addressed agents that were not session participants.
          items:
            type: string
    ThreadSummaryCard:
      type: object
      required: [thread_id, depth, message_count, participant_count, sub_thread_count, first_seq, last_seq, last_at, preview, generated]
      description: A GENERATED index over one thread (§4.7 rule 2) — never a replacement for the record.
      properties:
        thread_id:
          type: string
        parent_thread_id:
          type: string
        anchor_message_id:
          type: string
        depth:
          type: integer
          description: The thread's level in the thread tree.
        message_count:
          type: integer
        participant_count:
          type: integer
          description: Distinct agent authors in the thread.
        sub_thread_count:
          type: integer
        first_seq:
          type: integer
          format: int64
        last_seq:
          type: integer
          format: int64
        last_at:
          type: string
          format: date-time
        preview:
          type: string
          description: The last message's text, truncated for display.
        generated:
          type: boolean
          description: Always true — the summary is generated, visibly marked as such.
    CollapsedBranch:
      type: object
      required: [thread_id, depth, collapsed, summary]
      description: A branch at or beyond the depth limit, folded into a summary card (§3.8.2) — never dropped, never rendered on-screen.
      properties:
        thread_id:
          type: string
        depth:
          type: integer
        collapsed:
          type: boolean
          description: Always true on a collapsed card.
        summary:
          $ref: "#/components/schemas/ThreadSummaryCard"
    ThreadReadResponse:
      type: object
      required: [session_id, thread, depth, depth_limit, messages]
      properties:
        session_id:
          type: string
        thread:
          $ref: "#/components/schemas/Thread"
        depth:
          type: integer
          description: The thread's own level in the tree.
        depth_limit:
          type: integer
          description: The effective depth limit (the requested depth, or the default 3).
        messages:
          type: array
          description: The thread's own messages in seq order.
          items:
            type: object
            properties:
              id:
                type: string
              thread_id:
                type: string
              parent_id:
                type: string
              seq:
                type: integer
                format: int64
              message_kind:
                type: string
              author:
                type: object
              created_at:
                type: string
                format: date-time
        branches:
          type: array
          description: Sub-threads ON-SCREEN (below the depth limit), recursively.
          items:
            type: object
            properties:
              thread:
                $ref: "#/components/schemas/Thread"
              depth:
                type: integer
              messages:
                type: array
                items:
                  type: object
              branches:
                type: array
                items: { type: object }
              collapsed:
                type: array
                items:
                  $ref: "#/components/schemas/CollapsedBranch"
        collapsed:
          type: array
          description: The child branches folded into summary cards.
          items:
            $ref: "#/components/schemas/CollapsedBranch"
    ThreadMessagesResponse:
      type: object
      required: [session_id, thread_id, location, messages, count]
      description: |-
        The body of the location-addressed fetch (CR-CHAT-029 part b): the
        location echoed, plus EXACTLY the messages of that location the caller
        is permitted to read.
      properties:
        session_id:
          type: string
        thread_id:
          type: string
          description: The thread the fetch was addressed to.
        sub_thread:
          type: string
          description: Present when the fetch named ?sub_thread_id=.
        location:
          $ref: "#/components/schemas/MessageLocation"
        messages:
          type: array
          description: The permitted messages of the location, in seq order.
          items:
            $ref: "#/components/schemas/TranscriptMessage"
        count:
          type: integer
    Thread:
      type: object
      required: [id, session_id, root_message_id, created_by, created_at]
      properties:
        id:
          type: string
          description: The thread key — the root message's id (§4.3).
        session_id:
          type: string
        parent_thread_id:
          type: string
          description: Present on a sub-thread — the thread this one branched from.
        root_message_id:
          type: string
        anchor_message_id:
          type: string
          description: Present on a sub-thread — the message the branch hangs from (§4.5).
        created_by:
          type: object
          properties:
            agent:
              type: string
            principal:
              type: string
            as_agent:
              type: string
            system:
              type: string
        created_at:
          type: string
          format: date-time
    ThreadTimelineResponse:
      type: object
      required: [session_id, thread_id, current, nodes]
      properties:
        session_id:
          type: string
        thread_id:
          type: string
        current:
          type: string
          description: The thread holding the session's latest message — the rail's marked position.
        nodes:
          type: array
          items:
            type: object
            properties:
              thread_id:
                type: string
              parent_thread_id:
                type: string
              anchor_message_id:
                type: string
              depth:
                type: integer
              root_message_id:
                type: string
              message_count:
                type: integer
              last_seq:
                type: integer
                format: int64
              current:
                type: boolean
              children:
                type: array
                items: { type: object }
    SessionSummaryResponse:
      type: object
      required: [session_id, generated, covers, trace, threads]
      properties:
        session_id:
          type: string
        generated:
          type: boolean
          description: Always true — this body is a generated index, never the record (§4.7 rule 2).
        covers:
          type: object
          required: [session_id, thread_ids, message_count]
          properties:
            session_id:
              type: string
            thread_ids:
              type: array
              items:
                type: string
            message_count:
              type: integer
              description: Total messages across the covered threads.
          description: What the summary covers — the session, its thread ids and the message count across them.
        trace:
          type: string
          description: The link to the ordered transcript ("/sessions/{id}/output?mode=trace") — the record one read underneath, never replaced.
        threads:
          type: array
          items:
            $ref: "#/components/schemas/ThreadSummaryCard"
    ThreadSummaryResponse:
      type: object
      required: [thread_id, summary, raw_messages, generated]
      properties:
        thread_id:
          type: string
        summary:
          $ref: "#/components/schemas/ThreadSummaryCard"
        raw_messages:
          type: string
          description: The transcript read that returns the raw messages this summary indexes (§4.7 rule 2).
        generated:
          type: boolean
          description: Always true.
    SessionSearchResponse:
      type: object
      required: [session_id, query, count, hits]
      properties:
        session_id:
          type: string
        query:
          type: string
        count:
          type: integer
        hits:
          type: array
          items:
            type: object
            required: [message_id, thread_id, seq, snippet, full_path]
            properties:
              message_id:
                type: string
              thread_id:
                type: string
              seq:
                type: integer
                format: int64
              author:
                type: string
              snippet:
                type: string
              full_path:
                type: array
                description: "[namespace, channel, thread_id, parent_thread_id?, message_id] — the location of the hit (§3.8.2)."
                items:
                  type: string
    SessionAuditTrail:
      type: object
      required: [session_id, vocabulary, events, count]
      description: |-
        The session+principal audit trail (row 21). `vocabulary` is the CLOSED
        event set; an event kind outside it cannot be appended and the read
        refuses to render one.
      properties:
        session_id:
          type: string
        vocabulary:
          type: array
          items:
            type: string
            enum: [session.start, session.close, session.reopen, member.added, member.removed, member.context, thread.branched, permission.grant, permission.revoke]
          description: The closed event vocabulary.
        events:
          type: array
          items:
            $ref: "#/components/schemas/SessionAuditEvent"
        count:
          type: integer
    SessionAuditEvent:
      type: object
      required: [kind, ts]
      properties:
        kind:
          type: string
          enum: [session.start, session.close, session.reopen, member.added, member.removed, member.context, thread.branched, permission.grant, permission.revoke]
        seq:
          type: integer
          format: int64
          description: The session record's seq when the event came from the session log; 0 for a permission event.
        ts:
          type: string
          format: date-time
        actor:
          type: object
          description: Who acted (creator for session.start; the record's actor otherwise; the granting/revoking principal for permission events).
          properties:
            agent:
              type: string
            principal:
              type: string
            as_agent:
              type: string
            system:
              type: string
        member_type:
          type: string
          enum: [agent, principal]
        member_id:
          type: string
        role:
          type: string
        reason:
          type: string
        context_share:
          type: object
          properties:
            mode:
              type: string
            boundary_message_id:
              type: string
        thread_id:
          type: string
        parent_thread_id:
          type: string
        grant_principal:
          type: string
          description: The principal a permission.grant / permission.revoke event is about.
        grant_id:
          type: string
        granted_by:
          type: string
        granted_at:
          type: string
          format: date-time
        revoked_by:
          type: string
        revoked_at:
          type: string
          format: date-time
        grant_actions:
          type: array
          items:
            type: string
          description: The action set the grant carries, copied verbatim.
    SessionPermissionMatrix:
      type: object
      required: [session_id, actions, rows, count]
      description: The permission matrix (row 23) — the columns against every ACTIVE participant.
      properties:
        session_id:
          type: string
        actions:
          type: array
          items:
            type: string
          description: The column labels, in order.
        rows:
          type: array
          items:
            $ref: "#/components/schemas/SessionPermissionRow"
        count:
          type: integer
    SessionPermissionRow:
      type: object
      required: [member_type, member_id, role, allowed]
      properties:
        member_type:
          type: string
          enum: [agent, principal]
        member_id:
          type: string
        role:
          type: string
          description: The role recorded on the membership event (row 22's badge).
        allowed:
          type: object
          description: One cell per column; true is a tick, false a dash.
          additionalProperties:
            type: boolean
        source:
          type: object
          description: Where each granted cell came from — `role` (the role bundle) or `grant` (a live CR-CHAT-003 grant on the session subject).
          additionalProperties:
            type: string
            enum: [role, grant]
    SessionRoleBadges:
      type: object
      required: [session_id, roles]
      description: The per-principal role badges (row 22).
      properties:
        session_id:
          type: string
        roles:
          type: array
          items:
            type: object
            required: [member_type, member_id, role, active]
            properties:
              member_type:
                type: string
                enum: [agent, principal]
              member_id:
                type: string
              role:
                type: string
                description: The role recorded on the membership event; the `member` default is applied and RECORDED at join time when a join names none.
              active:
                type: boolean
                description: A removed member keeps its badge with active false.
    PostSessionMessageRequest:
      type: object
      required: [payload]
      properties:
        payload:
          type: object
          description: The message body (required; a JSON object).
        sender:
          type: string
          description: The authoring agent id.
        principal_id:
          type: string
          description: A human principal acting as the author (with optional `as_agent`).
        as_agent:
          type: string
        message_kind:
          type: string
          enum: [plain, addressed, task]
        parent_id:
          type: string
          description: The message being replied to; the reply stays in that message's thread.
        thread_id:
          type: string
          description: Optional assertion of the thread; a reply that names a DIFFERENT thread than its parent's is refused (THREAD_MISMATCH).
        targets:
          type: array
          description: An explicit audience. Absent = every active participant except the author.
          items:
            type: object
            properties:
              kind:
                type: string
                enum: [agent, group, capability, principal]
              id:
                type: string
        idempotency_key:
          type: string
        request_id:
          type: string
    PostSessionTaskRequest:
      type: object
      required: [payload, targets]
      description: |-
        The POST /sessions/{id}/tasks body. The route IS the task kind —
        there is no message_kind field to upgrade (D12). Targets are the
        agents (or groups/capabilities for execution, §6.11) the task is
        addressed to.
      properties:
        payload:
          type: object
          description: The instruction body (required; a JSON object). The existing convention reads `payload.text`.
        sender:
          type: string
          description: The authoring agent id.
        principal_id:
          type: string
          description: A human principal acting as the author (with optional `as_agent`).
        as_agent:
          type: string
        parent_id:
          type: string
          description: The message to anchor the task to; the task joins that message's thread (D11).
        thread_id:
          type: string
          description: Optional assertion of the thread; a mismatch with the parent's is refused (THREAD_MISMATCH).
        targets:
          type: array
          description: The explicit target set. Required — there is no "everyone" default for work (§6.11).
          items:
            type: object
            properties:
              kind:
                type: string
                enum: [agent, group, capability]
              id:
                type: string
        idempotency_key:
          type: string
    TaskTransitionRequest:
      type: object
      required: [actor]
      description: The claim/complete body — who moves the task, and the output that lands in the thread with the transition.
      properties:
        actor:
          type: string
          description: The acting agent id (or principal id with actor_kind=principal).
        actor_kind:
          type: string
          enum: [agent, principal]
          default: agent
        as_agent:
          type: string
        payload:
          type: object
          description: The transition's output (the claim note, or the completion report the human reads in the thread).
        new_state:
          type: string
          enum: [done, failed]
          description: complete only — a failure closes with `failed` (default `done`).
    TaskTransitionResponse:
      type: object
      required: [task_id, state, message]
      properties:
        task_id:
          type: string
        state:
          type: string
          enum: [open, claimed, running, done, failed]
        owner:
          type: string
        message:
          $ref: "#/components/schemas/TranscriptMessage"
    SessionTask:
      type: object
      required: [session_id, task_id, state, updated_at, message_id, thread_id, versions]
      description: |-
        One task at its CURRENT state (DF-CRIER-304) — the state of the LATEST
        record-version over the task id (§3.7 keep-LAST).
      properties:
        session_id:
          type: string
        task_id:
          type: string
          description: The task's own id — the id the claim/complete routes and the task GET take (NOT the id of the message carrying the state).
        state:
          type: string
          enum: [open, claimed, running, done, failed]
        owner:
          type: string
          description: Who holds the claimed task; absent while open.
        updated_at:
          type: string
          format: date-time
          description: The ts of the record-version that last moved the state.
        message_id:
          type: string
          description: The message record-version carrying this state.
        thread_id:
          type: string
          description: The thread the task and its transitions live in.
        versions:
          type: integer
          description: How many record-versions the transcript holds for this task — 1 at creation, one more per transition.
    SessionTaskList:
      type: object
      required: [session_id, tasks, count]
      description: The GET /sessions/{id}/tasks body (DF-CRIER-304).
      properties:
        session_id:
          type: string
        tasks:
          type: array
          description: One entry per task in the session, at its current state. Always an array — empty, never null.
          items:
            $ref: "#/components/schemas/SessionTask"
        count:
          type: integer
    SessionTaskCreated:
      description: |-
        The POST /sessions/{id}/tasks 201 body (DF-CRIER-304): the recorded
        task message (TranscriptMessage) with the task's OWN id and current
        state lifted to the top level, so a caller reads them where it looks
        rather than only under the nested `task` object.
      allOf:
        - $ref: "#/components/schemas/TranscriptMessage"
        - type: object
          required: [task_id, state]
          properties:
            task_id:
              type: string
              description: The task's own id — the id the claim/complete and task GET routes take (the promoted `id` remains the message id).
            state:
              type: string
              enum: [open, claimed, running, done, failed]
              description: The task's current lifecycle state; `open` at creation.
    CompileSessionRequest:
      type: object
      description: |-
        The sources to merge and where the merged message goes. At least one
        source is required; a source with an empty `message_id` is refused rather
        than skipped.
      properties:
        message_ids:
          type: array
          description: The shorthand form — message ids of THIS session, gathered across threads or within one.
          items:
            type: string
        sources:
          type: array
          description: The explicit form — `{session_id, message_id}`, for a source in another session of the same realm (an absent `session_id` means this session).
          items:
            type: object
            required: [message_id]
            properties:
              session_id:
                type: string
              message_id:
                type: string
        note:
          type: string
          description: The compiler's optional note; it becomes the bundle's `text`.
        sender:
          type: string
          description: The authoring agent id.
        principal_id:
          type: string
          description: A human principal acting as the author (with optional `as_agent`).
        as_agent:
          type: string
        message_kind:
          type: string
          description: "`plain` or `addressed` only. A compile is addressing, never an instruction to execute (D12): `task` is refused."
          enum: [plain, addressed]
        targets:
          type: array
          description: The agents (or principals) to hand the compiled message to. Absent = every active participant except the author.
          items:
            type: object
            properties:
              kind:
                type: string
                enum: [agent, group, capability, principal]
              id:
                type: string
        idempotency_key:
          type: string
    CompileSessionResponse:
      type: object
      required: [message, parts_count, resolved_count, omitted_count]
      properties:
        message:
          $ref: "#/components/schemas/TranscriptMessage"
        parts_count:
          type: integer
          description: How many parts the bundle carries, resolved and omitted alike.
        resolved_count:
          type: integer
          description: How many parts carry their source's content inline.
        omitted_count:
          type: integer
          description: How many parts carry a named gap instead of content.
        gaps:
          type: array
          description: The named reasons, in source order, for every omitted part.
          items:
            type: string
    ExpandCompiledMessageResponse:
      type: object
      required: [message_id, session_id, parts, count, resolved_count, omitted_count]
      properties:
        message_id:
          type: string
        session_id:
          type: string
        parts:
          type: array
          items:
            type: object
            required: [source_session_id, source_message_id, cited, resolved]
            properties:
              source_session_id:
                type: string
              source_message_id:
                type: string
              cited:
                type: boolean
              resolved:
                type: boolean
              content:
                type: object
                description: The original message's payload — present only when resolved.
              author:
                type: object
                description: The original message's author — present only when resolved.
              created_at:
                type: string
                format: date-time
              seq:
                type: integer
                description: The original's seq in its own session.
              thread_id:
                type: string
              omitted:
                type: string
                description: The named gap — present exactly when resolved is false.
        count:
          type: integer
        resolved_count:
          type: integer
        omitted_count:
          type: integer
